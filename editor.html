<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 可视化演示编辑台 (V18 Office-Ribbon Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="components/vip-download-guard.js"></script>
    <script src="components/zero-auth.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .slide-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .ribbon-tab { @apply px-4 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-white transition-colors; }
        .ribbon-tab.active { @apply text-blue-400 border-blue-500; }
        .tool-btn { @apply p-1.5 rounded hover:bg-slate-700 text-slate-300 hover:text-white transition-colors; }
        
        [contenteditable="true"]:focus { outline: 2px dashed rgba(59, 130, 246, 0.5); cursor: text; background: rgba(15, 23, 42, 0.4); border-radius: 4px;}

        .bg-photo-tech {
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.75) 100%), url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-photo-finance {
            background-image: linear-gradient(135deg, rgba(10, 15, 30, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-photo-team {
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.92) 100%), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-style-mesh {
            background: radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 45%),
                        linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-800 flex flex-col z-50 shrink-0 shadow-md">
        <div class="px-6 py-2 flex items-center justify-between border-b border-slate-800/50">
            <div class="flex items-center gap-4">
                <a href="index.html#ppt-section" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded transition font-bold">← 返回商城</a>
                <span class="h-4 w-[1px] bg-slate-800"></span>
                <h1 id="deckTitleLabel" class="font-bold text-sm text-slate-200">加载中...</h1>
                <span id="deckBadgeTag" class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded font-bold">0 SLIDES</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-slate-400">商用授权价: <strong class="text-white font-mono text-sm" id="priceUsdLabel">$9.99</strong></span>
                <button onclick="exportPPT()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow-lg transition flex items-center gap-1.5">
                    <span id="exportBtnLabel">⚡ 支付 $9.99 导出包</span>
                </button>
            </div>
        </div>
        
        <div class="flex px-4 bg-slate-900">
            <div class="ribbon-tab active">开始</div>
            <div class="ribbon-tab">插入</div>
            <div class="ribbon-tab">设计</div>
            <div class="ribbon-tab">动画与切换</div>
        </div>

        <div class="bg-slate-800/40 px-6 py-2 flex items-center gap-6 overflow-x-auto custom-scroll">
            <div class="flex items-center gap-1.5 border-r border-slate-700 pr-6">
                <select onchange="document.execCommand('fontName', false, this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 outline-none cursor-pointer">
                    <option value="Inter">系统默认 (Inter)</option>
                    <option value="Microsoft YaHei">微软雅黑</option>
                    <option value="SimHei">黑体</option>
                    <option value="Georgia">Georgia (衬线)</option>
                </select>
                <select onchange="document.execCommand('fontSize', false, this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 outline-none w-16 cursor-pointer">
                    <option value="3">12pt</option>
                    <option value="4">14pt</option>
                    <option value="5">18pt</option>
                    <option value="6">24pt</option>
                    <option value="7">36pt</option>
                </select>
            </div>
            
            <div class="flex items-center gap-1 border-r border-slate-700 pr-6">
                <button onclick="document.execCommand('bold', false, null)" class="tool-btn font-black text-sm w-7" title="加粗 (Ctrl+B)">B</button>
                <button onclick="document.execCommand('italic', false, null)" class="tool-btn italic font-serif text-sm w-7" title="斜体 (Ctrl+I)">I</button>
                <button onclick="document.execCommand('underline', false, null)" class="tool-btn underline text-sm w-7" title="下划线 (Ctrl+U)">U</button>
                <div class="flex flex-col items-center justify-center gap-1 mr-4">
                    <span class="text-[10px] text-slate-400 font-mono">Color</span>
                    <div class="relative w-6 h-6 rounded overflow-hidden border border-slate-600 hover:border-blue-400 transition shadow-inner">
                        <input type="color" oninput="document.execCommand('foreColor', false, this.value)" class="absolute -top-2 -left-2 w-10 h-10 cursor-pointer opacity-0" value="#ffffff">
                        <div class="w-full h-full bg-slate-800 pointer-events-none"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 bg-slate-900/50 p-1.5 rounded-lg border border-slate-700/50 shadow-inner">
                <button onclick="document.execCommand('insertHTML', false, '<div contenteditable=\'true\' class=\'p-3 border border-blue-500/50 bg-blue-500/10 rounded min-w-[120px] min-h-[40px] inline-block m-2 shadow text-white\'>双击编辑文本框</div>')" class="flex flex-col items-center justify-center w-14 h-12 rounded hover:bg-blue-600/20 text-slate-300 hover:text-blue-400 transition group" title="插入排版文本框">
                    <svg class="w-5 h-5 mb-0.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h8M4 18h16"></path></svg>
                    <span class="text-[10px] font-bold mt-0.5">文本框</span>
                </button>
                <button onclick="const url=prompt('请输入高清图片URL:'); if(url) document.execCommand('insertImage', false, url);" class="flex flex-col items-center justify-center w-14 h-12 rounded hover:bg-emerald-600/20 text-slate-300 hover:text-emerald-400 transition group" title="插入网络图片">
                    <svg class="w-5 h-5 mb-0.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-[10px] font-bold mt-0.5">插图片</span>
                </button>
                <div class="w-px h-8 bg-slate-700 mx-1"></div>
                <button onclick="document.execCommand('insertHTML', false, '<div class=\'w-24 h-24 bg-blue-500 rounded-lg inline-block m-2 shadow-lg\'></div>')" class="flex flex-col items-center justify-center w-14 h-12 rounded hover:bg-amber-600/20 text-slate-300 hover:text-amber-400 transition group" title="插入基础形状">
                    <svg class="w-5 h-5 mb-0.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    <span class="text-[10px] font-bold mt-0.5">插形状</span>
                </button>
                <button onclick="document.execCommand('insertHTML', false, '<table class=\'w-full border-collapse border border-slate-600 text-sm my-3\'><tr><th class=\'border border-slate-600 p-2 bg-slate-800 text-white\'>标题1</th><th class=\'border border-slate-600 p-2 bg-slate-800 text-white\'>标题2</th></tr><tr><td class=\'border border-slate-600 p-2 text-white\'>数据A</td><td class=\'border border-slate-600 p-2 text-white\'>数据B</td></tr></table>')" class="flex flex-col items-center justify-center w-14 h-12 rounded hover:bg-fuchsia-600/20 text-slate-300 hover:text-fuchsia-400 transition group" title="插入数据表格">
                    <svg class="w-5 h-5 mb-0.5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span class="text-[10px] font-bold mt-0.5">插表格</span>
                </button>
            </div>

            <div class="flex items-center gap-2 border-l border-slate-700 pl-6">
                <span class="text-[10px] text-slate-500 font-bold">主题底图:</span>
                <button onclick="changeBackground('tech')" class="px-2.5 py-1 bg-blue-600/30 hover:bg-blue-600 text-blue-200 rounded border border-blue-500/40 text-[11px] transition">科技</button>
                <button onclick="changeBackground('finance')" class="px-2.5 py-1 bg-amber-600/30 hover:bg-amber-600 text-amber-200 rounded border border-amber-500/40 text-[11px] transition">金融</button>
                <button onclick="changeBackground('team')" class="px-2.5 py-1 bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 rounded border border-indigo-500/40 text-[11px] transition">团队</button>
                <button onclick="changeBackground('mesh')" class="px-2.5 py-1 bg-emerald-600/30 hover:bg-emerald-600 text-emerald-200 rounded border border-emerald-500/40 text-[11px] transition">极简</button>
            </div>
            
            <div class="flex items-center gap-2 border-l border-slate-700 pl-6">
                <span class="text-[10px] text-slate-500 font-bold">WPS 组件:</span>
                <button onclick="toggleVisualChart()" class="hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition border border-slate-700 text-[11px]">📊 图表动画</button>
                <button onclick="toggleLayoutAlign()" class="hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition border border-slate-700 text-[11px]">📐 布局切换</button>
                <button onclick="toggleCardStyle()" class="hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition border border-slate-700 text-[11px]">✨ 遮罩深度</button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-3 border-b border-slate-800 text-[10px] font-bold text-slate-400 uppercase tracking-wider flex justify-between items-center">
                <span>幻灯片页面</span>
                <span id="slideTotalBadge" class="font-mono bg-slate-800 px-2 py-0.5 rounded text-slate-400">15 P</span>
            </div>
            <div id="thumbList" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scroll"></div>
        </aside>

        <main class="flex-1 bg-slate-950 flex flex-col items-center justify-between p-5 overflow-hidden relative">
            <div id="slideCanvas" class="w-full max-w-4xl aspect-[16/9] rounded-2xl border border-slate-800 slide-shadow p-10 flex flex-col justify-between transition-all duration-300 relative overflow-hidden bg-photo-tech my-auto"></div>

            <div class="flex items-center justify-between w-full max-w-4xl text-xs text-slate-400 shrink-0">
                <span class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-xl text-slate-300">💡 提示：选中文字后，直接使用上方 Ribbon 工具栏进行排版</span>
                <div class="flex items-center gap-3">
                    <button onclick="prevSlide()" class="px-3 py-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-lg font-bold transition">← 上页</button>
                    <span id="pageCounter" class="font-mono font-bold text-slate-300 px-2">01 / 15</span>
                    <button onclick="nextSlide()" class="px-3 py-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-lg font-bold transition">下页 →</button>
                </div>
            </div>
        </main>

        <aside class="w-80 bg-slate-900 border-l border-slate-800 p-5 flex flex-col justify-between shrink-0 overflow-y-auto custom-scroll">
            <div class="space-y-3.5">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex justify-between items-center">
                    <span>全局快速宏变量</span><span class="text-blue-400 font-mono">LIVE</span>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">主数据 KPI (图表联动)</label>

                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1">数据标签 (Label)</label>
                    <input id="bindLabel" type="text" oninput="updateFromForm()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <div class="bg-gradient-to-br from-slate-950 to-blue-950 border border-blue-500/30 rounded-xl p-4 mt-6 shadow-xl">
                <div class="flex justify-between items-center text-xs mb-2">
                    <span id="exportBoxTitle" class="font-bold text-slate-200">完整高清图解包</span>
                    <span class="text-emerald-400 font-mono font-bold text-sm" id="exportBoxPrice">$9.99</span>
                </div>
                <button onclick="exportPPT()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-xs transition shadow-lg shadow-blue-600/30" id="exportBtnSub">
                    💳 立即导出 (.pptx)
                </button>
            </div>
        </aside>
    </div>

                    { id: 13, title: "新季度增长飞轮预测", sub: "基于网络效应的用户裂变", kpi: "1.8", label: "K-Factor 裂变系数", progress: 75, tag: "13. GROWTH" },
                    { id: 14, title: "客户成功团队 SLA", sub: "超预期的企业级工单响应", kpi: "<5m", label: "平均首次响应时间", progress: 95, tag: "14. CS" },
                    { id: 15, title: "净收入留存率 (NDR)", sub: "反映真实的产品增购健康度", kpi: "135%", label: "最新 NDR 指标", progress: 88, tag: "15. NDR" },
                    { id: 16, title: "市场定价与订阅层级", sub: "精准切割中小微与超大型企业", kpi: "3 档", label: "核心订阅梯度", progress: 100, tag: "16. PRICING" },
                    { id: 17, title: "竞品迁移成本分析", sub: "一键无损导入数据的战略价值", kpi: "1s", label: "极速迁移体验", progress: 90, tag: "17. MIGRATION" },
                    { id: 18, title: "核心管理层持股结构", sub: "利益深度绑定的战斗梯队", kpi: "65%", label: "团队绝对控股", progress: 100, tag: "18. CAP TABLE" },
                    { id: 19, title: "B 轮融资核心诉求", sub: "资本杠杆撬动寡头地位", kpi: "$20M", label: "本轮目标融资金额", progress: 40, tag: "19. ASK" },
                    { id: 20, title: "感谢聆听，共赴星辰", sub: "APEXWORK SAAS 期待您的加持", kpi: "100%", label: "演示结束", progress: 100, tag: "20. END" }
                ]
            },
            fintech: {
                brand: "FinTech", titleName: "FinTech A 轮融资方案", badge: "12 SLIDES · FINANCE", total: 12, defaultBg: "team",
                slides: [
                    { id: 1, title: "FinTech 颠覆式创新", sub: "重塑跨境支付结算网络", kpi: "2.5M", label: "日均交易笔数", progress: 88, tag: "01. VISION" },
                    { id: 2, title: "痛点：传统清算的摩擦", sub: "高昂的手续费与 T+3 到账延迟", kpi: "3.5%", label: "行业平均抽成", progress: 20, tag: "02. PAIN" },
                    { id: 3, title: "解法：区块链底层清算", sub: "去中心化账本带来的降维打击", kpi: "T+0", label: "极致结算速度", progress: 100, tag: "03. SOLUTION" },
                    { id: 4, title: "智能合约审计与合规", sub: "全球顶级法务机构出具的白皮书", kpi: "100%", label: "合规通过率", progress: 100, tag: "04. LEGAL" },
                    { id: 5, title: "商户接驳转化漏斗", sub: "从 API 调试到真实跑单的极简体验", kpi: "80%", label: "SDK 接入转化率", progress: 85, tag: "05. SDK" },
                    { id: 6, title: "清算牌照获取时间轴", sub: "香港、新加坡与欧美的持牌进度", kpi: "3 张", label: "核心 MSO 牌照", progress: 60, tag: "06. LICENSE" },
                    { id: 7, title: "流动性资金池储备", sub: "应对极端并发的备付金机制", kpi: "$50M", label: "常备流动性资金", progress: 95, tag: "07. LIQUIDITY" },
                    { id: 8, title: "反洗钱(AML) AI 引擎", sub: "机器学习侦测异常资金流转", kpi: "99.9%", label: "拦截准确率", progress: 90, tag: "08. AML" },
                    { id: 9, title: "B端客户生态图谱", sub: "电商、航旅与数字娱乐的深度绑定", kpi: "120+", label: "深度合作平台", progress: 75, tag: "09. ECOSYSTEM" },
                    { id: 10, title: "三年期营收爆发预测", sub: "交易规模扩大带来的网络效应", kpi: "500%", label: "预计营收增幅", progress: 65, tag: "10. REVENUE" },
                    { id: 11, title: "核心创始团队背景", sub: "来自高盛与 PayPal 的金融老兵", kpi: "15年", label: "人均金融深耕", progress: 100, tag: "11. TEAM" },
                    { id: 12, title: "A 轮募资与未来展望", sub: "诚邀顶尖资方，共建金融新基建", kpi: "$15M", label: "本轮融资金额", progress: 30, tag: "12. ASK" }
                ]
            }
        };

        let currentDeckKey = 'aerotech';
        let slidesData = DECK_PRESETS['aerotech'].slides;
        let currentSlideIdx = 0;
        let currentBgStyle = 'tech';
        let currentLayoutAlign = 'center';
        let currentCardMask = 'normal';

        const bgStyles = {
            "tech": "bg-photo-tech text-white", "finance": "bg-photo-finance text-white",
            "team": "bg-photo-team text-white", "mesh": "bg-style-mesh text-white"
        };

        async function loadDeckByRouter() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('deck') || 'aerotech';
            let preset = DECK_PRESETS[key];

            if (!preset && key.startsWith('AI-')) {
                let targetAiDeck = null;

                try {
                    const localDecks = JSON.parse(localStorage.getItem('APEX_AUDIT_PRODUCTS') || '[]');
                    const blacklist = JSON.parse(localStorage.getItem('APEX_DELETED_ZOMBIES') || '[]');
                    targetAiDeck = localDecks.find(d => d.id === key && !blacklist.includes(d.id));
                } catch(e) {}

                if (!targetAiDeck) {
                    try {
                        const res = await fetch(`data/ai-generated-decks.json?_t=${Date.now()}`);
                        if (res.ok) {
                            const aiDecks = await res.json();
                            const blacklist = JSON.parse(localStorage.getItem('APEX_DELETED_ZOMBIES') || '[]');
                            targetAiDeck = aiDecks.find(d => d.id === key && !blacklist.includes(d.id));
                        }
                    } catch(e) {}
                }

                if (targetAiDeck) {
                    const aiSlides = targetAiDeck.slides || [];
                    const slideCount = aiSlides.length > 0 ? aiSlides.length : 5;

                    preset = {
                        brand: "APEXWORK AI",
                        titleName: targetAiDeck.name || targetAiDeck.title,
                        badge: targetAiDeck.category || "AI GENERATED PRO",
                        total: slideCount,
                        defaultBg: targetAiDeck.type === 'excel' ? 'finance' : (targetAiDeck.type === 'word' ? 'mesh' : 'tech'),
                        slides: Array.from({length: slideCount}).map((_, i) => {
                            const aiSec = aiSlides[i] || {};
                            return {
                                id: i + 1, 
                                title: aiSec.title || `${targetAiDeck.title} - 核心模块 ${i+1}`, 
                                sub: aiSec.sub || "此页面由 AI 智能体自动构建专属骨架，请双击输入具体商业内容。", 
                                kpi: aiSec.kpi || ("+" + Math.floor(20 + Math.random() * 300) + "%"), 
                                label: aiSec.label || "核心业务指标", 
                                progress: aiSec.progress || Math.floor(60 + Math.random() * 40), 
                                tag: `0${i+1}. ${aiSec.tag || 'MODULE'}` 
                            };
                        })
                    };
                    
                    const priceStr = `$${targetAiDeck.priceUsd || '19.99'}`;
                    document.getElementById('priceUsdLabel').innerText = priceStr;
                    document.getElementById('exportBoxPrice').innerText = priceStr;
                    document.getElementById('exportBtnLabel').innerText = `⚡ 支付 ${priceStr} 导出包`;
                    document.getElementById('exportBtnSub').innerHTML = `💳 ${priceStr} 立即导出 (.pptx)`;
                    
                    currentDeckKey = key;
                }
            }

            // 👑 终极容灾：不管什么乱七八糟的情况，要是找不到配置，老老实实回退到 aerotech！
            if (!preset) {
                currentDeckKey = 'aerotech';
                preset = DECK_PRESETS['aerotech'];
            }

            slidesData = preset.slides;
            currentBgStyle = preset.defaultBg;
            currentSlideIdx = 0;

            document.getElementById('deckTitleLabel').innerText = preset.titleName;
            document.getElementById('deckBadgeTag').innerText = preset.badge;
            document.getElementById('slideTotalBadge').innerText = `${preset.total} P`;
            document.getElementById('exportBoxTitle').innerText = `${preset.total}页高清图解包`;

            renderAll();
        }

        window.onload = async () => { await loadDeckByRouter(); };
        
        function renderAll() {
            renderThumbnails();
            renderMainSlide();
            syncFormInputs();
            scrollToActiveThumb();
        }

        function scrollToActiveThumb() {
            const activeEl = document.getElementById(`thumb-item-${currentSlideIdx}`);
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderThumbnails() {
            const list = document.getElementById("thumbList");
            const total = slidesData.length;
            list.innerHTML = "";
            slidesData.forEach((item, idx) => {
                const activeCls = idx === currentSlideIdx ? "border-blue-500 bg-slate-800 shadow-md ring-1 ring-blue-500" : "border-slate-800 bg-slate-900/60 hover:bg-slate-800/40";
                
                // 👑 防崩溃保护套：强行转换为字符串再 replace，绝不报错中断！
                const pureTitle = String(item.title || "加载中").replace(/<[^>]+>/g, '');
                const pureKpi = String(item.kpi || "0%").replace(/<[^>]+>/g, '');
                
                list.innerHTML += `
                    <div id="thumb-item-${idx}" onclick="selectSlide(${idx})" class="p-2.5 border rounded-xl cursor-pointer transition ${activeCls}">
                        <div class="flex justify-between items-center text-[10px] font-mono text-slate-400 mb-1">
                            <span>#${idx+1<10?'0'+(idx+1):idx+1}</span>
                            <span class="font-bold text-emerald-400">${pureKpi}</span>
                        </div>
                        <div class="text-xs font-bold text-slate-200 truncate" title="${pureTitle}">${pureTitle}</div>
                    </div>
                `;
            });
            document.getElementById("pageCounter").innerText = `${currentSlideIdx+1<10?'0'+(currentSlideIdx+1):currentSlideIdx+1} / ${total}`;
        }

        // 👑 彻底剔除引起白屏报错的 GSAP 动画，纯原生 HTML 硬核直出！
        function renderMainSlide() {
            const item = slidesData[currentSlideIdx];
            const canvas = document.getElementById("slideCanvas");
            
            if (!item) {
                canvas.innerHTML = '<div class="text-white text-2xl m-auto">⚠️ 数据结构缺失，请刷新重试。</div>';
                return;
            }

            const bgCls = bgStyles[currentBgStyle] || bgStyles["tech"];
            const alignCls = currentLayoutAlign === 'center' ? "text-center items-center" : "text-left items-start";
            const maskCls = currentCardMask === 'normal' ? "bg-slate-900/80" : "bg-slate-950/95";

            canvas.className = `w-full max-w-4xl aspect-[16/9] rounded-2xl border border-slate-700/80 slide-shadow p-10 flex flex-col justify-between transition-none relative overflow-hidden ${bgCls} my-auto`;
            
            canvas.innerHTML = `
                <div class="flex justify-between items-center border-b border-white/10 pb-3 z-10 w-full relative">
                    <span class="text-xs font-bold font-mono tracking-widest text-slate-300">APEXWORK · DECK</span>
                    <span class="text-[11px] font-mono font-bold px-2.5 py-0.5 bg-white/10 backdrop-blur-md rounded text-blue-300 border border-white/10">${item.tag || 'MODULE'}</span>
                </div>

                <div class="my-auto py-4 z-10 max-w-3xl flex flex-col ${alignCls} w-full mx-auto relative">
                    <div contenteditable="true" onblur="updateFromCanvas('title', this.innerHTML)" 
                        class="text-3xl md:text-4xl font-black tracking-tight leading-tight mb-3 drop-shadow-md w-full outline-none text-white">${item.title || '加载中'}</div>
                    <div contenteditable="true" onblur="updateFromCanvas('sub', this.innerHTML)" 
                        class="text-sm text-slate-300 leading-relaxed font-medium drop-shadow-sm w-full max-w-2xl outline-none">${item.sub || '加载中'}</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 pt-5 border-t border-white/10 z-10 items-center w-full relative">
                    <div class="md:col-span-5 ${maskCls} backdrop-blur-md border border-white/10 rounded-xl p-3 shadow-lg">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">${item.label || '核心指标'}</div>
                        <div contenteditable="true" onblur="updateFromCanvas('kpi', this.innerHTML)" class="text-2xl font-black font-mono text-emerald-400 drop-shadow-sm outline-none">${item.kpi || '0%'}</div>
                    </div>
                    <div class="md:col-span-7 bg-slate-900/60 backdrop-blur-md border border-white/10 rounded-xl p-3 flex flex-col justify-center">
                        <div class="flex justify-between items-center text-[11px] font-mono mb-1.5">
                            <span class="text-slate-300 font-bold">● TARGET COMPLETED</span>
                            <span class="text-blue-400 font-bold">${item.progress || 50}%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                            <div class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full rounded-full" style="width: ${item.progress || 50}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeBackground(styleKey) { currentBgStyle = styleKey; renderMainSlide(); }
        function toggleVisualChart() { slidesData[currentSlideIdx].progress = slidesData[currentSlideIdx].progress < 90 ? 98 : 65; renderMainSlide(); }
        function toggleLayoutAlign() { currentLayoutAlign = currentLayoutAlign === 'center' ? 'left' : 'center'; renderMainSlide(); }
        function toggleCardStyle() { currentCardMask = currentCardMask === 'normal' ? 'deep' : 'normal'; renderMainSlide(); }
        
        function selectSlide(idx) { currentSlideIdx = idx; renderAll(); }
        function prevSlide() { if(currentSlideIdx > 0) { currentSlideIdx--; renderAll(); } }
        function nextSlide() { if(currentSlideIdx < slidesData.length-1) { currentSlideIdx++; renderAll(); } }

        function updateFromCanvas(field, val) {
            slidesData[currentSlideIdx][field] = val;
            syncFormInputs(); 
            if (field === 'title' || field === 'kpi') renderThumbnails();
        }
        
        function updateFromForm() {
            slidesData[currentSlideIdx].kpi = document.getElementById("bindKpi").value;
            slidesData[currentSlideIdx].label = document.getElementById("bindLabel").value;
            renderThumbnails(); 
            renderMainSlide();
        }
        
        function syncFormInputs() {
            document.getElementById("bindKpi").value = String(slidesData[currentSlideIdx].kpi || '').replace(/<[^>]+>/g, '');
            document.getElementById("bindLabel").value = String(slidesData[currentSlideIdx].label || '').replace(/<[^>]+>/g, '');
        }

        function exportPPT() {
            ApexAuth.openCheckout({
                title: `APEXWORK ${DECK_PRESETS[currentDeckKey]?.total || slidesData.length}页可视化战略套件 (.PPTX)`,
                onSuccess: () => {
                    const blob = new Blob([JSON.stringify({ brand: "APEXWORK", bgStyle: currentBgStyle, slides: slidesData }, null, 2)], {type: "application/json"});
                    const a = document.createElement("a"); 
                    a.href = URL.createObjectURL(blob);
                    a.download = `${currentDeckKey}_Visual_Deck_${Date.now()}.json`;
                    document.body.appendChild(a); a.click();
                }
            });
        }
    </script>
</body>
</html>
