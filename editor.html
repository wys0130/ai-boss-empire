<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 可视化演示编辑台 (V18 Office-Ribbon Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 先加载独立风控中台，再加载收银验证模块 -->
    <script src="components/vip-download-guard.js"></script>
    <script src="components/zero-auth.js"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .slide-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* 👑 Ribbon 选项卡 UI */
        .ribbon-tab { @apply px-4 py-2 text-xs font-bold text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-white transition-colors; }
        .ribbon-tab.active { @apply text-blue-400 border-blue-500; }
        .tool-btn { @apply p-1.5 rounded hover:bg-slate-700 text-slate-300 hover:text-white transition-colors; }
        
        /* 富文本编辑时的高亮状态 */
        [contenteditable="true"]:focus { outline: 2px dashed rgba(59, 130, 246, 0.5); cursor: text; background: rgba(15, 23, 42, 0.4); border-radius: 4px;}

        .bg-photo-tech {
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.75) 100%), url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-photo-finance {
            background-image: linear-gradient(135deg, rgba(10, 15, 30, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-photo-team {
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.92) 100%), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1280&q=75&fm=webp');
            background-size: cover; background-position: center;
        }
        .bg-style-mesh {
            background: radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.25) 0%, transparent 45%),
                        linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 👑 全新 Office Ribbon 级顶部工作台 -->
    <header class="bg-slate-900 border-b border-slate-800 flex flex-col z-50 shrink-0 shadow-md">
        <!-- 顶层信息 -->
        <div class="px-6 py-2 flex items-center justify-between border-b border-slate-800/50">
            <div class="flex items-center gap-4">
                <a href="index.html#ppt-section" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded transition font-bold">← 返回商城</a>
                <span class="h-4 w-[1px] bg-slate-800"></span>
                <h1 id="deckTitleLabel" class="font-bold text-sm text-slate-200">加载中...</h1>
                <span id="deckBadgeTag" class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded font-bold">0 SLIDES</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-slate-400">商用授权价: <strong class="text-white font-mono text-sm">$9.99</strong></span>
                <button onclick="exportPPT()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow-lg transition flex items-center gap-1.5">
                    <span>⚡ 支付 $9.99 导出包</span>
                </button>
            </div>
        </div>
        
        <!-- Ribbon 选项卡分类 -->
        <div class="flex px-4 bg-slate-900">
            <div class="ribbon-tab active">开始</div>
            <div class="ribbon-tab">插入</div>
            <div class="ribbon-tab">设计</div>
            <div class="ribbon-tab">动画与切换</div>
        </div>

        <!-- Ribbon 工具条 (功能面板) -->
        <div class="bg-slate-800/40 px-6 py-2 flex items-center gap-6 overflow-x-auto custom-scroll">
            <!-- 文本格式组 -->
            <div class="flex items-center gap-1.5 border-r border-slate-700 pr-6">
                <select onchange="document.execCommand('fontName', false, this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 outline-none cursor-pointer">
                    <option value="Inter">系统默认 (Inter)</option>
                    <option value="Microsoft YaHei">微软雅黑</option>
                    <option value="SimHei">黑体</option>
                    <option value="Georgia">Georgia (衬线)</option>
                </select>
                <select onchange="document.execCommand('fontSize', false, this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 outline-none w-16 cursor-pointer">
                    <option value="3">12pt</option>
                    <option value="4">14pt</option>
                    <option value="5">18pt</option>
                    <option value="6">24pt</option>
                    <option value="7">36pt</option>
                </select>
            </div>
            
            <div class="flex items-center gap-1 border-r border-slate-700 pr-6">
                <button onclick="document.execCommand('bold', false, null)" class="tool-btn font-black text-sm w-7" title="加粗 (Ctrl+B)">B</button>
                <button onclick="document.execCommand('italic', false, null)" class="tool-btn italic font-serif text-sm w-7" title="斜体 (Ctrl+I)">I</button>
                <button onclick="document.execCommand('underline', false, null)" class="tool-btn underline text-sm w-7" title="下划线 (Ctrl+U)">U</button>
                <!-- 1. 修复：完美生效的颜色拾取器 (Color Picker) -->
                <div class="flex flex-col items-center justify-center gap-1 mr-4">
                    <span class="text-[10px] text-slate-400 font-mono">Color</span>
                    <div class="relative w-6 h-6 rounded overflow-hidden border border-slate-600 hover:border-blue-400 transition shadow-inner">
                        <!-- 核心修复：直接使用原生 color input，拉伸覆盖父级，并绑定 execCommand -->
                        <input type="color" oninput="document.execCommand('foreColor', false, this.value)" class="absolute -top-2 -left-2 w-10 h-10 cursor-pointer opacity-0" value="#ffffff" title="更改选中文字颜色">
                        <!-- 这个 div 用于视觉展示，跟着 input 的值变色 (如果需要双向绑定可以用 JS 控制其背景色) -->
                        <div class="w-full h-full bg-slate-800 pointer-events-none"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 修复：人类能看懂的对齐按钮组 (采用通用 SVG 图标) -->
            <div class="flex items-center gap-1 bg-slate-900/50 p-1 rounded-lg border border-slate-700/50">
                <button onclick="document.execCommand('justifyLeft', false, null)" class="px-2 py-1.5 text-slate-400 hover:text-white hover:bg-blue-600 rounded transition" title="左对齐">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h16"></path></svg>
                </button>
                <button onclick="document.execCommand('justifyCenter', false, null)" class="px-2 py-1.5 text-slate-400 hover:text-white hover:bg-blue-600 rounded transition" title="居中对齐">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M7 12h10M4 18h16"></path></svg>
                </button>
                <button onclick="document.execCommand('justifyRight', false, null)" class="px-2 py-1.5 text-slate-400 hover:text-white hover:bg-blue-600 rounded transition" title="右对齐">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M10 12h10M4 18h16"></path></svg>
                </button>
                <button onclick="document.execCommand('justifyFull', false, null)" class="px-2 py-1.5 text-slate-400 hover:text-white hover:bg-blue-600 rounded transition" title="两端对齐">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>

            </div>

            <div id="thumbList" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scroll"></div>
        </aside>

        <!-- 中间画布工作区 -->

            <div id="slideCanvas" class="w-full max-w-4xl aspect-[16/9] rounded-2xl border border-slate-800 slide-shadow p-10 flex flex-col justify-between transition-all duration-300 relative overflow-hidden bg-photo-tech my-auto"></div>

            <!-- 底部翻页控制器 -->
            <div class="flex items-center justify-between w-full max-w-4xl text-xs text-slate-400 shrink-0">

                <div class="flex items-center gap-3">
                    <button onclick="prevSlide()" class="px-3 py-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-lg font-bold transition">← 上页</button>
                    <span id="pageCounter" class="font-mono font-bold text-slate-300 px-2">01 / 15</span>
                    <button onclick="nextSlide()" class="px-3 py-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-lg font-bold transition">下页 →</button>
                </div>
            </div>
        </main>

                    { id: 15, title: "团队扩张与全球分支机构", sub: "跨国分布式研发与业务支撑体系布局", kpi: "210 人", label: "全球全职工程团队", progress: 78, tag: "15. TEAM" },
                    { id: 16, title: "Q4 新增战略大客户管道", sub: "重点拓展欧美金融与制造领域头部名单", kpi: "$4.5M", label: "预推单潜在意向金", progress: 84, tag: "16. PIPELINE" },
                    { id: 17, title: "年度运营开支占比优化", sub: "精细化经营管理带来的边际成本下调", kpi: "-18%", label: "单客户服务运维成本", progress: 89, tag: "17. OPEX" },
                    { id: 18, title: "2027 年战略市场扩张规划", sub: "进军亚太及欧洲垂直工业互联网赛道", kpi: "3 个", label: "下半年度新增大区", progress: 70, tag: "18. EXPAND" },
                    { id: 19, title: "长期经营现金流与红利", sub: "高毛利 SaaS 模型带来丰厚盈余沉淀", kpi: "82.5%", label: "企业综合毛利率", progress: 95, tag: "19. PROFIT" },
                    { id: 20, title: "全景经营图谱总结陈辞", sub: "坚持长期价值创造与客户业务同行", kpi: "GROWTH", label: "持续驱动发展愿景", progress: 100, tag: "20. END" }
                ]
            },
            fintech: {
                brand: "ApexFin",
                titleName: "FinTech A 轮融资方案",
                badge: "12 SLIDES · PREMIUM GOLD",
                total: 12,
                defaultBg: "finance",
                slides: [
                    { id: 1, title: "FinTech 跨境金融清算愿景", sub: "新一代去中心化企业级分布式对账网络", kpi: "$450M+", label: "累计安全处理资产", progress: 90, tag: "01. COVER" },
                    { id: 2, title: "传统跨国汇划与结算痛点", sub: "中转银行手续费高昂、清算链路周期漫长", kpi: "3 - 5 天", label: "传统国际清算周期", progress: 65, tag: "03. PAIN" },
                    { id: 3, title: "边缘分布式加密清算引擎", sub: "秒级跨币种原子对接，零中间汇损汇换", kpi: "< 1.5 秒", label: "系统端到端到账时效", progress: 98, tag: "04. SOLUTION" },
                    { id: 4, title: "双重监管合规与零反洗钱", sub: "获北美与新加坡双重核心金融机构监管", kpi: "100%", label: "合规持牌准入比率", progress: 100, tag: "05. COMPLY" },
                    { id: 5, title: "盈利模式：极低手续费抽佣", sub: "依靠庞大 B 端清算笔数实现指数级收益", kpi: "0.15%", label: "单笔清算通道费率", progress: 88, tag: "06. BIZMODEL" },
                    { id: 6, title: "过去 18 个月清算规模跃升", sub: "获得包括电商及出海企业的全量接入", kpi: "18.5x", label: "清算笔数年化增幅", progress: 94, tag: "07. TRACTION" },
                    { id: 7, title: "头部外汇与资管合规伙伴", sub: "联合顶级清算银行建立专户托管保护", kpi: "Tier 1", label: "合作托管银行等级", progress: 100, tag: "08. PARTNERS" },
                    { id: 8, title: "创始与华尔街顾问领衔团队", sub: "融合传统高盛投行与顶尖底层密码学实力", kpi: "WallSt", label: "核心金融操盘背景", progress: 92, tag: "09. TEAM" },
                    { id: 9, title: "A 轮本轮融资金额与用途", sub: "拟募集资本以推进多国金融牌照申领", kpi: "$15.0M", label: "本轮目标募集资金", progress: 80, tag: "10. FUND" },
                    { id: 10, title: "募集资本细分分配策略", sub: "专注研发深化、合规准备金及全球市场", kpi: "45%", label: "技术与底层协议预算", progress: 85, tag: "11. ALLOCATE" },
                    { id: 11, title: "3 年后上市退出通道测算", sub: "清晰的估值对标与机构回报红利空间", kpi: "8.5x+", label: "预期股权回报倍数", progress: 90, tag: "12. EXIT" },
                    { id: 12, title: "携手重构全球资本清算新规", sub: "立即对接团队获取详尽财务尽调资料包", kpi: "APEX.FIN", label: "资方尽调唯一接口", progress: 100, tag: "13. END" }
                ]
            }
        };

        let currentDeckKey = 'aerotech';
        let slidesData = DECK_PRESETS['aerotech'].slides;
        let currentSlideIdx = 0;
        let currentBgStyle = 'tech';
        let currentLayoutAlign = 'center';
        let currentCardMask = 'normal';

        const bgStyles = {
            "tech": "bg-photo-tech text-white",
            "finance": "bg-photo-finance text-white",
            "team": "bg-photo-team text-white",
            "mesh": "bg-style-mesh text-white"
        };

        function loadDeckByRouter() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('deck') || 'aerotech';
            // 兜底防崩溃：如果 AI 传来的新模板不在 DECK_PRESETS 里，退回 aerotech，实际生产中应从远端接口补充
            currentDeckKey = DECK_PRESETS[key] ? key : 'aerotech';
            const preset = DECK_PRESETS[currentDeckKey];

            slidesData = preset.slides;
            currentBgStyle = preset.defaultBg;
            currentSlideIdx = 0;

            document.getElementById('deckTitleLabel').innerText = preset.titleName;
            document.getElementById('deckBadgeTag').innerText = preset.badge;
            document.getElementById('slideTotalBadge').innerText = `${preset.total} P`;
            document.getElementById('exportBoxTitle').innerText = `${preset.total}页高清图解包`;

            renderAll();
        }

        function renderAll() {
            renderThumbnails();
            renderMainSlide();
            syncFormInputs();
            scrollToActiveThumb();
        }

        function scrollToActiveThumb() {
            const activeEl = document.getElementById(`thumb-item-${currentSlideIdx}`);
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function renderThumbnails() {
            const list = document.getElementById("thumbList");
            const total = slidesData.length;
            list.innerHTML = "";
            slidesData.forEach((item, idx) => {
                const activeCls = idx === currentSlideIdx ? "border-blue-500 bg-slate-800 shadow-md ring-1 ring-blue-500" : "border-slate-800 bg-slate-900/60 hover:bg-slate-800/40";
                
                // 去除可能带入的 HTML 标签，保证侧边栏纯净
                const pureTitle = item.title.replace(/<[^>]+>/g, '');
                
                list.innerHTML += `
                    <div id="thumb-item-${idx}" onclick="selectSlide(${idx})" class="p-2.5 border rounded-xl cursor-pointer transition ${activeCls}">
                        <div class="flex justify-between items-center text-[10px] font-mono text-slate-400 mb-1">
                            <span>#${idx+1<10?'0'+(idx+1):idx+1}</span>
                            <span class="font-bold text-emerald-400">${item.kpi.replace(/<[^>]+>/g, '')}</span>
                        </div>
                        <div class="text-xs font-bold text-slate-200 truncate" title="${pureTitle}">${pureTitle}</div>
                    </div>
                `;
            });
            document.getElementById("pageCounter").innerText = `${currentSlideIdx+1<10?'0'+(currentSlideIdx+1):currentSlideIdx+1} / ${total}`;
        }

        function renderMainSlide() {
            const item = slidesData[currentSlideIdx];
            const canvas = document.getElementById("slideCanvas");
            const bgCls = bgStyles[currentBgStyle] || bgStyles["tech"];
            const alignCls = currentLayoutAlign === 'center' ? "text-center items-center" : "text-left items-start";
            const maskCls = currentCardMask === 'normal' ? "bg-slate-900/80" : "bg-slate-950/95";

            canvas.className = `w-full max-w-4xl aspect-[16/9] rounded-2xl border border-slate-700/80 slide-shadow p-10 flex flex-col justify-between transition-all duration-300 relative overflow-hidden ${bgCls} my-auto`;
            
            // 👑 核心：innerHTML 才能渲染 Ribbon 工具加粗变色的富文本标记
            canvas.innerHTML = `
                <div class="flex justify-between items-center border-b border-white/10 pb-3 z-10">
                    <span class="text-xs font-bold font-mono tracking-widest text-slate-300">APEXWORK · DECK</span>
                    <span class="text-[11px] font-mono font-bold px-2.5 py-0.5 bg-white/10 backdrop-blur-md rounded text-blue-300 border border-white/10">${item.tag}</span>
                </div>

                <div class="my-auto py-4 z-10 max-w-3xl flex flex-col ${alignCls} w-full mx-auto">
                    <div contenteditable="true" onblur="updateFromCanvas('title', this.innerHTML)" 
                        class="text-3xl md:text-4xl font-black tracking-tight leading-tight mb-3 drop-shadow-md w-full outline-none">${item.title}</div>
                    <div contenteditable="true" onblur="updateFromCanvas('sub', this.innerHTML)" 
                        class="text-sm text-slate-300 leading-relaxed font-medium drop-shadow-sm w-full max-w-2xl outline-none">${item.sub}</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 pt-5 border-t border-white/10 z-10 items-center">
                    <div class="md:col-span-5 ${maskCls} backdrop-blur-md border border-white/10 rounded-xl p-3 shadow-lg">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">${item.label}</div>
                        <div contenteditable="true" onblur="updateFromCanvas('kpi', this.innerHTML)" class="text-2xl font-black font-mono text-emerald-400 drop-shadow-sm outline-none">${item.kpi}</div>
                    </div>
                    <div class="md:col-span-7 bg-slate-900/60 backdrop-blur-md border border-white/10 rounded-xl p-3 flex flex-col justify-center">
                        <div class="flex justify-between items-center text-[11px] font-mono mb-1.5">
                            <span class="text-slate-300 font-bold">● TARGET COMPLETED</span>
                            <span class="text-blue-400 font-bold">${item.progress}%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                            <div class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full rounded-full transition-all duration-700" style="width: ${item.progress}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeBackground(styleKey) { currentBgStyle = styleKey; renderMainSlide(); }
        function toggleVisualChart() { slidesData[currentSlideIdx].progress = slidesData[currentSlideIdx].progress < 90 ? 98 : 65; renderMainSlide(); }
        function toggleLayoutAlign() { currentLayoutAlign = currentLayoutAlign === 'center' ? 'left' : 'center'; renderMainSlide(); }
        function toggleCardStyle() { currentCardMask = currentCardMask === 'normal' ? 'deep' : 'normal'; renderMainSlide(); }
        
        function selectSlide(idx) { currentSlideIdx = idx; renderAll(); }
        function prevSlide() { if(currentSlideIdx > 0) { currentSlideIdx--; renderAll(); } }
        function nextSlide() { if(currentSlideIdx < slidesData.length-1) { currentSlideIdx++; renderAll(); } }

        // 👑 同步富文本数据
        function updateFromCanvas(field, val) {
            slidesData[currentSlideIdx][field] = val;
            syncFormInputs(); 
            if (field === 'title' || field === 'kpi') renderThumbnails();
        }
        
        function updateFromForm() {
            slidesData[currentSlideIdx].kpi = document.getElementById("bindKpi").value;
            slidesData[currentSlideIdx].label = document.getElementById("bindLabel").value;
            renderThumbnails(); 
            renderMainSlide();
        }
        
        function syncFormInputs() {
            // 右侧工具栏仅展示纯文本，过滤掉 HTML 标签以防 input 框乱码
            document.getElementById("bindKpi").value = slidesData[currentSlideIdx].kpi.replace(/<[^>]+>/g, '');
            document.getElementById("bindLabel").value = slidesData[currentSlideIdx].label.replace(/<[^>]+>/g, '');
        }

        function exportPPT() {
            ApexAuth.openCheckout({
                title: `APEXWORK ${DECK_PRESETS[currentDeckKey].total}页可视化战略套件 (.PPTX)`,
                onSuccess: () => {
                    const blob = new Blob([JSON.stringify({
                        brand: "APEXWORK", 
                        bgStyle: currentBgStyle,
                        slides: slidesData
                    }, null, 2)], {type: "application/json"});
                    const a = document.createElement("a"); 
                    a.href = URL.createObjectURL(blob);
                    a.download = `${currentDeckKey}_Visual_Deck_${Date.now()}.json`;
                    document.body.appendChild(a); a.click();
                }
            });
        }

        window.onload = () => { loadDeckByRouter(); };
    </script>
</body>
</html>
