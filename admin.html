<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEXWORK 驾驶舱 (模块化专业版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .truncate-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        #apexTooltip {
            position: fixed; z-index: 9999; pointer-events: none; display: none; max-width: 300px;
            background: #09090e; border: 1px solid #3f3f46; color: #f4f4f5; padding: 8px 12px;
            border-radius: 6px; font-size: 11px; font-family: monospace; line-height: 1.6;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8); white-space: pre-wrap;
        }
        .dept-token {
            display: inline-flex; align-items: center; background: rgba(99, 102, 241, 0.15);
            color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); padding: 1px 6px;
            border-radius: 4px; font-size: 11px; font-weight: 600; margin: 0 2px;
        }
        #mentionDropdown {
            position: absolute; z-index: 100; display: none; width: 150px; max-height: 180px;
            overflow-y: auto; border-radius: 6px; background: #141417; border: 1px solid #27272a;
        }
        .mention-item { padding: 6px 10px; font-size: 11px; cursor: pointer; font-family: monospace; color: #f4f4f5; }
        .mention-item:hover { background: #27272a; }
    </style>
</head>
<body class="bg-[#09090b] text-[#f4f4f5] min-h-screen flex flex-col justify-between p-3 font-sans">

    <div id="apexTooltip"></div>

    <!-- 极简冷灰顶栏 -->
    <header class="max-w-7xl w-full mx-auto bg-[#141417] border border-[#27272a] rounded-lg px-4 py-2 mb-2 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <h1 class="font-bold font-mono text-xs tracking-wide">APEXWORK 驾驶舱</h1>
            <span id="qaStatusBadge" class="text-[10px] font-mono px-1.5 py-0.5 bg-zinc-900 text-zinc-400 border border-zinc-800 rounded font-bold">QA: NORMAL</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs font-mono">
            <button onclick="openRollbackModal()" class="px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">历史快照</button>
            <button onclick="syncAllData()" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded text-zinc-200 font-bold">🔄 同步数据</button>
            <button onclick="toggleConfig()" class="px-2.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">🔑 密钥</button>
        </div>
    </header>

    <!-- 密钥配置区 -->
    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-2 p-3 bg-[#141417] border border-zinc-700 rounded-lg">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input id="ghTokenInput" type="password" placeholder="GitHub Access Token" class="w-full bg-[#0d0d0f] border border-zinc-800 rounded p-1.5 text-xs font-mono">
            <input id="dsKeyInput" type="password" placeholder="DeepSeek API Key" class="w-full bg-[#0d0d0f] border border-zinc-800 rounded p-1.5 text-xs font-mono">
        </div>
        <button onclick="saveKeys()" class="mt-2 w-full bg-zinc-200 text-zinc-900 hover:bg-white text-xs font-bold py-1.5 rounded">保存配置</button>
    </div>

    <!-- 历史还原弹窗 -->
    <div id="rollbackModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#141417] border border-zinc-800 max-w-lg w-full rounded-xl p-4 flex flex-col max-h-[70vh]">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                <span class="font-bold text-xs font-mono">历史快照还原</span>
                <button onclick="closeRollbackModal()" class="text-zinc-500 hover:text-white text-sm font-bold">✕</button>
            </div>
            <div id="commitListContainer" class="flex-1 overflow-y-auto space-y-1.5 custom-scrollbar pr-1"></div>
        </div>
    </div>

    <!-- 三期目标计划看板 (极致缩断 + 鼠标悬浮气泡) -->
    <section class="max-w-7xl w-full mx-auto mb-2 bg-[#141417] border border-[#27272a] rounded-lg p-3">
        <div class="flex items-center justify-between mb-2 border-b border-zinc-800 pb-1.5">
            <div class="flex items-center gap-2">
                <span class="text-zinc-300 font-bold font-mono text-xs">执行清单:</span>
                <span id="manifestSummaryBadge" class="text-[10px] font-mono px-1.5 py-0.5 bg-zinc-900 text-zinc-400 border border-zinc-800 rounded">载入中...</span>
            </div>
            <div class="flex gap-1 font-mono text-[10px]">
                <button onclick="filterManifest('ALL')" class="manifest-tab px-2 py-0.5 rounded bg-zinc-800 text-zinc-200 font-bold border border-zinc-700">全部</button>
                <button onclick="filterManifest('STAGE_1_MVP_GLOBAL')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">1.出海</button>
                <button onclick="filterManifest('STAGE_2_CN_UPGRADE')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">2.国内</button>
                <button onclick="filterManifest('STAGE_3_FULL_SCALE')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">3.后期</button>
            </div>
        </div>
        <div id="manifestList" class="grid grid-cols-1 md:grid-cols-3 gap-2 max-h-[145px] overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- 9 大部门切换栏 -->
    <section class="max-w-7xl w-full mx-auto mb-2 bg-[#141417] border border-[#27272a] rounded-lg p-2">
        <div class="flex items-center justify-between mb-1.5 border-b border-zinc-800/80 pb-1 text-[11px] font-mono">
            <div class="flex items-center gap-2">
                <span class="text-zinc-400 font-medium">聚焦部门:</span>
                <span id="activeDeptLabel" class="text-zinc-200 font-bold">[全景视图]</span>
            </div>
            <button onclick="resetDeptFilter()" class="text-[10px] text-zinc-500 hover:text-zinc-300 px-1.5 py-0.5">清空视图</button>
        </div>
        <div class="grid grid-cols-3 lg:grid-cols-9 gap-1 text-center font-mono" id="deptButtonsContainer">
            <!-- 由 js/admin-core.js 渲染 -->
        </div>
    </section>

    <!-- 底部日志与指令台 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start overflow-hidden">
        <aside class="lg:col-span-5 bg-[#141417] border border-[#27272a] rounded-lg p-2.5 flex flex-col h-[420px]">
            <div class="flex items-center justify-between border-b border-zinc-800/80 pb-1 mb-1.5">
                <span class="text-xs font-bold font-mono text-zinc-400">系统战报日志</span>
                <span id="historyCount" class="text-[10px] font-mono text-zinc-500">0条</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-1 custom-scrollbar pr-1"></div>
        </aside>

        <section class="lg:col-span-7 bg-[#141417] border border-[#27272a] rounded-lg p-2.5 flex flex-col h-[420px] justify-between relative">
            <div id="mentionDropdown"></div>

            <div>
                <div class="flex items-center justify-between border-b border-zinc-800/80 pb-1 mb-1.5 text-xs font-mono">
                    <span class="font-medium text-zinc-400">发送调度指令 (输入 @ 呼叫部门)</span>
                    <span class="text-[10px] text-zinc-600">Ctrl+Enter 快速发送</span>
                </div>
                
                <div class="mb-1.5 relative">
                    <div id="cmd" contenteditable="true" 
                         class="w-full h-20 bg-[#0d0d0f] border border-zinc-800 rounded p-2 text-xs text-zinc-200 font-mono focus:outline-none focus:border-zinc-600 overflow-y-auto custom-scrollbar"
                         placeholder="点击此处输入；如：@大脑中枢 @主动产品部 抓取公开合规热点设计一款新PPT..."></div>
                </div>

                <button onclick="triggerSwarmAutonomousAction()" id="runBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-bold py-2 rounded text-xs transition flex items-center justify-center gap-1.5">
                    <span>🚀 提交至云端蜂群协同执行</span>
                </button>
            </div>

            <div class="flex-1 mt-1.5 flex flex-col min-h-0">
                <pre id="log" class="flex-1 text-[11px] font-mono text-zinc-400 p-2 bg-[#0d0d0f] border border-zinc-800/80 rounded whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 驾驶舱在线。严格点击插入模式生效中。</pre>
            </div>
        </section>
    </main>

    <!-- 👑 引入模块化核心脚本 -->
    <script src="components/admin-core.js"></script>
</body>
</html>
