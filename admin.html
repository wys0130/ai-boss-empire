<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 董事长专属 AI 驾驶舱 (Autonomous V6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- 顶部导航栏 -->
    <header class="max-w-7xl w-full mx-auto bg-slate-900 border border-slate-800 rounded-xl px-5 py-3 mb-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
            <h1 class="font-bold font-mono text-sm tracking-wider text-slate-100">APEXWORK AI CONSOLE V6 · 自主挂机与一票否决舱</h1>
            <span class="text-[11px] font-mono px-2 py-0.5 bg-indigo-950 text-indigo-400 border border-indigo-800 rounded font-bold">ENSEMBLE ROUTER</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- 👑 核心新加：一票否决权按钮 -->
            <button onclick="vetoAndRevertCommit()" class="text-xs font-mono font-bold px-3 py-1.5 bg-rose-600/30 hover:bg-rose-600/60 text-rose-300 border border-rose-500/50 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-rose-900/30">
                <span>🚨 一票否决：回退至上一版本</span>
            </button>
            <button onclick="loadHistoryFromMemory()" class="text-xs font-mono px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg transition">
                <span>🔄 刷新档案</span>
            </button>
            <button onclick="toggleConfig()" class="text-xs font-mono px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 rounded-lg transition">
                <span>🔑 密钥设置</span>
            </button>
        </div>
    </header>

    <!-- 密钥配置弹窗 -->
    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-4 p-4 bg-slate-900 border border-indigo-800 rounded-xl shadow-2xl">
        <div class="text-xs font-bold text-indigo-400 font-mono mb-3">⚡ 掌门人身份与多模型算力池绑定 (本地缓存加密)</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-[11px] text-slate-400 mb-1 font-mono">GitHub Access Token (ghp_...)</label>
                <input id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxx..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1 font-mono">DeepSeek / OpenRouter API Key (sk-...)</label>
                <input id="dsKeyInput" type="password" placeholder="sk-xxxxxxxxxxx..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
            </div>
        </div>
        <button onclick="saveKeys()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition">💾 保存算力配置</button>
    </div>

    <!-- 核心工作台：双栏架构 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start overflow-hidden">
        
        <!-- 左侧：历史交流与自主进化记录 -->
        <aside class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[650px] shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-indigo-400 font-mono text-sm">🧠</span>
                    <h2 class="text-xs font-bold font-mono tracking-wide text-slate-200">AI 自主学习与进化档案</h2>
                </div>
                <span id="historyCount" class="text-[10px] font-mono bg-slate-800 px-2 py-0.5 rounded text-slate-400">0 RECORDS</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pr-1">
                <div class="text-center text-xs text-slate-500 py-10 font-mono">正在连接 GitHub 提取记忆档案...</div>
            </div>
        </aside>

        <!-- 右侧：决策控制台 + 硬核破除缓存直达链接 -->
        <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col h-[650px] shadow-xl justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                    <span class="text-xs font-bold font-mono text-indigo-400">CHAIRMAN DIRECTIVE / 董事长决策发射台</span>
                    <span class="text-[11px] font-mono text-slate-500">AUTO ROUTING ENGINE</span>
                </div>
                <div class="mb-4">
                    <textarea id="cmd" rows="4" placeholder="输入手写指令或留空（留空将触发 AI 自主复盘大厂趋势并迭代建站）..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-sm text-white font-mono focus:outline-none focus:border-indigo-500 shadow-inner"></textarea>
                </div>
                <button onclick="triggerAutonomousEvolution()" id="runBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <span>🚀 启动 AI 算力池：自主复盘大厂并重构网站</span>
                </button>
            </div>

            <!-- 日志终端 -->
            <div class="flex-1 mt-4 flex flex-col min-h-0">
                <div class="text-[11px] font-mono text-slate-400 mb-1.5">SYSTEM TERMINAL / 系统交互日志:</div>
                <pre id="log" class="flex-1 text-[11px] font-mono text-yellow-400 p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 系统就绪。等待执行命令或启动自主挂机模式...</pre>
            </div>

            <!-- 真正硬核绕过浏览器缓存的直达链接 -->
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                <span class="text-slate-500 font-mono">CACHE PURGE: ENABLED</span>
                <button onclick="openLiveSiteForceBypass()" class="text-emerald-400 hover:text-emerald-300 font-mono font-bold flex items-center gap-1">
                    🔥 强制无缓存直达最新网站 (自动跳过 Ctrl+F5) →
                </button>
            </div>
        </section>
    </main>

    <script>
        const REPO = "wys0130/ai-boss-empire";

        function getKeys() {
            const gh = localStorage.getItem("APEX_GH_TOKEN");
            const ds = localStorage.getItem("APEX_DS_KEY");
            if (!gh || !ds) { toggleConfig(); throw new Error("请先点击右上角【🔑 密钥设置】填入 Key！"); }
            return { gh, ds };
        }

        function toggleConfig() { document.getElementById("configArea").classList.toggle("hidden"); }
        function saveKeys() {
            localStorage.setItem("APEX_GH_TOKEN", document.getElementById("ghTokenInput").value.trim());
            localStorage.setItem("APEX_DS_KEY", document.getElementById("dsKeyInput").value.trim());
            toggleConfig();
            alert("✅ 密钥配置成功锁定于本地设备！");
            loadHistoryFromMemory();
        }

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function appendLog(msg, color = "") {
            const log = document.getElementById("log");
            if (color) log.className = `flex-1 text-[11px] font-mono ${color} p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar`;
            log.innerText += `\n>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        // 👑 硬核解决缓存问题：新窗口强刷加载
        function openLiveSiteForceBypass() {
            const targetUrl = `https://wys0130.github.io/ai-boss-empire/?nocache=${Date.now()}_${Math.random().toString(36).substring(7)}`;
            const newWin = window.open(targetUrl, '_blank');
            if (newWin) newWin.focus();
        }

        // 👑 核心落实：一票否决权 (自动回退至上一提交 Git Commit)
        async function vetoAndRevertCommit() {
            if (!confirm("🚨 警告：您正在使用【董事长一票否决权】！系统将强制将网站代码秒级回退至上一好版本。确定否决本次更新？")) return;
            try {
                const keys = getKeys();
                appendLog("⚠️ 正在调取 GitHub Commit 历史，准备执行一票否决与快照还原...", "text-rose-400");
                
                const commitsUrl = `https://api.github.com/repos/${REPO}/commits?per_page=5`;
                const res = await fetch(commitsUrl, { headers: { "Authorization": `token ${keys.gh}` } });
                const commits = await res.json();
                
                if (commits.length < 2) throw new Error("提交历史不足，无法回退");
                
                // 提取倒数第二个 Commit 的文件内容快照并还原
                const targetCommitSha = commits[1].sha;
                appendLog(`正在抓取历史快照节点 [${targetCommitSha.slice(0, 7)}] 并覆写主分支...`);

                const rawIndexUrl = `https://raw.githubusercontent.com/${REPO}/${targetCommitSha}/index.html`;
                const indexRes = await fetch(rawIndexUrl);
                if (indexRes.ok) {
                    const prevCode = await indexRes.text();
                    const currentFile = await getGithubFileSafe("index.html", keys.gh);
                    await pushGithubFile("index.html", prevCode, currentFile.sha, "🚨 VETO: Reverted to previous version by Chairman Directive", keys.gh);
                }

                // 在记忆库中写入否决记录，防止 AI 再次犯错
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const updatedMem = (memoryFile.content || "") + `\n- [VETO-RECORD]: 董事长对上一步决策下达了一票否决权，全站已恢复至快照 ${targetCommitSha.slice(0, 7)}，禁止再次使用此方案。`;
                await pushGithubFile("MEMORY.md", updatedMem, memoryFile.sha, "🤖 Memory Update: Recorded VETO Decision", keys.gh);

                appendLog("✅ 一票否决执行成功！全站代码已秒级撤回上个完美版本。", "text-emerald-400 font-bold");
                await loadHistoryFromMemory();
            } catch(err) {
                appendLog("❌ 撤回失败: " + err.message, "text-rose-400");
            }
        }

        async function loadHistoryFromMemory() {
            const feed = document.getElementById("historyFeed");
            try {
                const keys = getKeys();
                const memFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const lines = (memFile.content || "").split("\n").filter(l => l.includes("[EVO-RECORD]") || l.includes("[VETO-RECORD]"));
                document.getElementById("historyCount").innerText = `${lines.length} RECORDS`;

                if (lines.length === 0) {
                    feed.innerHTML = `<div class="text-center text-xs text-slate-500 py-10 font-mono">暂无演化记录</div>`;
                    return;
                }

                feed.innerHTML = "";
                lines.reverse().forEach((line, idx) => {
                    const isVeto = line.includes("[VETO-RECORD]");
                    const badge = isVeto ? `<span class="text-rose-400">● 否决撤回</span>` : `<span class="text-emerald-400">● 升级生效</span>`;
                    const cleanText = line.replace(/^- /, "").replace("[EVO-RECORD]:", "").replace("[VETO-RECORD]:", "").trim();
                    feed.innerHTML += `
                        <div class="bg-slate-950 border ${isVeto ? 'border-rose-900/50' : 'border-slate-800'} rounded-xl p-3">
                            <div class="flex items-center justify-between text-[10px] font-mono text-slate-500 mb-1">
                                <span>RECORD #${lines.length - idx}</span>
                                ${badge}
                            </div>
                            <div class="text-xs text-slate-300 leading-relaxed font-mono">${cleanText}</div>
                        </div>
                    `;
                });
            } catch (err) { feed.innerHTML = `<div class="text-center text-xs text-rose-400 py-10 font-mono">加载上下文档案失败，请检查 Key 配置。</div>`; }
        }

        async function getGithubFileSafe(path, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
            if (!res.ok) return { content: "", sha: null };
            const data = await res.json();
            return { content: b64_to_utf8(data.content), sha: data.sha };
        }

        async function pushGithubFile(path, content, sha, message, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const payload = { message: message, content: utf8_to_b64(content) };
            if (sha) payload.sha = sha;
            const res = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`提交 ${path} 失败`);
            return await res.json();
        }

        async function triggerAutonomousEvolution() {
            const btn = document.getElementById("runBtn");
            const cmdInput = document.getElementById("cmd");
            const userCmd = cmdInput.value.trim();
            
            // 👑 自动自主思考提示词：若用户留空，则启动全自动复盘模式
            const cmd = userCmd || "【AI自主巡航挂机模式】：对比稻壳儿、Canva、Envato 等大厂 UI 趋势，自主审查当前整站缺陷，从样式美学、组件交互到数据链路进行降维打击式自动迭代修缮！";

            btn.disabled = true;
            btn.innerHTML = "<span>⚙️ 算力池深度推理中 (正在进行多模型降维推演)...</span>";
            document.getElementById("log").innerText = ">> 启动多模型算法串联引擎...";

            try {
                const keys = getKeys();
                appendLog("提取 MEMORY.md 档案与历史否决纪录...");
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);

                appendLog("⚡ 正在请求 DeepSeek V3/R1 算力大脑进行自主学习与多文件依赖分析...", "text-yellow-400");
                
                const prompt = `你现在是 ApexWork 的 AI 首席产品兼全栈工程师。
请执行董事长的指示（若留空则启动自主降维进化模式）。
要求：
1. 自动判断核心目标物理文件路径 (TARGET_FILE_PATH)，如 'index.html', 'editor.html', 'templates/aerotech-2026.json', 'js/editor-engine.js' 等；
2. 强制【依赖链自动化】：如果建立了新 .js 或 .json 文件，必须自动在入口 HTML 中写入加载和 fetch 代码，拒绝孤岛文件！
3. 锁死既有核心 $9.99 结账与本地下载逻辑。

【历史记忆与否决黑名单】：
${memoryFile.content || "无"}

【执行指令】：
"${cmd}"

严格按以下标记格式输出：
===NEW_MEMORY===
- [EVO-RECORD]: <用1句话提炼本次更新对系统的贡献>
===TARGET_FILE_PATH===
<在此填写目标文件路径，例如：templates/aerotech-2026.json>
===FILE_CONTENT===
<在此输出完整的代码或JSON内容>`;

                const dsRes = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${keys.ds}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一位极客思维、追求大厂媲美美学与高效全栈架构的 AI 智能体。" },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.3
                    })
                });

                if (!dsRes.ok) throw new Error("API 请求失败: " + dsRes.statusText);
                const dsData = await dsRes.json();
                const aiAnswer = dsData.choices[0].message.content;

                const memParts = aiAnswer.split("===NEW_MEMORY===");
                const targetParts = aiAnswer.split("===TARGET_FILE_PATH===");
                const contentParts = aiAnswer.split("===FILE_CONTENT===");

                if (memParts.length < 2 || targetParts.length < 2 || contentParts.length < 2) throw new Error("AI 解析标记格式异常");

                const newMemoryLine = targetParts[0].replace("===NEW_MEMORY===", "").trim();
                const targetFilePath = contentParts[0].replace("===TARGET_FILE_PATH===","").trim();
                const newFileContent = contentParts[1].replace(/```[a-z]*/g, "").replace(/```/g, "").trim();

                appendLog(`📍 [智能路由与依赖绑定]: 操作路径 =>【 ${targetFilePath} 】`, "text-indigo-300 font-bold");

                const targetExisting = await getGithubFileSafe(targetFilePath, keys.gh);
                await pushGithubFile(targetFilePath, newFileContent, targetExisting.sha, `🤖 Autonomous Update: ${targetFilePath}`, keys.gh);

                const updatedMemory = (memoryFile.content || "") + "\n" + newMemoryLine;
                await pushGithubFile("MEMORY.md", updatedMemory, memoryFile.sha, `🤖 Memory Update: ${newMemoryLine.slice(0, 35)}`, keys.gh);

                appendLog(`✅ AI 自主进化 100% 成功执行！[ ${targetFilePath} ] 已发布。`, "text-emerald-400 font-bold");
                cmdInput.value = "";
                await loadHistoryFromMemory();
            } catch (err) {
                appendLog("❌ 执行失败: " + err.message, "text-rose-400");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>🚀 启动 AI 算力池：自主复盘大厂并重构网站</span>";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("APEX_GH_TOKEN")) loadHistoryFromMemory();
        });
    </script>
</body>
</html>
