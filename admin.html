<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork AI 驾驶舱 (V20 Fixed Toggle Swarm)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
        body.theme-dark { --bg-body: #030712; --bg-card: #0f172a; --bg-inner: #020617; --border-color: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8; }
        body.theme-light { --bg-body: #f1f5f9; --bg-card: #ffffff; --bg-inner: #f8fafc; --border-color: #e2e8f0; --text-main: #0f172a; --text-sub: #475569; }
        .themed-body { background-color: var(--bg-body); color: var(--text-main); }
        .themed-card { background-color: var(--bg-card); border-color: var(--border-color); }
        .themed-inner { background-color: var(--bg-inner); border-color: var(--border-color); }
        .themed-text { color: var(--text-main); }
        .themed-subtext { color: var(--text-sub); }
    </style>
</head>
<body class="themed-body theme-dark min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- 顶部导览 -->
    <header class="max-w-7xl w-full mx-auto themed-card border rounded-xl px-5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold font-mono text-sm tracking-wide themed-text">APEXWORK 智能体蜂群控制台</h1>
            <span class="text-[10px] font-mono px-2 py-0.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded font-bold">V20 SWARM</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="toggleAdminTheme()" id="themeBtn" class="text-xs font-mono font-bold px-3 py-1 themed-inner hover:opacity-80 border rounded-lg transition shadow-sm">
                <span>🌞/🌙 换黑白</span>
            </button>
            <button onclick="openRollbackModal()" class="text-xs font-mono font-bold px-3 py-1 bg-amber-600/20 hover:bg-amber-600/40 text-amber-500 border border-amber-500/40 rounded-lg transition shadow-sm">
                <span>⏳ 一键回退</span>
            </button>
            <button onclick="loadHistoryFromMemory()" class="text-xs font-mono px-3 py-1 themed-inner hover:opacity-80 border rounded-lg transition">
                <span>🔄 刷新记事</span>
            </button>
            <button onclick="toggleConfig()" class="text-xs font-mono px-3 py-1 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-400 border border-indigo-500/40 rounded-lg transition">
                <span>🔑 授权密钥</span>
            </button>
        </div>
    </header>

    <!-- 密钥配置区 -->
    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-3 p-4 themed-card border border-indigo-500/50 rounded-xl shadow-2xl">
        <div class="text-xs font-bold text-indigo-400 font-mono mb-2">⚡ 董事长本地密钥区</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input id="ghTokenInput" type="password" placeholder="GitHub Access Token (ghp_...)" class="w-full themed-inner border rounded-lg p-2 text-xs themed-text font-mono focus:outline-none focus:border-indigo-500">
            <input id="dsKeyInput" type="password" placeholder="DeepSeek / OpenRouter API Key (sk-...)" class="w-full themed-inner border rounded-lg p-2 text-xs themed-text font-mono focus:outline-none focus:border-indigo-500">
        </div>
        <button onclick="saveKeys()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition">💾 保存授权</button>
    </div>

    <!-- 一键快照回退弹窗 -->
    <div id="rollbackModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="themed-card border max-w-2xl w-full rounded-2xl p-5 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between border-b border-gray-500/20 pb-2 mb-3">
                <span class="font-bold text-sm font-mono themed-text">⏳ 选择历史好版本还原</span>
                <button onclick="closeRollbackModal()" class="text-gray-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div id="commitListContainer" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                <div class="text-center text-xs themed-subtext py-8 font-mono">载入快照中...</div>
            </div>
        </div>
    </div>

    <!-- 👑 【已完美修复】支持二次点击切换回“全体状态”的 9 大部门按键 -->
    <section class="max-w-7xl w-full mx-auto mb-3 themed-card border rounded-2xl p-3 shadow-xl">
        <div class="flex items-center justify-between mb-2 border-b border-gray-500/20 pb-1.5 text-xs font-mono">
            <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">🤖 智能部门按键 (再点一次已选部门可恢复全体视角):</span>
                <span id="activeDeptLabel" class="text-indigo-400 font-bold">[当前视图: 全体部门]</span>
            </div>
            <button onclick="resetDeptFilter()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-0.5 rounded transition">
                ↺ 恢复全体视图
            </button>
        </div>
        <div class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-9 gap-1.5 text-center font-mono">
            <button onclick="inspectDept('大脑中枢', this)" class="dept-btn themed-inner border border-slate-700 hover:border-indigo-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-indigo-400 group-hover:underline">🧠 大脑中枢</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">工单调度分发</div>
            </button>
            <button onclick="inspectDept('缺陷反馈部', this)" class="dept-btn themed-inner border border-rose-500/60 bg-rose-500/10 hover:bg-rose-500/20 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-rose-400 group-hover:underline">🐞 缺陷反馈部</div>
                <div class="text-[9px] text-rose-300 truncate mt-0.5">盯支付接口/BUG</div>
            </button>
            <button onclick="inspectDept('主动产品部', this)" class="dept-btn themed-inner border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-amber-400 group-hover:underline">🔧 主动产品部</div>
                <div class="text-[9px] text-amber-300 truncate mt-0.5">主动扫盲补坑</div>
            </button>
            <button onclick="inspectDept('施工工程部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-blue-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-blue-400 group-hover:underline">🛠️ 施工工程部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">1秒极致响应</div>
            </button>
            <button onclick="inspectDept('视觉策划部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-emerald-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-emerald-400 group-hover:underline">🎨 视觉策划部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">少字多图排版</div>
            </button>
            <button onclick="inspectDept('审核质量部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-purple-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-purple-400 group-hover:underline">⚖️ 审核质量部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">85分门槛把控</div>
            </button>
            <button onclick="inspectDept('转化销售部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-pink-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-pink-400 group-hover:underline">📈 转化销售部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">$9.99营收绩效</div>
            </button>
            <button onclick="inspectDept('推广营销部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-cyan-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-cyan-400 group-hover:underline">📢 推广营销部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">海外公域搬砖</div>
            </button>
            <button onclick="inspectDept('国际法务部', this)" class="dept-btn themed-inner border border-slate-700 hover:border-teal-400 rounded-xl p-2 transition cursor-pointer text-left group">
                <div class="text-[11px] font-bold text-teal-400 group-hover:underline">🛡️ 国际法务部</div>
                <div class="text-[9px] text-gray-400 truncate mt-0.5">ATS/GDPR零注册</div>
            </button>
        </div>
    </section>

    <!-- 核心两栏驾驶台 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start overflow-hidden">
        
        <!-- 左栏：战报流水 -->
        <aside class="lg:col-span-5 themed-card border rounded-2xl p-4 flex flex-col h-[560px] shadow-xl">
            <div class="flex items-center justify-between border-b border-gray-500/20 pb-2 mb-2">
                <span class="text-xs font-bold font-mono tracking-wide themed-text">🕒 部门执行战报</span>
                <span id="historyCount" class="text-[10px] font-mono themed-inner border px-2 py-0.5 rounded themed-subtext">0 RECORDS</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1.5">
                <div class="text-center text-xs themed-subtext py-10 font-mono">加载日志中...</div>
            </div>
        </aside>

        <!-- 右栏：董事长控制指令台 -->
        <section class="lg:col-span-7 themed-card border rounded-2xl p-4 flex flex-col h-[560px] shadow-xl justify-between">
            <div>
                <!-- BUG 报警栏 -->
                <div id="bugAlertBanner" class="mb-2.5 bg-rose-500/10 border border-rose-500/40 rounded-xl p-2 flex items-center justify-between text-xs font-mono">
                    <div class="flex items-center gap-1.5">
                        <span class="text-rose-500 font-bold">🐞 [缺陷部报告]:</span>
                        <span class="text-rose-300">支付闭环待真正开通，$9.99 现为测试态。</span>
                    </div>
                    <button onclick="autoFixPaymentBug()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-2.5 py-1 rounded text-[11px] transition">
                        ⚡ 派单解决
                    </button>
                </div>

                <div class="flex items-center justify-between border-b border-gray-500/20 pb-2 mb-2">
                    <span class="text-xs font-bold font-mono text-indigo-400">董事长发令台</span>
                    <span class="text-[10px] font-mono themed-subtext">快捷触发: <strong class="themed-text">Ctrl + Enter</strong></span>
                </div>
                <div class="mb-2.5">
                    <textarea id="cmd" rows="2" placeholder="输入指示；或留空直接 Enter（触发蜂群自动自查补坑/修BUG/精修排版）..." class="w-full themed-inner border rounded-xl p-3 text-xs themed-text font-mono focus:outline-none focus:border-indigo-500 shadow-inner"></textarea>
                </div>
                <button onclick="triggerSwarmAutonomousAction()" id="runBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <span>🚀 立即发车 / 唤醒蜂群自驱建设</span>
                </button>
            </div>

            <!-- 输出控制台 -->
            <div class="flex-1 mt-2.5 flex flex-col min-h-0">
                <div class="text-[10px] font-mono themed-subtext mb-1 flex justify-between">
                    <span>SWARM TERMINAL:</span>
                    <span class="text-emerald-500 font-mono">● READY</span>
                </div>
                <pre id="log" class="flex-1 text-[11px] font-mono text-yellow-500 p-3 themed-inner border rounded-xl whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 驾驶舱在线。已挂载9大职能部门，点击上方按钮可过滤或再次点击恢复全体。</pre>
            </div>

            <div class="mt-2.5 pt-2 border-t border-gray-500/20 flex justify-between items-center text-xs">
                <span class="themed-subtext font-mono text-[10px]">CACHE PURGE: ENABLED</span>
                <button onclick="openLiveSiteForceBypass()" class="text-emerald-500 hover:text-emerald-400 font-mono font-bold flex items-center gap-1">
                    🔥 强制无缓存直达主页 →
                </button>
            </div>
        </section>
    </main>

    <script>
        const REPO = "wys0130/ai-boss-empire";
        let activeFilterDept = "";

        function initAdminTheme() {
            const savedTheme = localStorage.getItem("APEX_ADMIN_THEME") || "theme-dark";
            document.body.className = `themed-body ${savedTheme} min-h-screen flex flex-col justify-between p-4 font-sans`;
            document.getElementById("themeBtn").innerHTML = savedTheme === "theme-light" ? "<span>🌙 黑间</span>" : "<span>🌞 白间</span>";
        }

        function toggleAdminTheme() {
            const nextTheme = document.body.classList.contains("theme-dark") ? "theme-light" : "theme-dark";
            document.body.className = `themed-body ${nextTheme} min-h-screen flex flex-col justify-between p-4 font-sans`;
            localStorage.setItem("APEX_ADMIN_THEME", nextTheme);
            document.getElementById("themeBtn").innerHTML = nextTheme === "theme-light" ? "<span>🌙 黑间</span>" : "<span>🌞 白间</span>";
        }

        function getKeys() {
            const gh = localStorage.getItem("APEX_GH_TOKEN");
            const ds = localStorage.getItem("APEX_DS_KEY");
            if (!gh || !ds) { toggleConfig(); throw new Error("请在右上角【🔑 授权密钥】填入授权 Key!"); }
            return { gh, ds };
        }

        function toggleConfig() { document.getElementById("configArea").classList.toggle("hidden"); }
        function saveKeys() {
            localStorage.setItem("APEX_GH_TOKEN", document.getElementById("ghTokenInput").value.trim());
            localStorage.setItem("APEX_DS_KEY", document.getElementById("dsKeyInput").value.trim());
            toggleConfig();
            alert("✅ 密钥生效!");
            loadHistoryFromMemory();
        }

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function appendLog(msg, color = "") {
            const log = document.getElementById("log");
            if (color) log.className = `flex-1 text-[11px] font-mono ${color} p-3 themed-inner border rounded-xl whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar`;
            log.innerText += `\n>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        function openLiveSiteForceBypass() {
            window.open(`https://wys0130.github.io/ai-boss-empire/?nocache=${Date.now()}_${Math.random().toString(36).substring(7)}`, '_blank');
        }

        function openRollbackModal() {
            document.getElementById("rollbackModal").classList.remove("hidden");
            fetchCommitHistory();
        }

        function closeRollbackModal() {
            document.getElementById("rollbackModal").classList.add("hidden");
        }

        // 👑 【完美解决】支持二次点击同一部门、或点击“恢复全体”重置视图
        function inspectDept(deptName, btnEl) {
            if (activeFilterDept === deptName) {
                resetDeptFilter();
                return;
            }

            activeFilterDept = deptName;
            document.querySelectorAll(".dept-btn").forEach(el => el.classList.remove("ring-2", "ring-indigo-500", "bg-indigo-500/10"));
            btnEl.classList.add("ring-2", "ring-indigo-500", "bg-indigo-500/10");
            
            document.getElementById("activeDeptLabel").innerText = `[当前视图: ${deptName}]`;
            appendLog(`🎯 董事长已聚焦检查【${deptName}】专属战报...`, "text-indigo-400 font-bold");
            loadHistoryFromMemory();
        }

        function resetDeptFilter() {
            activeFilterDept = "";
            document.querySelectorAll(".dept-btn").forEach(el => el.classList.remove("ring-2", "ring-indigo-500", "bg-indigo-500/10"));
            document.getElementById("activeDeptLabel").innerText = `[当前视图: 全体部门]`;
            appendLog(`🌐 已重置恢复查看集团全体部门战报。`, "text-slate-400");
            loadHistoryFromMemory();
        }

        function autoFixPaymentBug() {
            document.getElementById("cmd").value = "【🐞缺陷反馈部专单】：请协同转化销售部与工程部，对接真正的商业收单回调接口及 $9.99 Ed25519 鉴权链路！";
            triggerSwarmAutonomousAction();
        }

        async function fetchCommitHistory() {
            const container = document.getElementById("commitListContainer");
            container.innerHTML = `<div class="text-center text-xs themed-subtext py-6 font-mono">加载快照中...</div>`;
            try {
                const keys = getKeys();
                const res = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=10`, { headers: { "Authorization": `token ${keys.gh}` } });
                const commits = await res.json();
                if (!Array.isArray(commits)) return container.innerHTML = `<div class="text-center text-xs text-rose-500 py-6">读取失败</div>`;

                container.innerHTML = "";
                commits.forEach((item, idx) => {
                    const shaShort = item.sha.slice(0, 7);
                    const timeStr = new Date(item.commit.committer.date).toLocaleString('zh-CN', { hour12: false });
                    const isCurrent = idx === 0;

                    container.innerHTML += `
                        <div class="themed-inner border rounded-xl p-2.5 flex items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-mono text-xs font-bold text-amber-500">[#${shaShort}]</span>
                                    <span class="text-[10px] themed-subtext font-mono">${timeStr}</span>
                                    ${isCurrent ? '<span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-1.5 py-0.5 rounded font-bold">运行中</span>' : ''}
                                </div>
                                <div class="text-xs themed-text font-mono truncate">${item.commit.message}</div>
                            </div>
                            <div>
                                ${isCurrent ? 
                                    `<button disabled class="px-3 py-1 bg-gray-500/20 text-gray-400 text-[11px] rounded-lg">运行中</button>` : 
                                    `<button onclick="revertToSelectedCommit('${item.sha}', '${shaShort}')" class="px-3 py-1 bg-rose-600/30 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/50 rounded-lg text-[11px] font-bold transition">选择回滚</button>`
                                }
                            </div>
                        </div>
                    `;
                });
            } catch (err) { container.innerHTML = `<div class="text-center text-xs text-rose-500 py-6">异常：${err.message}</div>`; }
        }

        async function revertToSelectedCommit(targetSha, shortSha) {
            if (!confirm(`⏳ 确定一票否决并回退到历史好版本 [#${shortSha}] 吗？`)) return;
            closeRollbackModal();
            try {
                const keys = getKeys();
                appendLog(`正在通过 Git Tree 回退至 [#${shortSha}]...`, "text-amber-500");

                const rawIndexUrl = `https://raw.githubusercontent.com/${REPO}/${targetSha}/index.html`;
                const indexRes = await fetch(rawIndexUrl);
                if (indexRes.ok) {
                    const prevCode = await indexRes.text();
                    const currentFile = await getGithubFileSafe("index.html", keys.gh);
                    await pushGithubFile("index.html", prevCode, currentFile.sha, `⏳ VETO: Reverted to #${shortSha}`, keys.gh);
                }

                const nowStr = formatStandardTime(new Date());
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const updatedMem = (memoryFile.content || "") + `\n- [VETO-RECORD | ${nowStr}]: 董事长行使否决权，还原快照 #${shortSha}。`;
                await pushGithubFile("MEMORY.md", updatedMem, memoryFile.sha, `🤖 Memory: Reverted to #${shortSha}`, keys.gh);

                appendLog(`✅ 快照覆盖成功！已回滚至 [#${shortSha}]。`, "text-emerald-500 font-bold");
                await loadHistoryFromMemory();
            } catch(err) { appendLog("❌ 否决异常: " + err.message, "text-rose-500"); }
        }

        function formatStandardTime(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const mm = String(dateObj.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${hh}:${mm}`;
        }

        async function loadHistoryFromMemory() {
            const feed = document.getElementById("historyFeed");
            try {
                const keys = getKeys();
                const memFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                let lines = (memFile.content || "").split("\n").filter(l => l.includes("[EVO-RECORD") || l.includes("[VETO-RECORD"));
                
                if (activeFilterDept) {
                    const filtered = lines.filter(l => l.includes(activeFilterDept));
                    if (filtered.length > 0) lines = filtered;
                }

                document.getElementById("historyCount").innerText = `${lines.length} RECORDS`;

                if (lines.length === 0) {
                    feed.innerHTML = `<div class="text-center text-xs themed-subtext py-10 font-mono">未检索到【${activeFilterDept || '全体'}】的相关战报</div>`;
                    return;
                }

                feed.innerHTML = "";
                lines.reverse().forEach((line, idx) => {
                    const isLatest = idx === 0;
                    const exactDateMatch = line.match(/(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
                    const timeStr = exactDateMatch ? exactDateMatch[1] : formatStandardTime(new Date(Date.now() - (idx * 180 * 60 * 1000)));
                    let cleanText = line.replace(/^- /, "").replace(/\[EVO-RECORD[^\]]*\]:/, "").replace(/\[VETO-RECORD[^\]]*\]:/, "").trim();

                    let cardBorder = isLatest ? "border-emerald-500/60 themed-inner shadow-md ring-1 ring-emerald-500/20" : "border-gray-500/20 themed-inner opacity-75";
                    let badge = isLatest ? `<span class="text-emerald-400 text-[10px] font-bold">🔥 LATEST</span>` : `<span class="themed-subtext text-[10px]">🕒 ARCHIVE</span>`;

                    feed.innerHTML += `
                        <div class="border rounded-xl p-2.5 transition ${cardBorder}">
                            <div class="flex items-center justify-between text-[10px] font-mono themed-subtext mb-1 border-b border-gray-500/20 pb-1">
                                <span class="themed-text font-bold">⏱️ ${timeStr}</span>
                                <div class="flex items-center gap-2"><span>#${lines.length - idx}</span>${badge}</div>
                            </div>
                            <div class="text-xs ${isLatest ? 'themed-text font-medium' : 'themed-subtext'} leading-relaxed font-mono">${cleanText}</div>
                        </div>
                    `;
                });
            } catch (err) { feed.innerHTML = `<div class="text-center text-xs text-rose-500 py-10">拉取战报日志出错</div>`; }
        }

        async function getGithubFileSafe(path, token) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers: { "Authorization": `token ${token}` } });
            if (!res.ok) return { content: "", sha: null };
            const data = await res.json();
            return { content: b64_to_utf8(data.content), sha: data.sha };
        }

        async function fetchLiveRepoTree(token) {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`, { headers: { "Authorization": `token ${token}` } });
                if (!res.ok) return [];
                const data = await res.json();
                return data.tree.map(node => `${node.type === 'tree' ? '📁 [DIR]' : '📄 [FILE]'} ${node.path}`);
            } catch(e) { return []; }
        }

        async function pushGithubFile(path, content, sha, message, token) {
            const payload = { message: message, content: utf8_to_b64(content) };
            if (sha) payload.sha = sha;
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`提交至 ${path} 失败`);
            return await res.json();
        }

        async function triggerSwarmAutonomousAction() {
            const btn = document.getElementById("runBtn");
            const cmdInput = document.getElementById("cmd");
            const cmd = cmdInput.value.trim() || "【缺陷反馈部+产品部协作】：自扫支付接口与 Excel/Word 页面断点，进行修复或新建功能页。";

            btn.disabled = true;
            btn.innerHTML = "<span>⚙️ 9 大智能部门自验与建设中...</span>";
            appendLog("🧠 [大脑中枢启动]：挂载现存文件树与部门职责...");

            try {
                const keys = getKeys();
                const [memoryFile, constFile, repoTree] = await Promise.all([
                    getGithubFileSafe("MEMORY.md", keys.gh),
                    getGithubFileSafe("AI-EMPIRE-CONSTITUTION.md", keys.gh),
                    fetchLiveRepoTree(keys.gh)
                ]);
                
                const treeSummary = repoTree.length > 0 ? repoTree.join("\n") : "index.html\neditor.html\nadmin.html\nMEMORY.md";
                appendLog(`📁 [实时项目树检索成功]，发单中...`);

                const prompt = `你是 APEXWORK 智能体蜂群中枢。
项目现有物理文件树：
${treeSummary}

【最高宪法】：
${constFile.content || "缺陷部必报支付BUG！产品部务必自扫空白坑位。"}

【近期演进记忆】：
${memoryFile.content || "无"}

【指令 / 任务】：
"${cmd}"

作为蜂群作答，严循 4 段标记：
===SWARM_LOG===
<写简炼部门协作战报：如【🐞缺陷反馈部】报备支付接口或断点，【🛠️工程部】推进源码修复>
===NEW_MEMORY===
- [EVO-RECORD]: <一句话简短提炼本轮迭代，带上参与部门名>
===TARGET_FILE_PATH===
<在此写相对文件名，例：index.html 或 editor.html>
===FILE_CONTENT===
<完整干净最新的文件源码>`;

                const dsRes = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${keys.ds}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "system", content: "你是严格执行少字多图、支付检查与产品自扫填坑的企业蜂群。" }, { role: "user", content: prompt }],
                        temperature: 0.3
                    })
                });

                if (!dsRes.ok) throw new Error("API 响应失败: " + dsRes.statusText);
                const aiAnswer = (await dsRes.json()).choices[0].message.content;

                const swarmParts = aiAnswer.split("===SWARM_LOG===");
                const memParts = aiAnswer.split("===NEW_MEMORY===");
                const targetParts = aiAnswer.split("===TARGET_FILE_PATH===");
                const contentParts = aiAnswer.split("===FILE_CONTENT===");

                if (memParts.length < 2 || targetParts.length < 2 || contentParts.length < 2) throw new Error("响应格式未完整返回");

                const swarmLogText = swarmParts[1] ? swarmParts[1].split("===NEW_MEMORY===")[0].trim() : "已分配多部门完成协同。";
                const rawMemoryLine = targetParts[0].replace("===NEW_MEMORY===", "").trim();
                const targetFilePath = contentParts[0].replace("===TARGET_FILE_PATH===","").trim();
                const newFileContent = contentParts[1].replace(/```[a-z]*/g, "").replace(/```/g, "").trim();

                appendLog(`🤖 [各部行动直报]:\n${swarmLogText}`, "text-emerald-400 font-bold");
                appendLog(`📍 [目标对齐写库]: =>【 ${targetFilePath} 】`, "text-indigo-400 font-bold");

                const targetExisting = await getGithubFileSafe(targetFilePath, keys.gh);
                await pushGithubFile(targetFilePath, newFileContent, targetExisting.sha, `🤖 Swarm Evolve: ${targetFilePath}`, keys.gh);

                const nowStr = formatStandardTime(new Date());
                const timestampedMemoryLine = rawMemoryLine.replace("[EVO-RECORD]:", `[EVO-RECORD | ${nowStr}]:`);
                const updatedMemory = (memoryFile.content || "") + "\n" + timestampedMemoryLine;
                await pushGithubFile("MEMORY.md", updatedMemory, memoryFile.sha, `🤖 Memory: ${timestampedMemoryLine.slice(0, 35)}`, keys.gh);

                appendLog(`✅ 协同更新 100% 生效！[ ${targetFilePath} ] 已发布。`, "text-emerald-500 font-bold");
                cmdInput.value = "";
                await loadHistoryFromMemory();
            } catch (err) {
                appendLog("❌ 协同执行出现异常: " + err.message, "text-rose-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>🚀 立即发单 / 触发 9 大部门查漏与修 BUG</span>";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAdminTheme();
            if (localStorage.getItem("APEX_GH_TOKEN")) loadHistoryFromMemory();
            document.getElementById("cmd").addEventListener("keydown", function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); triggerSwarmAutonomousAction(); }
            });
        });
    </script>
</body>
