<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 董事长全自动 AI 驾驶舱 (Multi-File Architect V4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 驾驶舱面板 -->
    <div class="bg-slate-900 border-2 border-indigo-500/50 rounded-2xl max-w-xl w-full p-6 shadow-2xl">
        
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2.5">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 class="font-bold font-mono text-base tracking-wide">APEXWORK MULTI-FILE CONSOLE V4</h1>
            </div>
            <button onclick="toggleConfig()" class="text-[11px] font-mono px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/30 rounded transition flex items-center gap-1">
                🔑 密钥配置
            </button>
        </div>

        <!-- 隐私密钥设置框 -->
        <div id="configArea" class="hidden mb-4 p-4 bg-slate-950 border border-indigo-900/60 rounded-xl">
            <div class="text-xs font-bold text-indigo-400 font-mono mb-2">⚡ 掌门人身份与密钥绑定 (仅保存在本地设备)</div>
            <div class="space-y-2.5">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-mono">GitHub Token (ghp_开头的万能卡)</label>
                    <input id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxx..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-mono">DeepSeek API Key (sk-开头的算力卡)</label>
                    <input id="dsKeyInput" type="password" placeholder="sk-xxxxxxxxxxx..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="saveKeys()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition">
                    💾 保存并锁定在本机浏览器
                </button>
            </div>
        </div>

        <p class="text-xs text-slate-300 leading-relaxed mb-4">
            向 DeepSeek 架构级智能体下达指令。AI 将自动分析业务路由，<strong class="text-indigo-400">自动在对应目录下建立或读取 .html / .js / .json 文件</strong>，严格局部替换目标代码并锁死其余核心系统。
        </p>

        <!-- 指令输入框 -->
        <div class="mb-4">
            <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">CHAIRMAN HIGHEST DIRECTIVE / 架构决策指令</label>
            <textarea id="cmd" rows="4" 
                      placeholder="例如：&#10;1. 将 PPT 数据源分离到 /templates/aerotech-2026.json 文件中；&#10;2. 在 /editor.html 创建稻壳儿风格编辑界面；&#10;3. 在 /js/export-service.js 中锁死 $9.99 结账与本地 XML 导出..." 
                      class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500 shadow-inner"></textarea>
        </div>

        <!-- 触发执行按钮 -->
        <button onclick="triggerAutonomousEvolution()" id="runBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
            <span>🚀 立即执行架构指令，启动 AI 多文件路由与自动建站</span>
        </button>

        <!-- 实时执行日志面板 -->
        <div id="logArea" class="mt-4 hidden">
            <div class="text-[11px] font-mono text-slate-400 mb-1">SYSTEM TERMINAL / 架构级操作控制台日志:</div>
            <pre id="log" class="text-[11px] font-mono text-yellow-400 p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed max-h-56 overflow-y-auto"></pre>
        </div>

        <!-- 快捷访问主站 -->
        <div class="mt-4 pt-4 border-t border-slate-800/80 flex justify-between items-center text-xs">
            <span class="text-slate-500 font-mono">TARGET REPO: wys0130/ai-boss-empire</span>
            <a id="liveLink" href="https://wys0130.github.io/ai-boss-empire/" target="_blank" class="text-indigo-400 hover:underline font-mono font-bold">
                查看主站效果 →
            </a>
        </div>
    </div>

    <script>
        const REPO = "wys0130/ai-boss-empire";

        function getKeys() {
            const gh = localStorage.getItem("APEX_GH_TOKEN");
            const ds = localStorage.getItem("APEX_DS_KEY");
            if (!gh || !ds) {
                toggleConfig();
                throw new Error("请先点击右上角【🔑 密钥配置】，填入您的 GitHub Token 与 DeepSeek API Key！");
            }
            return { gh, ds };
        }

        function toggleConfig() {
            const area = document.getElementById("configArea");
            area.classList.toggle("hidden");
            if (!area.classList.contains("hidden")) {
                document.getElementById("ghTokenInput").value = localStorage.getItem("APEX_GH_TOKEN") || "";
                document.getElementById("dsKeyInput").value = localStorage.getItem("APEX_DS_KEY") || "";
            }
        }

        function saveKeys() {
            const gh = document.getElementById("ghTokenInput").value.trim();
            const ds = document.getElementById("dsKeyInput").value.trim();
            if (!gh || !ds) return alert("❌ 请完整填入 GitHub Token 和 DeepSeek API Key");
            localStorage.setItem("APEX_GH_TOKEN", gh);
            localStorage.setItem("APEX_DS_KEY", ds);
            toggleConfig();
            alert("✅ 身份密钥已安全记忆至本机浏览器本地数据库！全网没有任何第三方可见。");
        }

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function appendLog(msg, color = "") {
            const logArea = document.getElementById("logArea");
            const log = document.getElementById("log");
            logArea.classList.remove("hidden");
            if (color) log.className = `text-[11px] font-mono ${color} p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed max-h-56 overflow-y-auto`;
            log.innerText += `>> ${msg}\n`;
            log.scrollTop = log.scrollHeight;
        }

        // RAG 记忆精简处理
        function optimizeMemoryForPrompt(fullMemoryText) {
            const lines = fullMemoryText.split("\n").filter(l => l.trim() !== "");
            if (lines.length <= 18) return fullMemoryText;
            return lines.slice(0, 12).join("\n") + "\n\n... [为节省 Token 算力，已按需过滤早期无效调试记录] ...\n\n【最新核心实战经历】:\n" + lines.slice(-5).join("\n");
        }

        // 尝试拉取远程文件（如不存在说明 AI 需要在目标路径新建该文件）
        async function getGithubFileSafe(path, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
            if (!res.ok) {
                appendLog(`📁 检测到目标文件 [${path}] 不存在，AI 将在推送时自动新建并建立路径！`, "text-indigo-400");
                return { content: "", sha: null };
            }
            const data = await res.json();
            return { content: b64_to_utf8(data.content), sha: data.sha };
        }

        // 自动往任意指定目录层级写文件（支持自动建夹）
        async function pushGithubFile(path, content, sha, message, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const payload = {
                message: message,
                content: utf8_to_b64(content)
            };
            if (sha) payload.sha = sha; // 如无 sha 则为新建文件夹/新文件

            const res = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`发布/新建 ${path} 失败: ` + res.statusText);
            return await res.json();
        }

        // 核心智能体调度函数
        async function triggerAutonomousEvolution() {
            const btn = document.getElementById("runBtn");
            const cmdInput = document.getElementById("cmd");
            const cmd = cmdInput.value || "构建大厂级 SaaS 多目录结构，分离 templates/aerotech-2026.json 模板与 js/editor-engine.js 编辑器交互";
            
            btn.disabled = true;
            btn.innerHTML = "<span>⚙️ 系统运转中 (AI 正在进行多文件路由与工程推理)...</span>";
            document.getElementById("log").innerText = "";
            
            try {
                const keys = getKeys();

                appendLog("正在连接 GitHub 提取 MEMORY.md 长期经验库...");
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const optimizedMemory = optimizeMemoryForPrompt(memoryFile.content || "[]");
                
                appendLog("⚡ 正在请求 DeepSeek V3 架构大脑进行『目标文件路由分析』与代码构建 (约需20秒)...", "text-yellow-400");
                
                // 核心突破提示词：强逼 AI 返回目标操作文件路径（支持 .json, .js, .html, .css 等多路径）
                const prompt = `你现在是 ApexWork 的高阶 SaaS 系统首席架构师。
请根据既往记忆，执行董事长最新的架构改造或功能升级指令。
要求：
1. 彻底弃用将所有代码堆在单一 html 的落后做法。根据需求自主判断你当前要操作的文件路径 (TARGET_FILE_PATH)，例如：
   - 业务页面可为 'index.html' 或 'editor.html'
   - 数据文件必为 'templates/aerotech-2026.json'
   - 交互引擎必为 'js/editor-engine.js' 或 'js/export-service.js'
   - 样式约束必为 'css/style.css'
2. 代码必须遵循增量原则：不可提炼或改动的核心部分直接锁死保留，严禁写死链接或空壳样式；
3. 输出完整的目标文件更新后全量代码或新文件内容。

【既往核心记忆库 MEMORY.md (精简版)】：
${optimizedMemory}

【高层执行决策指令】：
"${cmd}"

你必须严格按照以下分割标记输出响应，切勿附加任何对话闲聊：
===NEW_MEMORY===
- [EVO-RECORD]: <用1句话记载今天升级的技术规范与多文件分层逻辑>
===TARGET_FILE_PATH===
<在此填写你要修改或创建的对应仓库相对路径，例如：templates/aerotech-2026.json 或 editor.html>
===FILE_CONTENT===
<在此输出你要写入该对应目标文件内的真正可运行代码或严格 JSON 格式内容>`;

                const dsRes = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${keys.ds}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一位崇尚模块化、动静分离、大厂极客规范的顶尖全栈架构师。" },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.3
                    })
                });

                if (!dsRes.ok) throw new Error("DeepSeek API 请求发生错误: " + dsRes.statusText);
                const dsData = await dsRes.json();
                const aiAnswer = dsData.choices[0].message.content;

                appendLog("DeepSeek 架构设计完成！正在解析对应物理路由与代码包...");
                const memParts = aiAnswer.split("===NEW_MEMORY===");
                const targetParts = aiAnswer.split("===TARGET_FILE_PATH===");
                const contentParts = aiAnswer.split("===FILE_CONTENT===");

                if (memParts.length < 2 || targetParts.length < 2 || contentParts.length < 2) {
                    throw new Error("AI 返回指令标记不规范，未提取到合法文件路径，已启动自动防御机制拦截推版。");
                }

                const newMemoryLine = targetParts[0].replace("===NEW_MEMORY===", "").trim();
                const targetFilePath = contentParts[0].replace("===TARGET_FILE_PATH===","").trim();
                const newFileContent = contentParts[1].replace(/```[a-z]*/g, "").replace(/```/g, "").trim();

                appendLog(`📍 [智能路由锁定]: AI 判断本任务目标操作路径为 =>【 ${targetFilePath} 】`, "text-indigo-300 font-bold");

                // 拉取目标文件的现有 SHA（如果已存在则覆盖更新，如不存在则为自动建立文件夹/创建新文件）
                const targetExisting = await getGithubFileSafe(targetFilePath, keys.gh);

                appendLog(`正在向 GitHub 仓库推送目标文件 [${targetFilePath}]，按需自动建立所属目录...`);
                await pushGithubFile(targetFilePath, newFileContent, targetExisting.sha, `🤖 DeepSeek Architecture Update: ${targetFilePath}`, keys.gh);

                appendLog(`正在提交新的系统记忆到 MEMORY.md...`);
                const updatedMemory = (memoryFile.content || "") + "\n" + newMemoryLine;
                await pushGithubFile("MEMORY.md", updatedMemory, memoryFile.sha, `🤖 AI Memory Update: ${newMemoryLine.slice(0, 35)}`, keys.gh);

                appendLog(`✅ 全自动架构演变任务 100% 成功执行！[ ${targetFilePath} ] 已生成上线。`, "text-emerald-400 font-bold");
                
                // 历史归档与清理
                appendLog(`📋 [历史指令归档]: "${cmd}"`, "text-indigo-300");
                cmdInput.value = "";
                
                // 链接自动刷新
                const cacheBusterUrl = `https://wys0130.github.io/ai-boss-empire/?v=${Date.now()}`;
                const liveLinkBtn = document.getElementById("liveLink");
                liveLinkBtn.href = cacheBusterUrl;
                liveLinkBtn.innerText = "🔥 查看最新多文件系统效果 (已破除缓存) →";

            } catch (err) {
                appendLog("❌ 失败中止: " + err.message, "text-rose-400");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>🚀 立即执行架构指令，启动 AI 多文件路由与自动建站</span>";
            }
        }
    </script>
</body>
</html>
