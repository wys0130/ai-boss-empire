<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEXWORK 驾驶舱 (模块化极简最终版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 👑 纯洁调用远端 CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#0b0f19] text-[#f8fafc] min-h-screen flex flex-col justify-between p-3 font-sans">

    <!-- 悬浮说明提示气泡 -->
    <div id="apexTooltip"></div>

    <!-- 顶部导览 -->
    <header class="max-w-7xl w-full mx-auto bg-[#111827] border border-[#1f2937] rounded-xl px-4 py-2.5 mb-2.5 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold font-mono text-xs md:text-sm tracking-wide text-white">APEXWORK 智能体驾驶舱</h1>
            <span id="qaStatusBadge" class="text-[10px] font-mono px-2 py-0.5 bg-slate-800 text-emerald-400 border border-slate-700 rounded font-bold">🛡️ QA GUARD: NORMAL</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap text-xs font-mono">
            <!-- 👑 按钮 1：高亮回归的直达主页按钮 -->
            <button onclick="openLiveSiteForceBypass()" class="px-3 py-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white border border-blue-400/50 rounded-lg font-bold shadow-md transition flex items-center gap-1">
                <span>🏠 直达商城主页 →</span>
            </button>
            <button onclick="openRollbackModal()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">历史快照</button>
            <button onclick="syncAllData()" class="px-2.5 py-1 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 rounded text-indigo-300 font-bold">🔄 同步数据</button>
            <button onclick="toggleConfig()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300">🔑 密钥</button>
        </div>
    </header>

    <!-- 密钥配置区 -->
    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-2 p-3 bg-[#111827] border border-indigo-500/40 rounded-xl shadow-lg">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input id="ghTokenInput" type="password" placeholder="GitHub Access Token" class="w-full bg-[#0b0f19] border border-slate-700 rounded p-1.5 text-xs font-mono text-white">
            <input id="dsKeyInput" type="password" placeholder="DeepSeek API Key" class="w-full bg-[#0b0f19] border border-slate-700 rounded p-1.5 text-xs font-mono text-white">
        </div>
        <button onclick="saveKeys()" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-1.5 rounded transition">💾 保存配置并生效</button>
    </div>

    <!-- 快照还原弹窗 -->
    <div id="rollbackModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#111827] border border-slate-700 max-w-lg w-full rounded-xl p-4 flex flex-col max-h-[70vh]">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-2">
                <span class="font-bold text-xs font-mono text-white">⏳ 历史快照还原</span>
                <button onclick="closeRollbackModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
            </div>
            <div id="commitListContainer" class="flex-1 overflow-y-auto space-y-1.5 custom-scrollbar pr-1"></div>
        </div>
    </div>

    <!-- 1. 三期目标工单进度看板 (简捷 + 悬浮详情) -->
    <section class="max-w-7xl w-full mx-auto mb-2.5 bg-[#111827] border border-[#1f2937] rounded-xl p-3 shadow-md">
        <div class="flex items-center justify-between mb-2 border-b border-slate-800 pb-1.5">
            <div class="flex items-center gap-2">
                <span class="text-amber-400 font-bold font-mono text-xs">📋 三期目标执行进度:</span>
                <span id="manifestSummaryBadge" class="text-[10px] font-mono px-2 py-0.5 bg-slate-800 text-slate-300 border border-slate-700 rounded">载入中...</span>
            </div>
            <div class="flex gap-1 font-mono text-[10px]">
                <button onclick="filterManifest('ALL')" class="manifest-tab px-2.5 py-0.5 rounded bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 font-bold">全部</button>
                <button onclick="filterManifest('STAGE_1_MVP_GLOBAL')" class="manifest-tab px-2.5 py-0.5 rounded text-slate-400 hover:text-white">1.出海</button>
                <button onclick="filterManifest('STAGE_2_CN_UPGRADE')" class="manifest-tab px-2.5 py-0.5 rounded text-slate-400 hover:text-white">2.国内</button>
                <button onclick="filterManifest('STAGE_3_FULL_SCALE')" class="manifest-tab px-2.5 py-0.5 rounded text-slate-400 hover:text-white">3.后期</button>
            </div>
        </div>
        <div id="manifestList" class="grid grid-cols-1 md:grid-cols-3 gap-2.5 max-h-[150px] overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- 2. 9 大主责部门区：按外部脚本自动输出莫兰迪色彩按键 -->
    <section class="max-w-7xl w-full mx-auto mb-2.5 bg-[#111827] border border-[#1f2937] rounded-xl p-2.5 shadow-md">
        <div class="flex items-center justify-between mb-1.5 border-b border-slate-800/80 pb-1 text-[11px] font-mono">
            <div class="flex items-center gap-2">
                <span class="text-slate-300 font-medium">聚焦调度部门:</span>
                <span id="activeDeptLabel" class="text-indigo-400 font-bold">[全景视图]</span>
            </div>
            <button onclick="resetDeptFilter()" class="text-[10px] text-slate-400 hover:text-white px-2 py-0.5">清空视图</button>
        </div>
        <div class="grid grid-cols-3 lg:grid-cols-9 gap-1.5 text-center font-mono" id="deptButtonsContainer">
            <!-- 见 js/admin-core.js 自动构建 -->
        </div>
    </section>

    <!-- 底部双栏工作区 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start overflow-hidden">
        <aside class="lg:col-span-5 bg-[#111827] border border-[#1f2937] rounded-xl p-2.5 flex flex-col h-[420px] shadow">
            <div class="flex items-center justify-between border-b border-slate-800 pb-1 mb-1.5">
                <span class="text-xs font-bold font-mono text-slate-300">系统战报日志</span>
                <span id="historyCount" class="text-[10px] font-mono text-slate-400">0条</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-1.5 custom-scrollbar pr-1"></div>
        </aside>

        <section class="lg:col-span-7 bg-[#111827] border border-[#1f2937] rounded-xl p-2.5 flex flex-col h-[420px] justify-between relative shadow">
            <div id="mentionDropdown"></div>

            <div>
                <div class="flex items-center justify-between border-b border-slate-800 pb-1 mb-1.5 text-xs font-mono">
                    <span class="font-medium text-slate-300">发送调度指令 (输入 @ 呼叫部门)</span>
                    <span class="text-[10px] text-slate-500">Ctrl+Enter 快速发送</span>
                </div>
                
                <div class="mb-1.5 relative">
                    <div id="cmd" contenteditable="true" 
                         class="w-full h-20 bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-xs text-white font-mono focus:outline-none focus:border-indigo-500 overflow-y-auto custom-scrollbar"
                         placeholder="点击此处激活输入；如：@大脑中枢 @主动产品部 抓取公开热点设计一款新PPT..."></div>
                </div>

                <button onclick="triggerSwarmAutonomousAction()" id="runBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs transition shadow flex items-center justify-center gap-1.5">
                    <span>🚀 提交至云端蜂群协同执行</span>
                </button>
            </div>

            <div class="flex-1 mt-1.5 flex flex-col min-h-0">
                <pre id="log" class="flex-1 text-[11px] font-mono text-slate-300 p-2.5 bg-[#0b0f19] border border-slate-800 rounded-lg whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 驾驶舱在线。模块化按需聚焦生效中。</pre>
            </div>

            <!-- 👑 按钮 2：底部控制台下方同备直达商城主页按钮 -->
            <div class="mt-1.5 pt-1 border-t border-slate-800 flex justify-between items-center text-xs">
                <span class="text-slate-500 font-mono text-[10px]">AUTO-EVOLVE: ACTIVE</span>
                <button onclick="openLiveSiteForceBypass()" class="text-emerald-400 hover:text-emerald-300 font-mono font-bold text-xs flex items-center gap-1">
                    <span>🏠 强制无缓存直达商城主页 →</span>
                </button>
            </div>
        </section>
    </main>

    <!-- 👑 纯净加载远端业务核心脚本 -->
    <script src="js/admin-core.js"></script>
</body>
</html>
