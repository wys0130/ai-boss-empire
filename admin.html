<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEXWORK 驾驶舱 (结构解耦·莫兰迪美学版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 👑 独立引入样式控制库 -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#08080a] text-[#f4f4f5] min-h-screen flex flex-col justify-between p-3 font-sans">

    <!-- 极速浮动气泡 -->
    <div id="apexTooltip"></div>

    <!-- 顶栏导航 -->
    <header class="max-w-7xl w-full mx-auto glass-panel rounded-lg px-4 py-2 mb-2 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold font-mono text-xs tracking-wide">APEXWORK 驾驶舱</h1>
            <span id="qaStatusBadge" class="text-[10px] font-mono px-1.5 py-0.5 bg-zinc-900/80 text-zinc-400 border border-zinc-800 rounded font-bold">QA: NORMAL</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs font-mono">
            <button onclick="openRollbackModal()" class="px-2.5 py-1 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">历史快照</button>
            <button onclick="syncAllData()" class="px-2.5 py-1 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 rounded text-indigo-300 font-bold">🔄 同步数据</button>
            <button onclick="toggleConfig()" class="px-2.5 py-1 bg-zinc-900/60 hover:bg-zinc-800 border border-zinc-800 rounded text-zinc-300">🔑 密钥</button>
        </div>
    </header>

    <!-- 密钥配置区 -->
    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-2 p-3 glass-panel border-indigo-500/30 rounded-lg">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input id="ghTokenInput" type="password" placeholder="GitHub Access Token" class="w-full bg-[#0d0d0f] border border-zinc-800 rounded p-1.5 text-xs font-mono">
            <input id="dsKeyInput" type="password" placeholder="DeepSeek API Key" class="w-full bg-[#0d0d0f] border border-zinc-800 rounded p-1.5 text-xs font-mono">
        </div>
        <button onclick="saveKeys()" class="mt-2 w-full bg-zinc-200 text-zinc-900 hover:bg-white text-xs font-bold py-1.5 rounded">保存配置</button>
    </div>

    <!-- 历史快照还原弹窗 -->
    <div id="rollbackModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel max-w-lg w-full rounded-xl p-4 flex flex-col max-h-[70vh]">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-2">
                <span class="font-bold text-xs font-mono">历史快照还原</span>
                <button onclick="closeRollbackModal()" class="text-zinc-500 hover:text-white text-sm font-bold">✕</button>
            </div>
            <div id="commitListContainer" class="flex-1 overflow-y-auto space-y-1.5 custom-scrollbar pr-1"></div>
        </div>
    </div>

    <!-- 1. 执行清单看板 (通透毛玻璃卡片) -->
    <section class="max-w-7xl w-full mx-auto mb-2 glass-panel rounded-lg p-3">
        <div class="flex items-center justify-between mb-2 border-b border-zinc-800/80 pb-1.5">
            <div class="flex items-center gap-2">
                <span class="text-zinc-300 font-bold font-mono text-xs">执行清单:</span>
                <span id="manifestSummaryBadge" class="text-[10px] font-mono px-1.5 py-0.5 bg-zinc-900 text-zinc-400 border border-zinc-800 rounded">载入中...</span>
            </div>
            <div class="flex gap-1 font-mono text-[10px]">
                <button onclick="filterManifest('ALL')" class="manifest-tab px-2 py-0.5 rounded bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 font-bold">全部</button>
                <button onclick="filterManifest('STAGE_1_MVP_GLOBAL')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">1.出海</button>
                <button onclick="filterManifest('STAGE_2_CN_UPGRADE')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">2.国内</button>
                <button onclick="filterManifest('STAGE_3_FULL_SCALE')" class="manifest-tab px-2 py-0.5 rounded text-zinc-500 hover:text-zinc-300">3.后期</button>
            </div>
        </div>
        <div id="manifestList" class="grid grid-cols-1 md:grid-cols-3 gap-2.5 max-h-[145px] overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- 2. 9 大部门聚焦栏 -->
    <section class="max-w-7xl w-full mx-auto mb-2 glass-panel rounded-lg p-2">
        <div class="flex items-center justify-between mb-1.5 border-b border-zinc-800/80 pb-1 text-[11px] font-mono">
            <div class="flex items-center gap-2">
                <span class="text-zinc-400 font-medium">聚焦部门:</span>
                <span id="activeDeptLabel" class="text-zinc-200 font-bold">[全景视图]</span>
            </div>
            <button onclick="resetDeptFilter()" class="text-[10px] text-zinc-500 hover:text-zinc-300 px-1.5 py-0.5">清空视图</button>
        </div>
        <!-- 自动渲染莫兰迪低饱和度按键 -->
        <div class="grid grid-cols-3 lg:grid-cols-9 gap-1.5 text-center font-mono" id="deptButtonsContainer"></div>
    </section>

    <!-- 底部双栏工作区 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start overflow-hidden">
        <aside class="lg:col-span-5 glass-panel rounded-lg p-2.5 flex flex-col h-[420px]">
            <div class="flex items-center justify-between border-b border-zinc-800/80 pb-1 mb-1.5">
                <span class="text-xs font-bold font-mono text-zinc-400">系统战报日志</span>
                <span id="historyCount" class="text-[10px] font-mono text-zinc-500">0条</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-1.5 custom-scrollbar pr-1"></div>
        </aside>

        <section class="lg:col-span-7 glass-panel rounded-lg p-2.5 flex flex-col h-[420px] justify-between relative">
            <div id="mentionDropdown"></div>

            <div>
                <div class="flex items-center justify-between border-b border-zinc-800/80 pb-1 mb-1.5 text-xs font-mono">
                    <span class="font-medium text-zinc-400">发送调度指令 (输入 @ 呼叫部门)</span>
                    <span class="text-[10px] text-zinc-600">Ctrl+Enter 快速发送</span>
                </div>
                <div class="mb-1.5 relative">
                    <div id="cmd" contenteditable="true" 
                         class="w-full h-20 bg-[#0c0c0e]/80 border border-zinc-800 rounded p-2 text-xs text-zinc-200 font-mono focus:outline-none focus:border-indigo-500/50 overflow-y-auto custom-scrollbar"
                         placeholder="点击此处输入；如：@大脑中枢 @主动产品部 抓取公开合规热点设计一款新PPT..."></div>
                </div>
                <button onclick="triggerSwarmAutonomousAction()" id="runBtn" class="w-full bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-200 font-bold py-2 rounded text-xs transition flex items-center justify-center gap-1.5">
                    <span>🚀 提交至云端蜂群协同执行</span>
                </button>
            </div>

            <div class="flex-1 mt-1.5 flex flex-col min-h-0">
                <pre id="log" class="flex-1 text-[11px] font-mono text-zinc-400 p-2 bg-[#0c0c0e]/80 border border-zinc-800/80 rounded whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 驾驶舱在线。严格点击插入模式与毛玻璃渲染生效中。</pre>
            </div>
        </section>
    </main>

    <!-- 👑 独立引入控制业务逻辑 -->
    <script src="components/admin-core.js"></script>
</body>
</html>
