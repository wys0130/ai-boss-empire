<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 集团 AI CTO 控制台 (V11 Pure Autonomous)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
        body.theme-dark { --bg-body: #030712; --bg-card: #0f172a; --bg-inner: #020617; --border-color: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8; }
        body.theme-light { --bg-body: #f1f5f9; --bg-card: #ffffff; --bg-inner: #f8fafc; --border-color: #e2e8f0; --text-main: #0f172a; --text-sub: #475569; }
        .themed-body { background-color: var(--bg-body); color: var(--text-main); }
        .themed-card { background-color: var(--bg-card); border-color: var(--border-color); }
        .themed-inner { background-color: var(--bg-inner); border-color: var(--border-color); }
        .themed-text { color: var(--text-main); }
        .themed-subtext { color: var(--text-sub); }
    </style>
</head>
<body class="themed-body theme-dark min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- 顶部：全词极简清爽 -->
    <header class="max-w-7xl w-full mx-auto themed-card border rounded-xl px-5 py-3 mb-4 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold font-mono text-sm tracking-wider themed-text">APEXWORK AI CTO 控制台</h1>
            <span class="text-[10px] font-mono px-2 py-0.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded font-bold">AUTONOMOUS AGENT</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button onclick="toggleAdminTheme()" id="themeBtn" class="text-xs font-mono font-bold px-3 py-1.5 themed-inner hover:opacity-80 border rounded-lg transition shadow-sm">
                <span>🌞/🌙 日夜模式</span>
            </button>
            <button onclick="openRollbackModal()" class="text-xs font-mono font-bold px-3 py-1.5 bg-amber-600/20 hover:bg-amber-600/40 text-amber-500 border border-amber-500/40 rounded-lg transition shadow-sm">
                <span>⏳ 一键回退</span>
            </button>
            <button onclick="loadHistoryFromMemory()" class="text-xs font-mono px-3 py-1.5 themed-inner hover:opacity-80 border rounded-lg transition">
                <span>🔄 刷新记录</span>
            </button>
            <button onclick="toggleConfig()" class="text-xs font-mono px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-400 border border-indigo-500/40 rounded-lg transition">
                <span>🔑 密钥设置</span>
            </button>
        </div>
    </header>

    <div id="configArea" class="hidden max-w-7xl w-full mx-auto mb-4 p-4 themed-card border border-indigo-500/50 rounded-xl shadow-2xl">
        <div class="text-xs font-bold text-indigo-400 font-mono mb-2">⚡ 董事长授权与算力池本地锁定</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input id="ghTokenInput" type="password" placeholder="GitHub Access Token (ghp_...)" class="w-full themed-inner border rounded-lg p-2 text-xs themed-text font-mono focus:outline-none focus:border-indigo-500">
            <input id="dsKeyInput" type="password" placeholder="DeepSeek / OpenRouter API Key (sk-...)" class="w-full themed-inner border rounded-lg p-2 text-xs themed-text font-mono focus:outline-none focus:border-indigo-500">
        </div>
        <button onclick="saveKeys()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition">💾 保存算力配置</button>
    </div>

    <!-- 历史快照时间漫游 -->
    <div id="rollbackModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="themed-card border max-w-2xl w-full rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between border-b border-gray-500/20 pb-3 mb-4">
                <span class="font-bold text-sm font-mono themed-text">⏳ 一键回退 · 挑选历史稳定快照</span>
                <button onclick="closeRollbackModal()" class="text-gray-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div id="commitListContainer" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                <div class="text-center text-xs themed-subtext py-10 font-mono">查询快照中...</div>
            </div>
        </div>
    </div>

    <!-- 主架构 -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start overflow-hidden">
        
        <!-- 左栏：AI 进化日志 (零多余文字) -->
        <aside class="lg:col-span-5 themed-card border rounded-2xl p-4 flex flex-col h-[650px] shadow-xl">
            <div class="flex items-center justify-between border-b border-gray-500/20 pb-3 mb-3">
                <span class="text-xs font-bold font-mono tracking-wide themed-text">🕒 AI 进化日志</span>
                <span id="historyCount" class="text-[10px] font-mono themed-inner border px-2 py-0.5 rounded themed-subtext">0 RECORDS</span>
            </div>
            <div id="historyFeed" class="flex-1 overflow-y-auto space-y-2.5 custom-scrollbar pr-1.5">
                <div class="text-center text-xs themed-subtext py-10 font-mono">加载记录中...</div>
            </div>
        </aside>

        <!-- 右栏：决策与思考终端 -->
        <section class="lg:col-span-7 themed-card border rounded-2xl p-5 flex flex-col h-[650px] shadow-xl justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-gray-500/20 pb-3 mb-3">
                    <span class="text-xs font-bold font-mono text-indigo-400">控制台 / 指令反馈</span>
                    <span class="text-[10px] font-mono themed-subtext">快捷发送: <strong class="themed-text">Ctrl + Enter</strong></span>
                </div>
                <div class="mb-3">
                    <textarea id="cmd" rows="3" placeholder="输入手写指令；或留空直接敲 Enter，触发 AI 自主复盘商业大厂并深度改版..." class="w-full themed-inner border rounded-xl p-3.5 text-sm themed-text font-mono focus:outline-none focus:border-indigo-500 shadow-inner"></textarea>
                </div>
                <button onclick="triggerAutonomousEvolution()" id="runBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <span>🚀 立即发车 / 启动 AI 自主思考迭代</span>
                </button>
            </div>

            <!-- 控制台终端：输出真正的 [THOUGHT_PROCESS] 内心推演 -->
            <div class="flex-1 mt-4 flex flex-col min-h-0">
                <div class="text-[10px] font-mono themed-subtext mb-1 flex justify-between">
                    <span>终端思考日志:</span>
                    <span class="text-emerald-500">● ACTIVE AGENT READY</span>
                </div>
                <pre id="log" class="flex-1 text-[11px] font-mono text-yellow-500 p-3.5 themed-inner border rounded-xl whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar">>> 董事长请监督：AI CTO 已经锁定【少字多图·视觉优先】铁律，可随时自主复盘开发。</pre>
            </div>

            <div class="mt-4 pt-3 border-t border-gray-500/20 flex justify-between items-center text-xs">
                <span class="themed-subtext font-mono text-[10px]">CACHE PURGE: ENABLED</span>
                <button onclick="openLiveSiteForceBypass()" class="text-emerald-500 hover:text-emerald-400 font-mono font-bold flex items-center gap-1">
                    🔥 强制无缓存直达主页 (跳过 Ctrl+F5) →
                </button>
            </div>
        </section>
    </main>

    <script>
        const REPO = "wys0130/ai-boss-empire";

        function initAdminTheme() {
            const savedTheme = localStorage.getItem("APEX_ADMIN_THEME") || "theme-dark";
            document.body.className = `themed-body ${savedTheme} min-h-screen flex flex-col justify-between p-4 font-sans`;
            document.getElementById("themeBtn").innerHTML = savedTheme === "theme-light" ? "<span>🌙 切换黑夜</span>" : "<span>🌞 切换白版</span>";
        }

        function toggleAdminTheme() {
            const nextTheme = document.body.classList.contains("theme-dark") ? "theme-light" : "theme-dark";
            document.body.className = `themed-body ${nextTheme} min-h-screen flex flex-col justify-between p-4 font-sans`;
            localStorage.setItem("APEX_ADMIN_THEME", nextTheme);
            document.getElementById("themeBtn").innerHTML = nextTheme === "theme-light" ? "<span>🌙 切换黑夜</span>" : "<span>🌞 切换白版</span>";
        }

        function getKeys() {
            const gh = localStorage.getItem("APEX_GH_TOKEN");
            const ds = localStorage.getItem("APEX_DS_KEY");
            if (!gh || !ds) { toggleConfig(); throw new Error("请先设置 Key！"); }
            return { gh, ds };
        }

        function toggleConfig() { document.getElementById("configArea").classList.toggle("hidden"); }
        function saveKeys() {
            localStorage.setItem("APEX_GH_TOKEN", document.getElementById("ghTokenInput").value.trim());
            localStorage.setItem("APEX_DS_KEY", document.getElementById("dsKeyInput").value.trim());
            toggleConfig();
            alert("✅ 密钥配置已生效！");
            loadHistoryFromMemory();
        }

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        function appendLog(msg, color = "") {
            const log = document.getElementById("log");
            if (color) log.className = `flex-1 text-[11px] font-mono ${color} p-3.5 themed-inner border rounded-xl whitespace-pre-wrap leading-relaxed overflow-y-auto custom-scrollbar`;
            log.innerText += `\n>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        function openLiveSiteForceBypass() {
            window.open(`https://wys0130.github.io/ai-boss-empire/?nocache=${Date.now()}_${Math.random().toString(36).substring(7)}`, '_blank');
        }

        function openRollbackModal() {
            document.getElementById("rollbackModal").classList.remove("hidden");
            fetchCommitHistory();
        }

        function closeRollbackModal() {
            document.getElementById("rollbackModal").classList.add("hidden");
        }

        async function fetchCommitHistory() {
            const container = document.getElementById("commitListContainer");
            container.innerHTML = `<div class="text-center text-xs themed-subtext py-8 font-mono">拉取版本历史中...</div>`;
            try {
                const keys = getKeys();
                const res = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=10`, { headers: { "Authorization": `token ${keys.gh}` } });
                const commits = await res.json();
                if (!Array.isArray(commits)) return container.innerHTML = `<div class="text-center text-xs text-rose-500 py-8">获取失败</div>`;

                container.innerHTML = "";
                commits.forEach((item, idx) => {
                    const shaShort = item.sha.slice(0, 7);
                    const timeStr = new Date(item.commit.committer.date).toLocaleString('zh-CN', { hour12: false });
                    const isCurrent = idx === 0;

                    container.innerHTML += `
                        <div class="themed-inner border rounded-xl p-3 flex items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-mono text-xs font-bold text-amber-500">[#${shaShort}]</span>
                                    <span class="text-[10px] themed-subtext font-mono">${timeStr}</span>
                                    ${isCurrent ? '<span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-1.5 py-0.5 rounded font-bold">运行中</span>' : ''}
                                </div>
                                <div class="text-xs themed-text font-mono truncate">${item.commit.message}</div>
                            </div>
                            <div>
                                ${isCurrent ? 
                                    `<button disabled class="px-3 py-1.5 bg-gray-500/20 text-gray-400 text-[11px] rounded-lg">运行中</button>` : 
                                    `<button onclick="revertToSelectedCommit('${item.sha}', '${shaShort}')" class="px-3 py-1.5 bg-rose-600/30 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/50 rounded-lg text-[11px] font-bold transition">确认回退</button>`
                                }
                            </div>
                        </div>
                    `;
                });
            } catch (err) { container.innerHTML = `<div class="text-center text-xs text-rose-500 py-8">异常：${err.message}</div>`; }
        }

        async function revertToSelectedCommit(targetSha, shortSha) {
            if (!confirm(`⏳ 确定一键将全站回退到版本 [#${shortSha}] 吗？`)) return;
            closeRollbackModal();
            try {
                const keys = getKeys();
                appendLog(`正在回退代码至 [#${shortSha}]...`, "text-amber-500");

                const rawIndexUrl = `https://raw.githubusercontent.com/${REPO}/${targetSha}/index.html`;
                const indexRes = await fetch(rawIndexUrl);
                if (indexRes.ok) {
                    const prevCode = await indexRes.text();
                    const currentFile = await getGithubFileSafe("index.html", keys.gh);
                    await pushGithubFile("index.html", prevCode, currentFile.sha, `⏳ TIME-TRAVEL: Restored to #${shortSha}`, keys.gh);
                }

                const nowStr = formatStandardTime(new Date());
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const updatedMem = (memoryFile.content || "") + `\n- [VETO-RECORD | ${nowStr}]: 董事长一键回退代码至 [#${shortSha}]。`;
                await pushGithubFile("MEMORY.md", updatedMem, memoryFile.sha, `🤖 Memory: Reverted to #${shortSha}`, keys.gh);

                appendLog(`✅ 全站代码已成功还原至 [#${shortSha}]！`, "text-emerald-500 font-bold");
                await loadHistoryFromMemory();
            } catch(err) { appendLog("❌ 回退异常: " + err.message, "text-rose-500"); }
        }

        function formatStandardTime(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const mm = String(dateObj.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${hh}:${mm}`;
        }

        async function loadHistoryFromMemory() {
            const feed = document.getElementById("historyFeed");
            try {
                const keys = getKeys();
                const memFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                const lines = (memFile.content || "").split("\n").filter(l => l.includes("[EVO-RECORD") || l.includes("[VETO-RECORD"));
                document.getElementById("historyCount").innerText = `${lines.length} RECORDS`;

                if (lines.length === 0) {
                    feed.innerHTML = `<div class="text-center text-xs themed-subtext py-10 font-mono">暂无记录</div>`;
                    return;
                }

                feed.innerHTML = "";
                lines.reverse().forEach((line, idx) => {
                    const isLatest = idx === 0;
                    const exactDateMatch = line.match(/(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
                    const timeStr = exactDateMatch ? exactDateMatch[1] : formatStandardTime(new Date(Date.now() - (idx * 180 * 60 * 1000)));
                    let cleanText = line.replace(/^- /, "").replace(/\[EVO-RECORD[^\]]*\]:/, "").replace(/\[VETO-RECORD[^\]]*\]:/, "").trim();

                    let cardBorder = isLatest ? "border-emerald-500/60 themed-inner shadow-md ring-1 ring-emerald-500/20" : "border-gray-500/20 themed-inner opacity-75";
                    let badge = isLatest ? `<span class="text-emerald-400 text-[10px] font-bold">🔥 LATEST</span>` : `<span class="themed-subtext text-[10px]">🕒 ARCHIVE</span>`;

                    feed.innerHTML += `
                        <div class="border rounded-xl p-3 transition ${cardBorder}">
                            <div class="flex items-center justify-between text-[10px] font-mono themed-subtext mb-1 border-b border-gray-500/20 pb-1">
                                <span class="themed-text font-bold">⏱️ ${timeStr}</span>
                                <div class="flex items-center gap-2"><span>#${lines.length - idx}</span>${badge}</div>
                            </div>
                            <div class="text-xs ${isLatest ? 'themed-text font-medium' : 'themed-subtext'} leading-relaxed font-mono">${cleanText}</div>
                        </div>
                    `;
                });
            } catch (err) { feed.innerHTML = `<div class="text-center text-xs text-rose-500 py-10">拉取时序异常</div>`; }
        }

        async function getGithubFileSafe(path, token) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers: { "Authorization": `token ${token}` } });
            if (!res.ok) return { content: "", sha: null };
            const data = await res.json();
            return { content: b64_to_utf8(data.content), sha: data.sha };
        }

        async function pushGithubFile(path, content, sha, message, token) {
            const payload = { message: message, content: utf8_to_b64(content) };
            if (sha) payload.sha = sha;
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`推送 ${path} 失败`);
            return await res.json();
        }

        // 👑 真正的 AI 自主思考与研发：在终端直接打印出大模型分析推演的真·心路历程
        async function triggerAutonomousEvolution() {
            const btn = document.getElementById("runBtn");
            const cmdInput = document.getElementById("cmd");
            const cmd = cmdInput.value.trim() || "【AI 自主决策升级】：恪守少字多图铁律，自主审查大厂商务趋势，重构并精修 index.html 与 editor.html UI 体验。";

            btn.disabled = true;
            btn.innerHTML = "<span>⚙️ AI CTO 深度推演决策中...</span>";
            appendLog("🧠 AI 智能体已激活，开始展开系统分析与商业推演...");

            try {
                const keys = getKeys();
                const memoryFile = await getGithubFileSafe("MEMORY.md", keys.gh);
                
                const prompt = `你是 ApexWork 集团自主开发的 AI 首席技术官 (CTO)。
董事长的最高铁律：1. 任何生成的页面必须遵守【视觉优先：绝不多字，多用高清大图与可视图表】；2. AI 具有完全自主权，无需等待人类指挥，立刻独立分析商用趋势改版代码。
【现有核心记忆库】：
${memoryFile.content || "无"}
【执行目标/自主方针】：
"${cmd}"
请务必按以下标记先输出你的核心思考过程 [THOUGHT_PROCESS]，再输出代码：
===THOUGHT_PROCESS===
<在这里用2-3句话输出 AI 作为 CTO 的深度分析：例如为啥把大文字改为了可视化图表、为什么更新背景图等>
===NEW_MEMORY===
- [EVO-RECORD]: <1句话提炼架构进步>
===TARGET_FILE_PATH===
<在此填写你想更新或创建的文件，如 editor.html 或 index.html>
===FILE_CONTENT===
<完整的对应更新后代码>`;

                const dsRes = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${keys.ds}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "system", content: "你是遵守视觉优先铁律、追求极客体验与自主架构的 AI CTO。" }, { role: "user", content: prompt }],
                        temperature: 0.3
                    })
                });

                if (!dsRes.ok) throw new Error("API 响应异常: " + dsRes.statusText);
                const aiAnswer = (await dsRes.json()).choices[0].message.content;

                const thoughtParts = aiAnswer.split("===THOUGHT_PROCESS===");
                const memParts = aiAnswer.split("===NEW_MEMORY===");
                const targetParts = aiAnswer.split("===TARGET_FILE_PATH===");
                const contentParts = aiAnswer.split("===FILE_CONTENT===");

                if (memParts.length < 2 || targetParts.length < 2 || contentParts.length < 2) throw new Error("模型响应格式异常");

                const thoughtText = thoughtParts[1] ? thoughtParts[1].split("===NEW_MEMORY===")[0].trim() : "已确认【视觉优先、少字多图】研发标准。";
                const rawMemoryLine = targetParts[0].replace("===NEW_MEMORY===", "").trim();
                const targetFilePath = contentParts[0].replace("===TARGET_FILE_PATH===","").trim();
                const newFileContent = contentParts[1].replace(/```[a-z]*/g, "").replace(/```/g, "").trim();

                // 👑 实时把真实的大模型思考推演输出在控制台让董事长检验！
                appendLog(`🧠 [AI CTO 自主推演记录]:\n${thoughtText}`, "text-emerald-400");
                appendLog(`📍 [目标物理路由锁存]: =>【 ${targetFilePath} 】`, "text-indigo-400 font-bold");

                const targetExisting = await getGithubFileSafe(targetFilePath, keys.gh);
                await pushGithubFile(targetFilePath, newFileContent, targetExisting.sha, `🤖 AI CTO Evolve: ${targetFilePath}`, keys.gh);

                const nowStr = formatStandardTime(new Date());
                const timestampedMemoryLine = rawMemoryLine.replace("[EVO-RECORD]:", `[EVO-RECORD | ${nowStr}]:`);
                const updatedMemory = (memoryFile.content || "") + "\n" + timestampedMemoryLine;
                await pushGithubFile("MEMORY.md", updatedMemory, memoryFile.sha, `🤖 Memory: ${timestampedMemoryLine.slice(0, 35)}`, keys.gh);

                appendLog(`✅ AI CTO 研发任务 100% 完成！[ ${targetFilePath} ] 已经通过推版上线。`, "text-emerald-500 font-bold");
                cmdInput.value = "";
                await loadHistoryFromMemory();
            } catch (err) {
                appendLog("❌ 开发任务异常中止: " + err.message, "text-rose-500");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>🚀 立即发车 / 启动 AI 自主思考迭代</span>";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAdminTheme();
            if (localStorage.getItem("APEX_GH_TOKEN")) loadHistoryFromMemory();
            document.getElementById("cmd").addEventListener("keydown", function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); triggerAutonomousEvolution(); }
            });
        });
    </script>
