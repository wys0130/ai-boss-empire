<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexWork 董事长专属 AI 驾驶舱 (Secure Console V3)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 驾驶舱面板 -->
    <div class="bg-slate-900 border-2 border-indigo-500/50 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
        
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2.5">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 class="font-bold font-mono text-base tracking-wide">APEXWORK AI CONSOLE</h1>
            </div>
            <button onclick="toggleConfig()" class="text-[11px] font-mono px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/30 rounded transition flex items-center gap-1">
                🔑 密钥配置
            </button>
        </div>

        <!-- 隐私密钥设置框（仅保存在个人浏览器本地缓存，绝对不上传 GitHub） -->
        <div id="configArea" class="hidden mb-4 p-4 bg-slate-950 border border-indigo-900/60 rounded-xl">
            <div class="text-xs font-bold text-indigo-400 font-mono mb-2">⚡ 掌门人身份与密钥绑定 (仅保存在本地设备)</div>
            <div class="space-y-2.5">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-mono">GitHub Token (ghp_开头的万能卡)</label>
                    <input id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxx..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1 font-mono">DeepSeek API Key (sk-开头的算力卡)</label>
                    <input id="dsKeyInput" type="password" placeholder="sk-xxxxxxxxxxx..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="saveKeys()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-lg transition">
                    💾 保存并锁定在本机浏览器
                </button>
            </div>
        </div>

        <p class="text-xs text-slate-300 leading-relaxed mb-4">
            向 DeepSeek 增长大脑下达高层指令。系统将按需精准提取 <code>MEMORY.md</code>，重构页面并推往 GitHub 上线。
        </p>

        <!-- 指令输入框 -->
        <div class="mb-4">
            <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">CHAIRMAN HIGHEST DIRECTIVE / 决策指令</label>
            <textarea id="cmd" rows="4" 
                      placeholder="输入您的战略调整方向，例如：&#10;1. 优化整站高管商业信任感视觉；&#10;2. 增加品牌成功背书模块；&#10;3. 将购买按键高亮强化促单..." 
                      class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500 shadow-inner"></textarea>
        </div>

        <!-- 触发执行按钮 -->
        <button onclick="triggerAutonomousEvolution()" id="runBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
            <span>🚀 立即执行指令，启动 AI 自主进化升级</span>
        </button>

        <!-- 实时执行日志面板 -->
        <div id="logArea" class="mt-4 hidden">
            <div class="text-[11px] font-mono text-slate-400 mb-1">SYSTEM TERMINAL / 系统交互日志:</div>
            <pre id="log" class="text-[11px] font-mono text-yellow-400 p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto"></pre>
        </div>

        <!-- 快捷访问主站 -->
        <div class="mt-4 pt-4 border-t border-slate-800/80 flex justify-between items-center text-xs">
            <span class="text-slate-500 font-mono">TARGET: wys0130.github.io/ai-boss-empire</span>
            <a id="liveLink" href="https://wys0130.github.io/ai-boss-empire/" target="_blank" class="text-indigo-400 hover:underline font-mono font-bold">
                查看主站效果 →
            </a>
        </div>
    </div>

    <script>
        const REPO = "wys0130/ai-boss-empire";

        // 从客户端本地存储提取密钥（绝不能泄露在代码里）
        function getKeys() {
            const gh = localStorage.getItem("APEX_GH_TOKEN");
            const ds = localStorage.getItem("APEX_DS_KEY");
            if (!gh || !ds) {
                toggleConfig();
                throw new Error("请先点击右上角【🔑 密钥配置】，填入您的 GitHub Token 与 DeepSeek API Key！");
            }
            return { gh, ds };
        }

        function toggleConfig() {
            const area = document.getElementById("configArea");
            area.classList.toggle("hidden");
            if (!area.classList.contains("hidden")) {
                document.getElementById("ghTokenInput").value = localStorage.getItem("APEX_GH_TOKEN") || "";
                document.getElementById("dsKeyInput").value = localStorage.getItem("APEX_DS_KEY") || "";
            }
        }

        function saveKeys() {
            const gh = document.getElementById("ghTokenInput").value.trim();
            const ds = document.getElementById("dsKeyInput").value.trim();
            if (!gh || !ds) return alert("❌ 请完整填入 GitHub Token 和 DeepSeek API Key");
            localStorage.setItem("APEX_GH_TOKEN", gh);
            localStorage.setItem("APEX_DS_KEY", ds);
            toggleConfig();
            alert("✅ 身份密钥已安全记忆至本机浏览器本地数据库！全网没有任何第三方可见。");
        }

        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }
        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        function appendLog(msg, color = "") {
            const logArea = document.getElementById("logArea");
            const log = document.getElementById("log");
            logArea.classList.remove("hidden");
            if (color) log.className = `text-[11px] font-mono ${color} p-3.5 bg-slate-950 rounded-xl border border-slate-800 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto`;
            log.innerText += `>> ${msg}\n`;
            log.scrollTop = log.scrollHeight;
        }

        // --- 核心优化点：RAG 按需调取记忆，自动排除无关冗余记录，节省 50%+ 算力 ---
        function optimizeMemoryForPrompt(fullMemoryText) {
            const lines = fullMemoryText.split("\n").filter(l => l.trim() !== "");
            if (lines.length <= 18) return fullMemoryText;
            // 保留前 12 行（核心底层宪法与业务规则底线）
            const coreConstitution = lines.slice(0, 12);
            // 仅提取最后 5 行（近期最核心的实战优化经历与锁定区域）
            const latestRecords = lines.slice(-5);
            return coreConstitution.join("\n") + "\n\n... [为节省 Token 算力，已按需过滤早期无效调试记录] ...\n\n【最新核心实战经历】:\n" + latestRecords.join("\n");
        }

        async function getGithubFile(path, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const res = await fetch(url, {
                headers: { "Authorization": `token ${token}` }
            });
            if (!res.ok) throw new Error(`拉取 ${path} 失败: ` + res.statusText);
            const data = await res.json();
            return { content: b64_to_utf8(data.content), sha: data.sha };
        }

        async function pushGithubFile(path, content, sha, message, token) {
            const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
            const res = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Accept": "application/vnd.github.v3+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    content: utf8_to_b64(content),
                    sha: sha
                })
            });
            if (!res.ok) throw new Error(`发布 ${path} 失败`);
            return await res.json();
        }

        async function triggerAutonomousEvolution() {
            const btn = document.getElementById("runBtn");
            const cmdInput = document.getElementById("cmd");
            const cmd = cmdInput.value || "审查当前高管审美与 UI 布局，自动优化转化率与购买体验";
            
            btn.disabled = true;
            btn.innerHTML = "<span>⚙️ 系统运转中 (正在同步 GitHub 与 DeepSeek)...</span>";
            document.getElementById("log").innerText = "";
            
            try {
                const keys = getKeys();

                appendLog("正在连接 GitHub 提取 MEMORY.md 长期经验库...");
                const memoryFile = await getGithubFile("MEMORY.md", keys.gh);
                
                // --- 触发按需精简 ---
                const optimizedMemory = optimizeMemoryForPrompt(memoryFile.content);
                appendLog("⚡ 记忆按需压缩完毕：已锁定核心底线 + 选取最近 5 条实战成果，有效节省 Token 算力！", "text-indigo-400");
                
                appendLog("正在提取 index.html 网页源代码...");
                const htmlFile = await getGithubFile("index.html", keys.gh);

                appendLog("正在请求 DeepSeek 大脑展开推理与增量代码重构 (约需15~20秒)...", "text-yellow-400");
                
                const prompt = `你现在是 ApexWork 的 AI 首席产品经理与现代 Tailwind CSS 极客全栈工程师。
请依据既往记忆库，并执行董事长最新的优化指令。
要求：
1. 强制采用高阶亮白商务美学，绝不能输出空死链接或没有绑定事件的摆设按钮；
2. Pay-to-Export 本地下载与 ?status=paid 跳转拦截逻辑强制保持锁定状态，绝对不可删改破坏；
3. 基于原有健全交互进一步优化。

【既往核心记忆库 MEMORY.md (按需精简版)】：
${optimizedMemory}

【当前页 index.html 源码】：
${htmlFile.content}

【高层直接指导指令】：
"${cmd}"

必须严格按照以下分割标记作答，禁止包含多余说明：
===NEW_MEMORY===
- [EVO-RECORD]: <用1句话记载今天优化得出的产品或审美规则>
===NEW_HTML===
<输出修改好的完整有效 HTML 新源码>`;

                const dsRes = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${keys.ds}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: "你是一位精通高阶 SaaS UI/UX 与转化率增长的顶级极客工程师。" },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.4
                    })
                });

                if (!dsRes.ok) throw new Error("DeepSeek API 请求发生错误: " + dsRes.statusText);
                const dsData = await dsRes.json();
                const aiAnswer = dsData.choices[0].message.content;

                appendLog("DeepSeek 重写完毕！正在解析进化成果...");
                const memParts = aiAnswer.split("===NEW_MEMORY===");
                const htmlParts = aiAnswer.split("===NEW_HTML===");

                if (memParts.length < 2 || htmlParts.length < 2) {
                    throw new Error("AI 返回标签格式不符合规范，已启动安全自卫机制自动放弃本次覆写。");
                }

                const newMemoryLine = htmlParts[0].replace("===NEW_MEMORY===", "").trim();
                const newHtmlCode = htmlParts[1].replace(/```html/g, "").replace(/```/g, "").trim();

                appendLog(`正在自动提交新记忆: "${newMemoryLine}"`);
                const updatedMemory = memoryFile.content + "\n" + newMemoryLine;
                await pushGithubFile("MEMORY.md", updatedMemory, memoryFile.sha, `🤖 AI Memory Update: ${newMemoryLine.slice(0, 35)}`, keys.gh);

                appendLog("正在自动推送 index.html 代码并强行上线覆盖...");
                await pushGithubFile("index.html", newHtmlCode, htmlFile.sha, "🤖 DeepSeek Evolved: Evolved UI & Conversion Path", keys.gh);

                appendLog("✅ 进化任务 100% 成功执行！", "text-emerald-400");
                
                // --- 交互升级 1：自动将上一句指令归档到日志，并清空输入框让其恢复干净 ---
                appendLog(`📋 [历史指令归档]: "${cmd}"`, "text-indigo-300");
                cmdInput.value = "";
                
                // --- 交互升级 2：防缓存时间戳破除！动态修改下方主站链接，绝对不再加载旧网页 ---
                const cacheBusterUrl = `https://wys0130.github.io/ai-boss-empire/?v=${new Date().getTime()}`;
                const liveLinkBtn = document.getElementById("liveLink");
                liveLinkBtn.href = cacheBusterUrl;
                liveLinkBtn.innerText = "🔥 查看新主站效果 (已破除缓存) →";

            } catch (err) {
                appendLog("❌ 失败中止: " + err.message, "text-rose-400");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "<span>🚀 立即执行指令，启动 AI 自主进化升级</span>";
            }
        }
    </script>
</body>
</html>
