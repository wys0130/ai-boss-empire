<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK · Word ATS 合规报告编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="components/vip-download-guard.js"></script>
<script src="components/zero-auth.js"></script>
<script src="components/apex-ui-2026.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f1f5f9; }
  .bento-card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04), 0 4px 6px -2px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
  .nav-pill { transition: all 0.2s; cursor: pointer; border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-weight: 600; font-size: 0.85rem; padding: 0.6rem 1rem; border-radius: 0.75rem; text-align: left; display: flex; align-items: center; justify-content: space-between; }
  .nav-pill:hover { background: #e2e8f0; color: #0f172a; }
  .nav-pill.active { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 4px 10px -2px rgba(15,23,42,0.3); }
  .a4-paper { max-width: 720px; margin: 0 auto; background: #ffffff; border-radius: 0.5rem; padding: 3.5rem 4rem; box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1), 0 0 1px 1px rgba(0,0,0,0.05); min-height: 600px; }
  .doc-title { font-size: 1.85rem; font-weight: 800; color: #0f172a; margin-bottom: 1.5rem; border-bottom: 3px solid #0f172a; padding-bottom: 0.75rem; letter-spacing: -0.02em; transition: all 0.3s; }
  .doc-content { font-size: 1rem; color: #334155; line-height: 2; white-space: pre-wrap; font-family: 'Georgia', serif; transition: all 0.3s; }
  .input-field { border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.6rem 0.85rem; font-size: 0.875rem; transition: all 0.2s; background: #f8fafc; color: #0f172a; }
  .input-field:focus { outline: none; border-color: #6366f1; background: #ffffff; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  [contenteditable="true"]:hover { outline: 1px dashed #94a3b8; background: rgba(248,250,252,0.8); cursor: text; }
  [contenteditable="true"]:focus { outline: 2px solid #6366f1; background: #ffffff; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-6">
  
  <header class="bento-card px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-4 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold transition border border-slate-200">
        ← 返回商城
      </a>
      <span class="h-4 w-[1px] bg-slate-200"></span>
      <div>
        <h1 class="font-black text-base text-slate-900 tracking-tight" id="headerTitle">Word ATS 欧美合规报告编辑器</h1>
        <p class="text-[11px] font-mono text-slate-500" id="headerCat">九大核心章节标准架构 · 100% 适配各银行金融合规系统</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs font-mono bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5">
        <span>📑 ATS 标准行高已锁定</span>
      </span>
      <button onclick="openCheckoutModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
        立即解锁完整 .DOCX (<span id="topPriceBtn">$9.99</span>)
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-3 bento-card p-5">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-mono">📑 动态生成章节</h2>
      <nav class="space-y-1.5 max-h-[500px] overflow-y-auto custom-scroll pr-1" id="sectionNav"></nav>
    </aside>

    <main class="lg:col-span-6 bento-card p-8 bg-slate-100/60 overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold text-slate-500">欧美企业级 A4 纸张页面渲染</span>
        <span class="text-[10px] font-mono text-indigo-600 font-bold bg-indigo-50 px-2.5 py-0.5 rounded border border-indigo-200">WYSIWYG PAPER</span>
      </div>
      
      <div class="a4-paper" id="previewArea">
        <div class="doc-title" contenteditable="true" id="previewTitle" oninput="syncFromPreviewTitle(this.textContent)">正在加载...</div>
        <div class="doc-content" contenteditable="true" id="previewContent" oninput="syncFromPreviewContent(this.textContent)">请稍候...</div>
      </div>
    </main>

    <aside class="lg:col-span-3 space-y-6">
      <div class="bento-card p-6">
        <h2 class="text-sm font-bold text-slate-900 mb-4">✏️ 章节正文批量精修</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">当前章节名称</label>
            <input type="text" id="sectionTitleInput" class="input-field w-full" oninput="updatePreviewFromForm()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">章节详细正文 (支持分行)</label>
            <textarea id="sectionContentInput" class="input-field w-full h-52 leading-relaxed" oninput="updatePreviewFromForm()"></textarea>
          </div>
        </div>
      </div>

      <div class="p-6 bg-slate-900 rounded-2xl text-white shadow-xl border border-slate-800">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-indigo-400 font-mono uppercase tracking-wider">Commercial License</span>
          <button onclick="ApexAuth.openCheckout({title: 'APEXWORK 欧美 ATS 企业报告 (.DOCX)', onSuccess: () => executeDOCXExport()})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-2.5 py-1 rounded-lg font-mono transition">
            🌍 安全收银
          </button>
        </div>
        <h3 class="font-bold text-base mb-1">欧美 ATS 报告原件</h3>
        <p class="text-3xl font-black mb-4 font-mono text-white" id="mainPriceTxt">$9.99 <span class="text-xs font-normal text-slate-400">/ 一次性</span></p>
        <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <span>⚡ 立即解锁下载原文件 (.DOCX)</span>
        </button>
      </div>
    </aside>
  </div>
</div>

<script>
let sections = [
  { layoutType: 'title-page', title: '封面标题页', content: 'APEXWORK 企业合规管理与合规评估年度报告\n\n发布日期：2026 年度\n文档密级：企业机密\n标准：欧美企业通用 ATS 合规准则' },
  { layoutType: 'text-block', title: '执行摘要', content: '本合规性审查报告涵盖公司在财务报告、数据安全与隐私、雇佣平等、以及 ESG 环境治理等重点核心层面的现有实践及进阶建议。全部准则完全遵从 GAAP、GDPR 及 EEO 条例。' },
  { layoutType: 'text-block', title: '公司背景概况', content: '公司官方实体名称：APEXWORK Inc.\n法定注册所在地：美国特拉华州 (Delaware)\n现存全职正式员工总数：150\n持续运营与审计年份：2020 - 2026' },
  { layoutType: 'text-block', title: '财务合规性', content: '所有的财务报告均严格依据 GAAP 基本通用准则制定。年度独立审计均由具备权威资质的会计师事务所按时出具，且报告期内无任何重大违规与审计调整说明。' },
  { layoutType: 'text-block', title: '数据安全与隐私', content: '我们的产品及架构符合欧洲 GDPR 与美国 CCPA 隐私法规。已构建完整的数据保护影响评估（DPIA）流程，全部用户存储及传输数据均经 Ed25519 或等同算法加密。' },
  { layoutType: 'text-block', title: '雇佣与反歧视', content: '坚持平等就业机会（EEO）法则，并在公司内部全面施行严格的反 workplace 骚扰与反歧视条例。全员年度线上及线下合规培训覆盖率达到 100%。' },
  { layoutType: 'text-block', title: 'ESG 环境治理', content: '相关生产及行政园区通过 ISO 14001 环境管理体系评估。2026 年度统计总碳排放强度相较往期同比下降 15%，硬件及废弃物材料回收再利用率达 90% 以上。' },
  { layoutType: 'checklist', title: '风险评估矩阵', content: '综合识别高风险事项 0 项\n常规监测中等风险 4 项\n一般低级别改进关注点 11 项\n针对已有中等关注事项，均明确分派具体负责人及整改解决期限。' },
  { layoutType: 'quote', title: '结论与下一步', content: '公司的综合合规运行状况优异，治理结构稳固。我们建议下一步在海外扩展期内加强第三方供应商及渠道的 ESG 与安全抽检。' }
];
let currentSection = 0;

function openCheckoutModal() {
  ApexAuth.openCheckout({ title: "APEXWORK ATS 商业报告 (.DOCX)", onSuccess: () => executeDOCXExport() });
}

function renderSectionNav() {
  const navContainer = document.getElementById('sectionNav');
  navContainer.innerHTML = '';
  sections.forEach((sec, index) => {
    const isActive = index === currentSection ? 'active' : '';
    const cleanTitle = String(sec.title).replace(/<[^>]+>/g, '');
    let icon = "📝";
    if (sec.layoutType === 'quote') icon = "💭";
    if (sec.layoutType === 'checklist') icon = "✅";
    if (sec.layoutType === 'title-page' || sec.layoutType === 'cover') icon = "🏆";

    navContainer.innerHTML += `
      <button class="nav-pill w-full ${isActive}" data-index="${index}" onclick="selectSection(${index})">
        <span class="truncate pr-2">${icon} ${index + 1}. ${cleanTitle}</span>
        <span class="text-[10px] opacity-60 shrink-0">Sec</span>
      </button>
    `;
  });
}

function selectSection(index) {
  currentSection = index;
  renderSectionNav();
  const sec = sections[index];
  
  const safeTitle = String(sec.title || "加载中").replace(/<[^>]+>/g, '');
  const safeContent = String(sec.content || "报告段落正在加载，若无内容请补充。").replace(/<[^>]+>/g, '');

  document.getElementById('sectionTitleInput').value = safeTitle;
  document.getElementById('sectionContentInput').value = safeContent;
  document.getElementById('previewTitle').textContent = safeTitle;
  document.getElementById('previewContent').textContent = safeContent;

  const previewContent = document.getElementById('previewContent');
  const previewTitle = document.getElementById('previewTitle');
  
  // 每次重置样式
  previewContent.className = 'doc-content outline-none'; 
  previewTitle.className = 'doc-title outline-none';
  previewTitle.style.display = 'block';

  // 👑 核心修复 2：彻底拉开排版差距，绝不让正文混充标题变得极其巨大！
  if (sec.layoutType === 'title-page' || sec.layoutType === 'cover') {
      previewTitle.className = 'doc-title outline-none text-center font-black text-4xl md:text-5xl mt-16 border-b-0 mb-6 text-slate-900';
      previewContent.className = 'doc-content outline-none text-center text-lg md:text-xl text-slate-600 max-w-2xl mx-auto';
  } else if (sec.layoutType === 'quote') {
      previewTitle.className = 'doc-title outline-none text-2xl font-bold text-slate-800 border-b-2 border-indigo-100 mb-4 pb-2';
      previewContent.classList.add('border-l-4', 'border-indigo-500', 'pl-6', 'italic', 'text-slate-600', 'bg-slate-50', 'py-6', 'rounded-r-xl', 'text-lg');
  } else if (sec.layoutType === 'checklist') {
      previewTitle.className = 'doc-title outline-none text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 mb-4 pb-2';
      previewContent.classList.add('font-mono', 'text-sm', 'bg-slate-50', 'p-6', 'rounded-xl', 'border', 'border-slate-200');
      const listItems = safeContent.split('\n').filter(l => l.trim() !== '').map(l => `<div class="flex items-start gap-3 mb-2"><span class="text-emerald-500 font-bold">☑</span><span class="flex-1">${l}</span></div>`).join('');
      previewContent.innerHTML = listItems;
  } else {
      // 默认的 Text-Block 段落文本：强制标题为 2xl，正文为正常的 base (16px) 大小，行高拉开！
      previewTitle.className = 'doc-title outline-none text-2xl font-bold text-slate-800 border-b-2 border-slate-200 mb-4 pb-2';
      previewContent.className = 'doc-content outline-none text-base text-slate-700 leading-loose';
  }
}

function updatePreviewFromForm() {
  const title = document.getElementById('sectionTitleInput').value;
  const content = document.getElementById('sectionContentInput').value;
  sections[currentSection].title = title;
  sections[currentSection].content = content;
  
  if (sections[currentSection].layoutType === 'checklist') {
      selectSection(currentSection);
  } else {
      document.getElementById('previewTitle').textContent = title;
      document.getElementById('previewContent').textContent = content;
      renderSectionNav();
  }
}

function syncFromPreviewTitle(text) {
  document.getElementById('sectionTitleInput').value = text.trim();
  sections[currentSection].title = text.trim();
  renderSectionNav();
}

function syncFromPreviewContent(text) {
  document.getElementById('sectionContentInput').value = text;
  sections[currentSection].content = text;
}

function executeDOCXExport() {
  const zip = new JSZip();
  const doc = zip.folder('word');
  doc.file('document.xml', generateDocumentXML());
  doc.file('_rels/document.xml.rels', generateRelsXML());
  zip.file('[Content_Types].xml', generateContentTypesXML());
  zip.file('_rels/.rels', generateRootRelsXML());
  zip.generateAsync({ type: 'blob' }).then((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `APEXWORK-Report-${Date.now()}.docx`; a.click();
    URL.revokeObjectURL(url);
    alert('✅ ATS 企业级格式 Word 文档 (.docx) 下载成功！');
  });
}

function generateDocumentXML() {
  let body = '';
  sections.forEach((sec) => {
    const safeTitle = String(sec.title).replace(/<[^>]+>/g, '');
    const safeContent = String(sec.content).replace(/<[^>]+>/g, '');

    if (sec.layoutType !== 'title-page' && sec.layoutType !== 'cover') {
        body += `<w:p><w:pPr><w:spacing w:before="280" w:after="160"/><w:rPr><w:b/><w:color w:val="0F172A"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr></w:pPr><w:r><w:rPr><w:b/><w:color w:val="0F172A"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr><w:t>${safeTitle}</w:t></w:r></w:p>`;
    }
    
    const paragraphs = safeContent.split('\n');
    paragraphs.forEach(pText => {
      if(pText.trim() === '') return;

      let runProps = `<w:color w:val="334155"/><w:sz w:val="22"/><w:szCs w:val="22"/>`;
      let pProps = `<w:spacing w:line="360" w:lineRule="auto" w:after="120"/>`;
      
      if (sec.layoutType === 'quote') {
          runProps += `<w:i/>`; 
          pProps += `<w:ind w:left="400"/>`; 
      } else if (sec.layoutType === 'title-page' || sec.layoutType === 'cover') {
          runProps = `<w:b/><w:color w:val="0F172A"/><w:sz w:val="48"/><w:szCs w:val="48"/>`; 
          pProps = `<w:jc w:val="center"/><w:spacing w:before="600" w:after="400"/>`; 
      }

      let textToRender = pText;
      if (sec.layoutType === 'checklist') {
          textToRender = '☑ ' + textToRender;
      }

      body += `<w:p><w:pPr>${pProps}<w:rPr>${runProps}</w:rPr></w:pPr><w:r><w:rPr>${runProps}</w:rPr><w:t>${textToRender}</w:t></w:r></w:p>`;
    });
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`;
}

function generateRelsXML() { return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`; }
function generateContentTypesXML() { return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`; }
function generateRootRelsXML() { return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`; }

window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const deckId = params.get('deck');
    
    if (deckId && deckId.startsWith('AI-')) {
        let targetAiDeck = null;
        try {
            const localDecks = JSON.parse(localStorage.getItem('APEX_AUDIT_PRODUCTS') || '[]');
            const blacklist = JSON.parse(localStorage.getItem('APEX_DELETED_ZOMBIES') || '[]');
            targetAiDeck = localDecks.find(d => d.id === deckId && !blacklist.includes(d.id));
        } catch(e) {}

        if (!targetAiDeck) {
            try {
                const res = await fetch(`data/ai-generated-decks.json?_t=${Date.now()}`);
                if (res.ok) {
                    const decks = await res.json();
                    const blacklist = JSON.parse(localStorage.getItem('APEX_DELETED_ZOMBIES') || '[]');
                    targetAiDeck = decks.find(d => d.id === deckId && !blacklist.includes(d.id));
                }
            } catch (e) {}
        }

        if (targetAiDeck) {
            const docName = String(targetAiDeck.name || targetAiDeck.title).replace(/<[^>]+>/g, '');
            document.getElementById('headerTitle').innerText = docName;
            document.getElementById('headerCat').innerText = targetAiDeck.category || '核心业务架构 · 智能合规生成';
            
            const priceStr = `$${targetAiDeck.priceUsd || '19.99'}`;
            document.getElementById('topPriceBtn').innerText = priceStr;
            document.getElementById('mainPriceTxt').innerHTML = `${priceStr} <span class="text-xs font-normal text-slate-400">/ 一次性</span>`;
            
            const aiSlides = targetAiDeck.slides || [];
            if (aiSlides.length > 0) {
                sections.length = 0; 
                aiSlides.forEach((slide, idx) => {
                    const safeContent = String(slide.content || slide.sub || `核心论点正在生成中。此模块为 ${slide.title || '模块'} 的专业解析文档。`).replace(/<[^>]+>/g, '');
                    sections.push({
                        layoutType: slide.layoutType || 'text-block',
                        title: String(slide.title || `模块 ${idx + 1}`).replace(/<[^>]+>/g, ''),
                        content: safeContent
                    });
                });
            }
        }
    }
    
    // 强制挂载兜底防白屏
    setTimeout(() => {
        selectSection(0);
    }, 50);
});
</script>
</body>
</html>
