<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK · Word ATS 合规报告编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- 先加载独立风控中台，再加载收银验证模块 -->
<script src="components/vip-download-guard.js"></script>
<script src="components/zero-auth.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f1f5f9; }
  .bento-card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04), 0 4px 6px -2px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
  .nav-pill { transition: all 0.2s; cursor: pointer; border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-weight: 600; font-size: 0.85rem; padding: 0.6rem 1rem; border-radius: 0.75rem; text-align: left; display: flex; align-items: center; justify-content: space-between; }
  .nav-pill:hover { background: #e2e8f0; color: #0f172a; }
  .nav-pill.active { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 4px 10px -2px rgba(15,23,42,0.3); }
  .a4-paper { max-width: 720px; margin: 0 auto; background: #ffffff; border-radius: 0.5rem; padding: 3.5rem 4rem; box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1), 0 0 1px 1px rgba(0,0,0,0.05); min-height: 600px; }
  .doc-title { font-size: 1.85rem; font-weight: 800; color: #0f172a; margin-bottom: 1.5rem; border-bottom: 3px solid #0f172a; padding-bottom: 0.75rem; letter-spacing: -0.02em; }
  .doc-content { font-size: 1rem; color: #334155; line-height: 2; white-space: pre-wrap; font-family: 'Georgia', serif; }
  .input-field { border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.6rem 0.85rem; font-size: 0.875rem; transition: all 0.2s; background: #f8fafc; color: #0f172a; }
  .input-field:focus { outline: none; border-color: #6366f1; background: #ffffff; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  [contenteditable="true"]:hover { outline: 1px dashed #94a3b8; background: rgba(248,250,252,0.8); cursor: text; }
  [contenteditable="true"]:focus { outline: 2px solid #6366f1; background: #ffffff; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-6">
  
  <!-- 顶部导览 -->
  <header class="bento-card px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-4 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold transition border border-slate-200">
        ← 返回商城
      </a>
      <span class="h-4 w-[1px] bg-slate-200"></span>
      <div>
        <h1 class="font-black text-base text-slate-900 tracking-tight">Word ATS 欧美合规报告编辑器</h1>
        <p class="text-[11px] font-mono text-slate-500">九大核心章节标准架构 · 100% 适配各银行金融合规系统</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs font-mono bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5">
        <span>📑 ATS 标准行高已锁定</span>
      </span>
      <!-- 👑 一键呼叫中央模块 -->
      <button onclick="openCheckoutModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
        立即解锁完整 .DOCX ($9.99)
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- 章节侧边栏 -->
    <aside class="lg:col-span-3 bento-card p-5">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-mono">📑 合规章节目录</h2>
      <nav class="space-y-1.5" id="sectionNav">
        <button class="nav-pill active w-full" data-index="0" onclick="selectSection(0)"><span>1. 封面标题页</span> <span class="text-[10px] opacity-60">Cover</span></button>
        <button class="nav-pill w-full" data-index="1" onclick="selectSection(1)"><span>2. 执行摘要</span> <span class="text-[10px] opacity-60">Summary</span></button>
        <button class="nav-pill w-full" data-index="2" onclick="selectSection(2)"><span>3. 公司背景概况</span> <span class="text-[10px] opacity-60">Profile</span></button>
        <button class="nav-pill w-full" data-index="3" onclick="selectSection(3)"><span>4. 财务合规性</span> <span class="text-[10px] opacity-60">Financial</span></button>
        <button class="nav-pill w-full" data-index="4" onclick="selectSection(4)"><span>5. 数据安全与隐私</span> <span class="text-[10px] opacity-60">GDPR</span></button>
        <button class="nav-pill w-full" data-index="5" onclick="selectSection(5)"><span>6. 雇佣与反歧视</span> <span class="text-[10px] opacity-60">EEO</span></button>
        <button class="nav-pill w-full" data-index="6" onclick="selectSection(6)"><span>7. ESG 环境治理</span> <span class="text-[10px] opacity-60">ESG</span></button>
        <button class="nav-pill w-full" data-index="7" onclick="selectSection(7)"><span>8. 风险评估矩阵</span> <span class="text-[10px] opacity-60">Risk</span></button>
        <button class="nav-pill w-full" data-index="8" onclick="selectSection(8)"><span>9. 结论与下一步</span> <span class="text-[10px] opacity-60">Conclusion</span></button>
      </nav>
    </aside>

    <!-- 中央 A4 真·纸张预览画布 -->
    <main class="lg:col-span-6 bento-card p-8 bg-slate-100/60 overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold text-slate-500">欧美企业级 A4 纸张页面渲染</span>
        <span class="text-[10px] font-mono text-indigo-600 font-bold bg-indigo-50 px-2.5 py-0.5 rounded border border-indigo-200">WYSIWYG PAPER</span>
      </div>
      
      <!-- A4 纸张主体 -->
      <div class="a4-paper" id="previewArea">
        <div class="doc-title" contenteditable="true" id="previewTitle" oninput="syncFromPreviewTitle(this.textContent)">封面标题页</div>
        <div class="doc-content" contenteditable="true" id="previewContent" oninput="syncFromPreviewContent(this.textContent)">APEXWORK 企业合规报告</div>
      </div>
    </main>

    <!-- 右侧内容快速编辑与收银面板 -->
    <aside class="lg:col-span-3 space-y-6">
      <div class="bento-card p-6">
        <h2 class="text-sm font-bold text-slate-900 mb-4">✏️ 章节正文批量精修</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">当前章节名称</label>
            <input type="text" id="sectionTitleInput" class="input-field w-full" oninput="updatePreviewFromForm()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">章节详细正文 (支持分行)</label>
            <textarea id="sectionContentInput" class="input-field w-full h-52 leading-relaxed" oninput="updatePreviewFromForm()"></textarea>
          </div>
        </div>
      </div>

      <!-- 商务结账收银面板 -->
      <div class="p-6 bg-slate-900 rounded-2xl text-white shadow-xl border border-slate-800">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-indigo-400 font-mono uppercase tracking-wider">Commercial License</span>
          <button onclick="ApexAuth.openCheckout({title: 'APEXWORK 欧美 ATS 企业合规报告 (.DOCX)', onSuccess: () => executeDOCXExport()})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-2.5 py-1 rounded-lg font-mono transition">
            🌍 安全收银
          </button>
        </div>
        <h3 class="font-bold text-base mb-1">欧美 ATS 报告原件</h3>
        <p class="text-3xl font-black mb-4 font-mono text-white">$9.99 <span class="text-xs font-normal text-slate-400">/ 一次性</span></p>
        <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <span>⚡ 立即解锁下载原文件 (.DOCX)</span>
        </button>
        <p class="text-[11px] text-slate-400 mt-3 text-center">免注册账号 · 付后极速本地签发证书</p>
      </div>
    </aside>
  </div>
</div>

<script>
const sections = [
  { title: '封面标题页', content: 'APEXWORK 企业合规管理与合规评估年度报告\n\n发布日期：2026 年度\n文档密级：企业机密\n标准：欧美企业通用 ATS 合规准则' },
  { title: '执行摘要', content: '本合规性审查报告涵盖公司在财务报告、数据安全与隐私、雇佣平等、以及 ESG 环境治理等重点核心层面的现有实践及进阶建议。全部准则完全遵从 GAAP、GDPR 及 EEO 条例。' },
  { title: '公司背景概况', content: '公司官方实体名称：APEXWORK Inc.\n法定注册所在地：美国特拉华州 (Delaware)\n现存全职正式员工总数：150\n持续运营与审计年份：2020 - 2026' },
  { title: '财务合规性', content: '所有的财务报告均严格依据 GAAP 基本通用准则制定。年度独立审计均由具备权威资质的会计师事务所按时出具，且报告期内无任何重大违规与审计调整说明。' },
  { title: '数据安全与隐私', content: '我们的产品及架构符合欧洲 GDPR 与美国 CCPA 隐私法规。已构建完整的数据保护影响评估（DPIA）流程，全部用户存储及传输数据均经 Ed25519 或等同算法加密。' },
  { title: '雇佣与反歧视', content: '坚持平等就业机会（EEO）法则，并在公司内部全面施行严格的反 workplace 骚扰与反歧视条例。全员年度线上及线下合规培训覆盖率达到 100%。' },
  { title: 'ESG 环境治理', content: '相关生产及行政园区通过 ISO 14001 环境管理体系评估。2026 年度统计总碳排放强度相较往期同比下降 15%，硬件及废弃物材料回收再利用率达 90% 以上。' },
  { title: '风险评估矩阵', content: '综合识别高风险事项 0 项、常规监测中等风险 4 项、一般低级别改进关注点 11 项。针对已有中等关注事项，均明确分派具体负责人及整改解决期限。' },
  { title: '结论与下一步', content: '公司的综合合规运行状况优异，治理结构稳固。我们建议下一步在海外扩展期内加强第三方供应商及渠道的 ESG 与安全抽检。' }
];
let currentSection = 0;

// 👑 全局通用调用：唤出统一模块收银台，验证通过直接拉起 DOCX 导出
function openCheckoutModal() {
  ApexAuth.openCheckout({
    title: "APEXWORK 欧美 ATS 企业合规报告 (.DOCX)",
    onSuccess: () => executeDOCXExport()
  });
}

function selectSection(index) {
  currentSection = index;
  document.querySelectorAll('.nav-pill').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  document.getElementById('sectionTitleInput').value = sections[index].title;
  document.getElementById('sectionContentInput').value = sections[index].content;
  document.getElementById('previewTitle').textContent = sections[index].title;
  document.getElementById('previewContent').textContent = sections[index].content;
}

function updatePreviewFromForm() {
  const title = document.getElementById('sectionTitleInput').value;
  const content = document.getElementById('sectionContentInput').value;
  document.getElementById('previewTitle').textContent = title;
  document.getElementById('previewContent').textContent = content;
  sections[currentSection].title = title;
  sections[currentSection].content = content;
}

function syncFromPreviewTitle(text) {
  document.getElementById('sectionTitleInput').value = text.trim();
  sections[currentSection].title = text.trim();
}

function syncFromPreviewContent(text) {
  document.getElementById('sectionContentInput').value = text;
  sections[currentSection].content = text;
}

// DOCX 原生压缩与富排版输出
function executeDOCXExport() {
  const zip = new JSZip();
  const doc = zip.folder('word');
  doc.file('document.xml', generateDocumentXML());
  doc.file('_rels/document.xml.rels', generateRelsXML());
  zip.file('[Content_Types].xml', generateContentTypesXML());
  zip.file('_rels/.rels', generateRootRelsXML());
  zip.generateAsync({ type: 'blob' }).then((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'APEXWORK-ATS-Compliance-Report-2026.docx';
    a.click();
    URL.revokeObjectURL(url);
    alert('✅ ATS 企业级格式 Word 文档 (.docx) 下载成功！');
  });
}

function generateDocumentXML() {
  let body = '';
  sections.forEach((sec) => {
    body += `<w:p><w:pPr><w:spacing w:before="280" w:after="160"/><w:rPr><w:b/><w:color w:val="0F172A"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr></w:pPr><w:r><w:rPr><w:b/><w:color w:val="0F172A"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr><w:t>${sec.title}</w:t></w:r></w:p>`;
    const paragraphs = sec.content.split('\n');
    paragraphs.forEach(pText => {
      body += `<w:p><w:pPr><w:spacing w:line="360" w:lineRule="auto" w:after="120"/><w:rPr><w:color w:val="334155"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:pPr><w:r><w:rPr><w:color w:val="334155"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr><w:t>${pText}</w:t></w:r></w:p>`;
    });
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
    <w:body>${body}</w:body>
  </w:document>`;
}

function generateRelsXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  </Relationships>`;
}

function generateContentTypesXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
    <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
    <Default Extension="xml" ContentType="application/xml"/>
    <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  </Types>`;
}

function generateRootRelsXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  </Relationships>`;
}

// 👑 动态拦截并加载 AI 生成的全新 Word 文档结构
window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const deckId = params.get('deck');
    
    if (deckId && deckId.startsWith('AI-')) {
        try {
            const res = await fetch('data/ai-generated-decks.json?_t=' + Date.now());
            if (res.ok) {
                const decks = await res.json();
                const aiDeck = decks.find(d => d.id === deckId);
                
                if (aiDeck) {
                    const docName = aiDeck.name || aiDeck.title;
                    const titleEl = document.querySelector('h1');
                    const catEl = titleEl.nextElementSibling;
                    const priceEl = document.querySelector('.text-3xl.font-black');
                    
                    // 1. 替换页面大标题与分类
                    if (titleEl) titleEl.innerText = docName;
                    if (catEl) catEl.innerText = aiDeck.category || '九大核心章节标准架构 · 智能合规生成';
                    
                    // 2. 替换价格区
                    if (priceEl) priceEl.innerHTML = `$${aiDeck.priceUsd || '9.99'} <span class="text-xs font-normal text-slate-400">/ 一次性</span>`;
                    
                    // 3. 动态重写前两章的文本，把 AI 取的新名字无缝融进去！
                    sections[0].content = `${docName}\n\n发布日期：2026 年度\n文档密级：企业机密\n标准：欧美企业通用合规准则`;
                    sections[1].content = `本文档（${docName}）涵盖公司在相关领域的核心规范、财务报告及数据隐私的实践建议。全部准则完全遵从 GAAP、GDPR 及 EEO 条例。`;
                }
            }
        } catch (e) {
            console.warn("加载 AI 云端文档失败", e);
        }
    }
    
    // 初始化并渲染
    selectSection(0);
});
</script>
</body>
</html>
