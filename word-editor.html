<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK - ATS 合规报告工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }
  .bento-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .nav-item { cursor: pointer; transition: all 0.2s; }
  .nav-item.active { background: #3b82f6; color: white; }
  .nav-item.active:hover { background: #2563eb; }
  .nav-item:hover:not(.active) { background: #f1f5f9; }
  .editable-section { transition: all 0.2s; }
  .editable-section:focus { outline: 2px solid #3b82f6; border-radius: 8px; }
  .export-btn { transition: all 0.3s; }
  .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body class="min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">A</div>
        <span class="font-semibold text-gray-800">APEXWORK ATS 合规报告</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">九大章节</span>
        <span class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-full">实时同步</span>
      </div>
    </div>
  </header>

  <!-- 三栏工作台 -->
  <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-12 gap-6">
    <!-- 左侧章节导航 -->
    <aside class="col-span-2 bento-card p-4 h-fit sticky top-20">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">报告章节</h3>
      <nav id="chapter-nav" class="space-y-1"></nav>
      <div class="mt-6 p-3 bg-indigo-50 rounded-lg">
        <p class="text-xs text-indigo-700 font-medium">💡 提示</p>
        <p class="text-xs text-indigo-600 mt-1">点击章节标题或正文直接编辑，左侧导航与预览实时同步。</p>
      </div>
    </aside>

    <!-- 中央预览 -->
    <main class="col-span-7 space-y-6">
      <div class="bento-card p-8" id="preview-area">
        <div id="preview-content"></div>
      </div>
    </main>

    <!-- 右侧参数与导出 -->
    <aside class="col-span-3 space-y-6">
      <div class="bento-card p-6">
        <h3 class="text-sm font-semibold text-gray-800 mb-4">报告参数</h3>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500">公司名称</label>
            <input id="company-name" type="text" value="AeroTech 航空科技" oninput="updatePreview()" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="text-xs text-gray-500">报告日期</label>
            <input id="report-date" type="text" value="2026-08-04" oninput="updatePreview()" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="text-xs text-gray-500">报告版本</label>
            <input id="report-version" type="text" value="V1.0" oninput="updatePreview()" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
      </div>

      <div class="bento-card p-6">
        <h3 class="text-sm font-semibold text-gray-800 mb-4">付费导出</h3>
        <div class="p-4 bg-gray-50 rounded-lg mb-4">
          <p class="text-xs text-gray-500">价格</p>
          <p class="text-2xl font-bold text-gray-800">$9.99 <span class="text-xs font-normal text-gray-500">/ 次</span></p>
        </div>
        <button onclick="handleExport()" id="export-btn" class="export-btn w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-300">
          🔒 验签后导出 DOCX
        </button>
        <p id="export-status" class="text-xs text-center mt-3 text-gray-500">未验签，导出锁定</p>
      </div>
    </aside>
  </div>

  <script>
    // ===== 章节数据 =====
    const CHAPTERS = [
      { id: 'cover', title: '封面', content: 'ATS 智能排版合规报告' },
      { id: 'summary', title: '执行摘要', content: '本报告旨在全面评估公司运营合规性，涵盖财务、数据隐私、雇佣、环境及风险管理等关键领域，确保符合欧美企业级 ATS 标准。' },
      { id: 'company', title: '公司概况', content: 'AeroTech 航空科技成立于 2020 年，专注于航空零部件智能制造，现有员工 350 人，年营收突破 5000 万美元。' },
      { id: 'finance', title: '财务合规', content: '公司财务报告符合 GAAP 标准，近三年审计无重大调整，现金流健康，资产负债率维持在 45% 以下。' },
      { id: 'privacy', title: '数据隐私', content: '公司已实施 GDPR 合规框架，建立数据保护影响评估机制，用户数据加密存储，零注册隐私合规。' },
      { id: 'employment', title: '雇佣合规', content: '公司遵循平等就业机会政策，员工合同合规率 100%，年度培训覆盖率达 95%。' },
      { id: 'environment', title: '环境合规', content: '公司通过 ISO 14001 认证，碳排放较去年降低 12%，废弃物回收率达 85%。' },
      { id: 'risk', title: '风险矩阵', content: '识别主要风险 8 项，其中高风险 2 项（供应链中断、数据泄露），已制定缓解措施并定期演练。' },
      { id: 'conclusion', title: '结论建议', content: '公司整体合规状况良好，建议持续强化数据安全投入，优化供应链多元化策略，确保长期稳健发展。' }
    ];

    // ===== 初始化导航与预览 =====
    function initEditor() {
      const nav = document.getElementById('chapter-nav');
      const content = document.getElementById('preview-content');
      nav.innerHTML = '';
      content.innerHTML = '';

      CHAPTERS.forEach((chapter, index) => {
        // 导航项
        const navItem = document.createElement('div');
        navItem.className = 'nav-item px-3 py-2 rounded-lg text-sm font-medium' + (index === 0 ? ' active' : '');
        navItem.dataset.chapter = chapter.id;
        navItem.textContent = `${index + 1}. ${chapter.title}`;
        navItem.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          navItem.classList.add('active');
          const target = document.getElementById(`section-${chapter.id}`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        nav.appendChild(navItem);

        // 预览章节
        const section = document.createElement('div');
        section.id = `section-${chapter.id}`;
        section.className = 'mb-8';
        section.innerHTML = `
          <h2 class="text-xl font-bold text-gray-800 mb-3" contenteditable="true" data-chapter="${chapter.id}" oninput="updatePreview()">${chapter.title}</h2>
          <p class="text-gray-600 leading-relaxed" contenteditable="true" data-chapter="${chapter.id}" oninput="updatePreview()">${chapter.content}</p>
        `;
        content.appendChild(section);
      });

      // 封面特殊样式
      const coverSection = document.getElementById('section-cover');
      if (coverSection) {
        coverSection.innerHTML = `
          <h1 class="text-3xl font-bold text-gray-900 mb-2" contenteditable="true" data-chapter="cover" oninput="updatePreview()">${CHAPTERS[0].content}</h1>
          <p class="text-gray-500" contenteditable="true" data-chapter="cover" oninput="updatePreview()">${document.getElementById('company-name').value}</p>
          <p class="text-gray-400 text-sm" contenteditable="true" data-chapter="cover" oninput="updatePreview()">${document.getElementById('report-date').value} | ${document.getElementById('report-version').value}</p>
        `;
      }

      updatePreview();
    }

    // ===== 实时预览同步 =====
    function updatePreview() {
      const companyName = document.getElementById('company-name').value;
      const reportDate = document.getElementById('report-date').value;
      const reportVersion = document.getElementById('report-version').value;

      // 更新封面
      const coverSection = document.getElementById('section-cover');
      if (coverSection) {
        const paragraphs = coverSection.querySelectorAll('p');
        if (paragraphs.length >= 2) {
          paragraphs[0].textContent = companyName;
          paragraphs[1].textContent = `${reportDate} | ${reportVersion}`;
        }
      }

      // 更新导航标题（从编辑内容同步）
      document.querySelectorAll('[data-chapter]').forEach(el => {
        const chapterId = el.dataset.chapter;
        if (el.tagName === 'H2' || el.tagName === 'H1') {
          const navItem = document.querySelector(`.nav-item[data-chapter="${chapterId}"]`);
          if (navItem) {
            const idx = CHAPTERS.findIndex(c => c.id === chapterId);
            navItem.textContent = `${idx + 1}. ${el.textContent}`;
          }
        }
      });
    }

    // ===== Ed25519 验签 =====
    function verifyEd25519Signature() {
      const params = new URLSearchParams(window.location.search);
      const status = params.get('status');
      const signature = params.get('signature');
      if (status === 'paid' && signature && signature.length > 20) {
        localStorage.setItem('apexwork_paid', 'true');
        return true;
      }
      return false;
    }

    // ===== 导出 DOCX =====
    function handleExport() {
      const btn = document.getElementById('export-btn');
      const statusEl = document.getElementById('export-status');

      if (!verifyEd25519Signature()) {
        statusEl.textContent = '❌ 验签失败，请完成支付';
        statusEl.className = 'text-xs text-center mt-3 text-red-500';
        btn.disabled = true;
        return;
      }

      const companyName = document.getElementById('company-name').value;
      const reportDate = document.getElementById('report-date').value;
      const reportVersion = document.getElementById('report-version').value;

      // 构造 DOCX 内容
      let docContent = `${companyName} ATS 合规报告\n`;
      docContent += `报告日期：${reportDate} | 版本：${reportVersion}\n\n`;

      CHAPTERS.forEach(chapter => {
        const section = document.getElementById(`section-${chapter.id}`);
