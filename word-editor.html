<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK · Word ATS 合规报告编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f8fafc; }
  .bento-card { background: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
  .nav-item { transition: all 0.2s; cursor: pointer; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #0f172a; color: #ffffff; }
  .btn-primary { background: #0f172a; color: #ffffff; transition: all 0.2s; }
  .btn-primary:hover { background: #1e293b; transform: translateY(-1px); }
  .input-field { border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,0.1); }
  .section-preview { border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 2rem; min-height: 320px; background: #ffffff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .section-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 1rem; border-bottom: 2px solid #0f172a; padding-bottom: 0.5rem; }
  .section-content { font-size: 0.95rem; color: #334155; line-height: 1.8; white-space: pre-wrap; }
  [contenteditable="true"]:hover { outline: 1px dashed #0f172a; background: rgba(15,23,42,0.02); cursor: text; }
  [contenteditable="true"]:focus { outline: 2px solid #0f172a; background: #ffffff; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto p-4 lg:p-8">
  <header class="flex items-center justify-between mb-8 bg-white border-b border-slate-200 -mx-4 -mt-4 p-4 lg:-mx-8 lg:-mt-8 lg:px-8 shadow-sm">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition border border-slate-300">
        ← 返回商城
      </a>
      <span class="h-4 w-[1px] bg-slate-200"></span>
      <div>
        <h1 class="text-lg font-bold text-slate-900">Word ATS 合规报告编辑器</h1>
        <p class="text-xs text-slate-500">欧美企业级 · 九大章节</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs font-mono bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-bold">
        ATS 智能排版
      </span>
      <button onclick="openCheckoutModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition shadow-md">
        立即解锁 DOCX ($9.99)
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-2 bento-card p-4">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">📑 章节导航</h2>
      <nav class="space-y-1">
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium active" data-section="0" onclick="selectSection(0)">封面</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="1" onclick="selectSection(1)">执行摘要</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="2" onclick="selectSection(2)">公司概况</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="3" onclick="selectSection(3)">财务合规</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="4" onclick="selectSection(4)">数据隐私</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="5" onclick="selectSection(5)">雇佣合规</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="6" onclick="selectSection(6)">环境合规</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="7" onclick="selectSection(7)">风险矩阵</button>
        <button class="nav-item w-full text-left px-3 py-2 rounded-lg text-sm font-medium" data-section="8" onclick="selectSection(8)">结论建议</button>
      </nav>
    </aside>

    <main class="lg:col-span-7 bento-card p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-900">实时预览</h2>
        <span class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-full font-bold">WYSIWYG 激活</span>
      </div>
      <div class="section-preview" id="previewArea">
        <div class="section-title" contenteditable="true" id="previewTitle" oninput="syncFromPreviewTitle(this.textContent)">封面</div>
        <div class="section-content" contenteditable="true" id="previewContent" oninput="syncFromPreviewContent(this.textContent)">公司名称</div>
      </div>
    </main>

    <aside class="lg:col-span-3 bento-card p-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">内容编辑</h2>
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">章节标题</label>
          <input type="text" id="sectionTitle" class="input-field w-full" value="封面" oninput="updatePreviewFromForm()">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">章节内容</label>
          <textarea id="sectionContent" class="input-field w-full h-48" oninput="updatePreviewFromForm()">公司名称</textarea>
        </div>
      </div>

      <div class="p-4 bg-slate-900 rounded-xl text-white shadow-lg">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-semibold text-sm">付费导出</h3>
            <button onclick="togglePayRegion()" id="regionSwitchBtn" class="text-[10px] bg-slate-800 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded font-mono hover:bg-slate-700 transition">
                检测地区...
            </button>
        </div>
        <p class="text-xs text-slate-300 mb-2" id="payDesc">智能匹配支付通道</p>
        <p class="text-2xl font-bold mb-3" id="payPrice">$9.99 <span class="text-xs font-normal text-slate-400">/ 一次性</span></p>
        <button onclick="openCheckoutModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-xs transition shadow-md flex items-center justify-center gap-1">
            <span>立即解锁完整文件</span>
        </button>
        <div class="text-[10px] text-slate-400 mt-2 text-center font-mono" id="payTip">免注册账号 · 支持扫码与 Apple Pay</div>
      </div>
    </aside>
  </div>
</div>

<!-- 👑 V30 极速核单免注册直付弹窗 -->
<div id="checkoutModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-slate-900">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span class="font-bold text-base">极速付款与核对订单</span>
            </div>
            <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
        </div>

        <div class="space-y-3 mb-6 text-sm">
            <div class="flex justify-between py-1 border-b border-slate-100">
                <span class="text-slate-500">授权作品</span>
                <span class="font-semibold text-slate-800">APEXWORK Word ATS 企业合规报告</span>
            </div>
            <div class="flex justify-between py-1 border-b border-slate-100">
                <span class="text-slate-500">应付总额</span>
                <span class="font-black text-lg text-blue-600" id="modalPriceText">￥69.00</span>
            </div>
            <div class="flex justify-between py-1 border-b border-slate-100">
                <span class="text-slate-500">支付渠道</span>
                <span class="font-semibold text-slate-800" id="modalChannelText">微信支付 / 支付宝 扫码直付</span>
            </div>
            <div class="flex justify-between py-1">
                <span class="text-slate-500">购买流程</span>
                <span class="text-emerald-600 font-bold text-xs bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                    ✅ 免账号注册 · 付款即锁存解锁
                </span>
            </div>
        </div>

        <button onclick="handleSmartExport()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-500/20">
            确认信息无误，立即直达付款 →
        </button>
        <p class="text-[11px] text-slate-400 text-center mt-3">提示：付款页面无需输入手机号注册，扫码后极速搞定</p>
    </div>
</div>

<script>
const sections = [
  { title: '封面', content: 'APEXWORK 企业合规报告\n2026 年度\n版本 1.0' },
  { title: '执行摘要', content: '本报告概述公司在财务、数据隐私、雇佣、环境四大维度的合规现状与改进建议。' },
  { title: '公司概况', content: '公司名称：APEXWORK Inc.\n注册地：美国特拉华州\n员工数：150\n成立年份：2020' },
  { title: '财务合规', content: '遵循 GAAP 标准，年度审计由四大会计师事务所执行，无重大调整事项。' },
  { title: '数据隐私', content: '符合 GDPR 与 CCPA 要求，建立数据保护影响评估（DPIA）流程，用户数据加密存储。' },
  { title: '雇佣合规', content: '遵循平等就业机会（EEO）法规，制定反骚扰政策，年度合规培训覆盖率 100%。' },
  { title: '环境合规', content: '通过 ISO 14001 认证，碳排放较去年减少 15%，废弃物回收率达 90%。' },
  { title: '风险矩阵', content: '识别 5 项高风险、8 项中风险、12 项低风险，已制定对应缓解措施。' },
  { title: '结论建议', content: '整体合规水平良好，建议加强供应链 ESG 审查，并引入第三方合规审计。' }
];
let currentSection = 0;

const PAY_CONFIG = {
    china: {
        name: "国内安全支付",
        price: "￥69 / 次",
        modalPrice: "￥69.00 RMB",
        modalChannel: "微信 / 支付宝 极速扫码",
        url: "https://mbd.pub/o/bread/YZaUmJlpbQ==",
        tip: "通过面包多安全支付，支持微信与支付宝"
    },
    overseas: {
        name: "海外快捷支付",
        price: "$9.99 / 次",
        modalPrice: "$9.99 USD",
        modalChannel: "Apple Pay / 信用卡 极速直付",
        url: "https://mbd.pub/o/bread/YZaUmJlpbQ==",
        tip: "无需注册，支持主流信用卡及 Apple Pay"
    }
};
let currentRegion = 'overseas';

async function detectUserRegion() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data.country_code === 'CN') {
            currentRegion = 'china';
        } else {
            currentRegion = 'overseas';
        }
    } catch (e) {
        currentRegion = 'overseas';
    }
    updatePayUI();
}

function updatePayUI() {
    const config = PAY_CONFIG[currentRegion];
    document.getElementById('payPrice').innerHTML = config.price;
    document.getElementById('payDesc').textContent = config.name;
    document.getElementById('payTip').textContent = config.tip;
    document.getElementById('regionSwitchBtn').textContent = currentRegion === 'china' ? '🇨🇳 国内版 (点此切换海外)' : '🌍 海外版 (点此切换国内)';
    document.getElementById('modalPriceText').textContent = config.modalPrice;
    document.getElementById('modalChannelText').textContent = config.modalChannel;
}

function togglePayRegion() {
    currentRegion = currentRegion === 'china' ? 'overseas' : 'china';
    updatePayUI();
}

function openCheckoutModal() {
    document.getElementById('checkoutModal').classList.remove('hidden');
}

function closeCheckoutModal() {
    document.getElementById('checkoutModal').classList.add('hidden');
}

function handleSmartExport() {
    window.location.href = PAY_CONFIG[currentRegion].url;
}

function selectSection(index) {
  currentSection = index;
  document.querySelectorAll('.nav-item').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  document.getElementById('sectionTitle').value = sections[index].title;
  document.getElementById('sectionContent').value = sections[index].content;
  document.getElementById('previewTitle').textContent = sections[index].title;
  document.getElementById('previewContent').textContent = sections[index].content;
}

function updatePreviewFromForm() {
  const title = document.getElementById('sectionTitle').value;
  const content = document.getElementById('sectionContent').value;
  document.getElementById('previewTitle').textContent = title;
  document.getElementById('previewContent').textContent = content;
  sections[currentSection].title = title;
  sections[currentSection].content = content;
}

function syncFromPreviewTitle(text) {
  const clean = text.trim();
  document.getElementById('sectionTitle').value = clean;
  sections[currentSection].title = clean;
}

function syncFromPreviewContent(text) {
  const clean = text;
  document.getElementById('sectionContent').value = clean;
  sections[currentSection].content = clean;
}

function handleExport() {
  exportDOCX();
}

function exportDOCX() {
  const zip = new JSZip();
  const doc = zip.folder('word');
  doc.file('document.xml', generateDocumentXML());
  doc.file('_rels/document.xml.rels', generateRelsXML());
  zip.file('[Content_Types].xml', generateContentTypesXML());
  zip.file('_rels/.rels', generateRootRelsXML());
  zip.generateAsync({ type: 'blob' }).then((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'APEXWORK-ATS-Compliance-Report.docx';
    a.click();
    URL.revokeObjectURL(url);
    alert('DOCX 已生成！');
  });
}

function generateDocumentXML() {
  let body = '';
  sections.forEach((sec, index) => {
    body += `<w:p><w:pPr><w:spacing w:before="240" w:after="120"/><w:rPr><w:b/><w:color w:val="1E293B"/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr></w:pPr><w:r><w:rPr><w:b/><w:color w:val="1E293B"/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr><w:t>${sec.title}</w:t></w:r></w:p>`;
    const paragraphs = sec.content.split('\n');
    paragraphs.forEach(pText => {
      body += `<w:p><w:pPr><w:spacing w:line="312" w:lineRule="auto" w:after="100"/><w:rPr><w:color w:val="334155"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:pPr><w:r><w:rPr><w:color w:val="334155"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr><w:t>${pText}</w:t></w:r></w:p>`;
    });
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
    <w:body>${body}</w:body>
  </w:document>`;
}

function generateRelsXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  </Relationships>`;
}

function generateContentTypesXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
    <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
    <Default Extension="xml" ContentType="application/xml"/>
    <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  </Types>`;
}

function generateRootRelsXML() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
  <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  </Relationships>`;
}

selectSection(0);
detectUserRegion();
</script>
</body>
</html>
