<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK · Excel 财务模型编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="components/vip-download-guard.js"></script>
<script src="components/zero-auth.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f1f5f9; }
  .bento-card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04), 0 4px 6px -2px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
  .nav-pill { transition: all 0.2s; cursor: pointer; border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-weight: 600; font-size: 0.8rem; padding: 0.5rem 0.75rem; border-radius: 0.75rem; text-align: center; }
  .nav-pill:hover { background: #e2e8f0; color: #0f172a; }
  .nav-pill.active { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 4px 10px -2px rgba(15,23,42,0.3); }
  .kpi-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1rem; transition: all 0.2s; }
  .kpi-card:hover { border-color: #cbd5e1; transform: translateY(-2px); }
  .input-field { border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.6rem 0.85rem; font-size: 0.875rem; transition: all 0.2s; background: #f8fafc; color: #0f172a; font-family: monospace; }
  .input-field:focus { outline: none; border-color: #10b981; background: #ffffff; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
  .table-cell { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: right; font-size: 0.875rem; font-family: monospace; }
  .table-header { background: #f8fafc; font-weight: 700; text-align: center; color: #334155; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .editable-cell { background: rgba(16, 185, 129, 0.08); color: #047857; font-weight: 700; cursor: text; transition: all 0.2s; }
  .editable-cell:hover { background: rgba(16, 185, 129, 0.18); outline: 1px dashed #10b981; }
  .editable-cell:focus { outline: 2px solid #10b981; background: #ffffff; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-6">
  
  <header class="bento-card px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-4 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold transition border border-slate-200">
        ← 返回商城
      </a>
      <span class="h-4 w-[1px] bg-slate-200"></span>
      <div>
        <h1 class="font-black text-base text-slate-900 tracking-tight" id="headerTitle">Excel 财务测算模型编辑器</h1>
        <p class="text-[11px] font-mono text-slate-500" id="headerCat">多维动态收支与测算矩阵</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs font-mono text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        实时动态测算中
      </span>
      <button onclick="openCheckoutModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/20">
        立即解锁完整 .XLSX (<span id="topPriceBtn">$9.99</span>)
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-2 bento-card p-5">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-mono">📅 模块控制台</h2>
      <!-- 👑 修复侧边栏消失问题：确保无论是 AI 还是默认模式，都能正确生成列表 -->
      <div class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-1 gap-2" id="monthNavContainer">
        <!-- JS 动态填入 -->
      </div>
    </aside>

    <main class="lg:col-span-7 bento-card p-6 flex flex-col justify-between">
      <div id="dynamicMainArea">
        <!-- 👑 核心矩阵渲染区 -->
      </div>

      <div class="mt-8 pt-6 border-t border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-mono">📊 商业决策 KPI 卡片矩阵</h3>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="kpi-card border-l-4 border-l-emerald-500">
            <p class="text-xs text-slate-500 font-medium">毛利率 (Gross)</p>
            <p class="text-2xl font-black text-slate-900 font-mono mt-1" id="kpiGrossMargin">--</p>
          </div>
          <div class="kpi-card border-l-4 border-l-blue-500">
            <p class="text-xs text-slate-500 font-medium">净利率 (Net)</p>
            <p class="text-2xl font-black text-slate-900 font-mono mt-1" id="kpiNetMargin">--</p>
          </div>
          <div class="kpi-card border-l-4 border-l-indigo-500">
            <p class="text-xs text-slate-500 font-medium" id="roiTitle">创投 ROI</p>
            <p class="text-2xl font-black text-slate-900 font-mono mt-1" id="kpiROI">--</p>
          </div>
          <div class="kpi-card border-l-4 border-l-amber-500">
            <p class="text-xs text-slate-500 font-medium">回本周期</p>
            <p class="text-2xl font-black text-slate-900 font-mono mt-1" id="kpiPayback">--</p>
          </div>
        </div>
      </div>
    </main>

    <aside class="lg:col-span-3 space-y-6">
      <div class="bento-card p-6">
        <h2 class="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>⚙️ 全局宏观预测参数</span>
        </h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">初始投资资金 ($)</label>
            <input type="number" id="initialInvestment" class="input-field w-full" value="50000" oninput="updateROI()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">每月环比增长 (%)</label>
            <input type="number" id="growthRate" class="input-field w-full" value="5" oninput="updateROI()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">固定运营成本 ($/月)</label>
            <input type="number" id="fixedCost" class="input-field w-full" value="8000" oninput="updateROI()">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">可变业务成本比例 (%)</label>
            <input type="number" id="variableCostRate" class="input-field w-full" value="40" oninput="updateROI()">
          </div>
        </div>
      </div>

      <div class="p-6 bg-slate-900 rounded-2xl text-white shadow-xl border border-slate-800">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-emerald-400 font-mono uppercase tracking-wider">Commercial License</span>
          <button onclick="ApexAuth.openCheckout({title: 'APEXWORK Excel财务模型 (.XLSX)', onSuccess: () => executeXLSXExport()})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-2.5 py-1 rounded-lg font-mono transition">
            🌍 安全收银
          </button>
        </div>
        <h3 class="font-bold text-base mb-1">欧美标准商业建模表</h3>
        <p class="text-3xl font-black mb-4 font-mono text-white" id="mainPriceTxt">$9.99 <span class="text-xs font-normal text-slate-400">/ 一次性</span></p>
        <button onclick="openCheckoutModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
          <span>⚡ 立即解锁下载原表 (.XLSX)</span>
        </button>
      </div>
    </aside>
  </div>
</div>

<script>
const months = ['01月','02月','03月','04月','05月','06月','07月','08月','09月','10月','11月','12月'];
let currentMonth = 0;
let financeData = [];
let manualOverrides = { q1Rev: null, q1Cost: null, yearRev: null, yearCost: null };
let isAiMode = false;
let sheetsData = [];

// 默认兜底结构
let rowRevName = '营业总收入 (Revenue)';
let rowCostName = '成本与支出 (Costs)';

function openCheckoutModal() {
  ApexAuth.openCheckout({ title: "APEXWORK Excel模型 (.XLSX)", onSuccess: () => executeXLSXExport() });
}

function initFinanceData() {
  financeData = [];
  const baseRevenue = 12000;
  for (let i = 0; i < 12; i++) {
    const rev = baseRevenue * Math.pow(1.05, i);
    const cst = 8000 + rev * 0.4;
    financeData.push({ revenue: rev, cost: cst, profit: rev - cst });
  }
}

function updateROI() {
  const growth = parseFloat(document.getElementById('growthRate').value) || 0;
  const fixed = parseFloat(document.getElementById('fixedCost').value) || 0;
  const varRate = parseFloat(document.getElementById('variableCostRate').value) || 0;

  for (let i = 0; i < 12; i++) {
    const revenue = 12000 * Math.pow(1 + growth/100, i);
    const cost = fixed + revenue * varRate/100;
    financeData[i] = { revenue, cost, profit: revenue - cost };
  }
  manualOverrides = { q1Rev: null, q1Cost: null, yearRev: null, yearCost: null };
  recomputeKPIsAndRender();
}

function updateCellFromTable(field, scope, rawText) {
  const val = parseFloat(rawText.replace(/[^0-9.-]/g, "")) || 0;
  if (scope === 'month') {
    const cur = financeData[currentMonth];
    if (field === 'revenue') cur.revenue = val;
    if (field === 'cost') cur.cost = val;
    cur.profit = cur.revenue - cur.cost;
  } else if (scope === 'q1') {
    if (field === 'revenue') manualOverrides.q1Rev = val;
    if (field === 'cost') manualOverrides.q1Cost = val;
  } else if (scope === 'year') {
    if (field === 'revenue') manualOverrides.yearRev = val;
    if (field === 'cost') manualOverrides.yearCost = val;
  }
  recomputeKPIsAndRender(false);
}

function recomputeKPIsAndRender(rebuildDom = true) {
  let totalRevenue = 0, totalCost = 0;
  financeData.forEach(m => { totalRevenue += m.revenue; totalCost += m.cost; });

  const yearRev = manualOverrides.yearRev !== null ? manualOverrides.yearRev : totalRevenue;
  const yearCost = manualOverrides.yearCost !== null ? manualOverrides.yearCost : totalCost;
  const totalProfit = yearRev - yearCost;

  const investment = parseFloat(document.getElementById('initialInvestment').value) || 50000;
  const grossMargin = yearRev > 0 ? ((yearRev - yearCost) / yearRev * 100) : 0;
  const netMargin = yearRev > 0 ? (totalProfit / yearRev * 100) : 0;
  const roi = investment > 0 ? (totalProfit / investment * 100) : 0;
  const payback = totalProfit > 0 ? (investment / (totalProfit / 12)) : 99;

  document.getElementById('kpiGrossMargin').textContent = grossMargin.toFixed(1) + '%';
  document.getElementById('kpiNetMargin').textContent = netMargin.toFixed(1) + '%';
  document.getElementById('kpiROI').textContent = roi.toFixed(1) + '%';
  document.getElementById('kpiPayback').textContent = payback.toFixed(1) + ' 月';

  renderDynamicMainArea(rebuildDom);
}

function renderDynamicMainArea(rebuildHtml = true) {
  const mainArea = document.getElementById('dynamicMainArea');
  let currentSheet = isAiMode && sheetsData[currentMonth] ? sheetsData[currentMonth] : { title: `12个月动态测算表`, layoutType: 'matrix-12m' };
  const layout = currentSheet.layoutType || 'matrix-12m';

  const current = financeData[currentMonth] || financeData[0];
  const calcQ1Rev = financeData.slice(0,3).reduce((s,m) => s + m.revenue, 0);
  const calcQ1Cost = financeData.slice(0,3).reduce((s,m) => s + m.cost, 0);
  const q1Rev = manualOverrides.q1Rev !== null ? manualOverrides.q1Rev : calcQ1Rev;
  const q1Cost = manualOverrides.q1Cost !== null ? manualOverrides.q1Cost : calcQ1Cost;
  const q1Profit = q1Rev - q1Cost;
  
  const calcYearRev = financeData.reduce((s,m) => s + m.revenue, 0);
  const calcYearCost = financeData.reduce((s,m) => s + m.cost, 0);
  const yearRev = manualOverrides.yearRev !== null ? manualOverrides.yearRev : calcYearRev;
  const yearCost = manualOverrides.yearCost !== null ? manualOverrides.yearCost : calcYearCost;
  const yearProfit = yearRev - yearCost;

  let htmlContent = '';

  if (layout === 'roi-calc') {
      htmlContent = `
        <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
          <div>
            <h2 class="text-base font-bold text-slate-900">${currentSheet.title || 'ROI 回报测算模型'}</h2>
            <p class="text-xs text-slate-500">动态计算前期投入与后期产出的边际效益</p>
          </div>
          <span class="text-[10px] bg-slate-900 text-white font-mono px-2.5 py-1 rounded-lg font-bold">ROI CALCULATOR</span>
        </div>
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-6 mb-4 flex items-center justify-between">
            <div>
                <div class="text-sm font-bold text-indigo-800 mb-1">预计总净利润</div>
                <div class="text-3xl font-black font-mono text-indigo-600">$${yearProfit.toLocaleString('en-US', {maximumFractionDigits: 0})}</div>
            </div>
            <div class="text-right">
                <div class="text-sm font-bold text-slate-600 mb-1">投资回报率 (ROI)</div>
                <div class="text-3xl font-black font-mono text-emerald-500">${((yearProfit / (parseFloat(document.getElementById('initialInvestment').value) || 50000)) * 100).toFixed(1)}%</div>
            </div>
        </div>
      `;
  } else if (layout === 'funnel' || layout === 'cost-breakdown') {
      htmlContent = `
        <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
          <div>
            <h2 class="text-base font-bold text-slate-900">${currentSheet.title || '核心转化率数据板'}</h2>
            <p class="text-xs text-slate-500">多维度数据漏斗与流失率侦测</p>
          </div>
          <span class="text-[10px] bg-slate-900 text-white font-mono px-2.5 py-1 rounded-lg font-bold">FUNNEL VIZ</span>
        </div>
        <div class="space-y-4">
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="w-12 text-center font-bold text-slate-400">顶部</div>
                <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden"><div class="bg-blue-500 h-full w-full"></div></div>
                <div class="w-24 text-right font-mono font-bold">$${yearRev.toLocaleString('en-US', {maximumFractionDigits: 0})}</div>
            </div>
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="w-12 text-center font-bold text-slate-400">中部</div>
                <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden"><div class="bg-amber-500 h-full w-3/4"></div></div>
                <div class="w-24 text-right font-mono font-bold">$${(yearRev*0.75).toLocaleString('en-US', {maximumFractionDigits: 0})}</div>
            </div>
            <div class="flex items-center gap-4 bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                <div class="w-12 text-center font-bold text-emerald-600">转化</div>
                <div class="flex-1 h-3 bg-slate-200 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${(yearProfit/yearRev*100).toFixed(0)}%"></div></div>
                <div class="w-24 text-right font-mono font-bold text-emerald-600">$${yearProfit.toLocaleString('en-US', {maximumFractionDigits: 0})}</div>
            </div>
        </div>
      `;
  } else {
      htmlContent = `
        <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
          <div>
            <h2 class="text-base font-bold text-slate-900" id="matrixTitle">${currentSheet.title || '12 个月动态收支矩阵'}</h2>
            <p class="text-xs text-slate-500">绿色高亮单元格可直接输入数字更改，表头与全年汇总将秒级自算</p>
          </div>
          <span class="text-[10px] bg-slate-900 text-white font-mono px-2.5 py-1 rounded-lg font-bold">WYSIWYG MATRIX</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full text-sm" id="financeTable">
            <thead>
              <tr>
                <th class="table-header py-3">核心项目</th>
                <th class="table-header py-3 text-emerald-600" id="thMonth">${isAiMode ? '模块核心数据' : months[currentMonth] + ' (当前)'}</th>
                <th class="table-header py-3">Q1 季度汇总</th>
                <th class="table-header py-3">全年总计</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td class="table-cell font-bold text-left bg-slate-50">${rowRevName}</td>
                <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('revenue', 'month', this.textContent)">$${current.revenue.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('revenue', 'q1', this.textContent)">$${q1Rev.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell editable-cell font-bold" contenteditable="true" onblur="updateCellFromTable('revenue', 'year', this.textContent)">$${yearRev.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
              </tr>
              <tr>
                <td class="table-cell font-bold text-left bg-slate-50">${rowCostName}</td>
                <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('cost', 'month', this.textContent)">$${current.cost.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('cost', 'q1', this.textContent)">$${q1Cost.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell editable-cell font-bold" contenteditable="true" onblur="updateCellFromTable('cost', 'year', this.textContent)">$${yearCost.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
              </tr>
              <tr class="bg-slate-50/80">
                <td class="table-cell font-black text-left text-slate-900">净利润 (Net Profit)</td>
                <td class="table-cell font-black text-slate-900" id="cellCurProfit">$${current.profit.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell font-black text-slate-900" id="cellQ1Profit">$${q1Profit.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
                <td class="table-cell font-black text-emerald-600" id="cellYearProfit">$${yearProfit.toLocaleString('en-US', {maximumFractionDigits: 0})}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
  }

  if (rebuildHtml) {
      mainArea.innerHTML = htmlContent;
  } else if (layout === 'matrix-12m' || layout === 'default') {
      const eCur = document.getElementById('cellCurProfit');
      if(eCur) eCur.textContent = '$' + current.profit.toLocaleString('en-US', {maximumFractionDigits: 0});
      const eQ1 = document.getElementById('cellQ1Profit');
      if(eQ1) eQ1.textContent = '$' + q1Profit.toLocaleString('en-US', {maximumFractionDigits: 0});
      const eYr = document.getElementById('cellYearProfit');
      if(eYr) eYr.textContent = '$' + yearProfit.toLocaleString('en-US', {maximumFractionDigits: 0});
  }
}

function selectMonth(index) {
  currentMonth = index;
  document.querySelectorAll('.nav-pill').forEach((btn, i) => { btn.classList.toggle('active', i === index); });
  recomputeKPIsAndRender(true);
}

function executeXLSXExport() {
  const wb = XLSX.utils.book_new();
  
  if (isAiMode && sheetsData.length > 0) {
      sheetsData.forEach((sheet, i) => {
          let data = [];
          if (sheet.layoutType === 'roi-calc' || sheet.layoutType === 'funnel') {
              data = [[sheet.title], ['关键指标', '数值'], [sheet.label || '核心产出', sheet.kpi || '100%']];
          } else {
              data = [['预测阶段', rowRevName, rowCostName, '净利润 ($)'], ['Module Data', '12000', '8000', '4000']];
          }
          const ws = XLSX.utils.aoa_to_sheet(data);
          ws['!cols'] = [{ wch: 20 }, { wch: 25 }, { wch: 25 }];
          let sheetName = (sheet.title || `模块 ${i+1}`).substring(0, 30).replace(/[\\/?*\[\]]/g, '');
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });
  } else {
      const data = [['预测月份', rowRevName, rowCostName, '净利润 ($)']];
      financeData.forEach((m, i) => {
        data.push([`${i+1}月`, m.revenue.toFixed(2), m.cost.toFixed(2), m.profit.toFixed(2)]);
      });
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws['!cols'] = [{ wch: 15 }, { wch: 25 }, { wch: 25 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, ws, '智能动态财测模型');
  }

  XLSX.writeFile(wb, `APEXWORK-Financial-Model-${Date.now()}.xlsx`);
  alert('✅ 完整带排版的 Excel 建模表下载成功！');
}

window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const deckId = params.get('deck');
    const navContainer = document.getElementById('monthNavContainer');
    
    if (deckId && deckId.startsWith('AI-')) {
        isAiMode = true;
        let targetAiDeck = null;
        try {
            const localDecks = JSON.parse(localStorage.getItem('APEX_AUDIT_PRODUCTS') || '[]');
            targetAiDeck = localDecks.find(d => d.id === deckId);
        } catch(e) {}

        if (!targetAiDeck) {
            try {
                const res = await fetch(`data/ai-generated-decks.json?_t=${Date.now()}`);
                if (res.ok) {
                    const decks = await res.json();
                    targetAiDeck = decks.find(d => d.id === deckId);
                }
            } catch (e) {}
        }

        if (targetAiDeck) {
            const docName = targetAiDeck.name || targetAiDeck.title;
            document.getElementById('headerTitle').innerText = docName;
            document.getElementById('headerCat').innerText = targetAiDeck.category || '核心业务架构 · 智能合规生成';
            
            const priceStr = `$${targetAiDeck.priceUsd || '19.99'}`;
            document.getElementById('topPriceBtn').innerText = priceStr;
            document.getElementById('mainPriceTxt').innerHTML = `${priceStr} <span class="text-xs font-normal text-slate-400">/ 一次性</span>`;
            
            sheetsData = targetAiDeck.slides || [];
            if (sheetsData.length > 0) {
                navContainer.innerHTML = '';
                sheetsData.forEach((sheet, idx) => {
                    navContainer.innerHTML += `<button class="nav-pill ${idx === 0 ? 'active' : ''}" onclick="selectMonth(${idx})">${sheet.title || `模块 ${idx+1}`}</button>`;
                });
                
                if (sheetsData.length >= 2) {
                    rowRevName = sheetsData[0].title || '核心主营收入';
                    rowCostName = sheetsData[1].title || '刚性支出与损耗';
                    document.getElementById('roiTitle').innerText = sheetsData[0].label || '投资回报率';
                }
            }

            document.getElementById('initialInvestment').value = 50000 + Math.floor(Math.random() * 80000);
            document.getElementById('growthRate').value = 3 + Math.floor(Math.random() * 12);
        }
    } else {
        // 👑 修复：如果不是 AI 模式，绝对渲染你原原本本的 12 个月侧边栏！
        navContainer.innerHTML = '';
        months.forEach((m, idx) => {
            navContainer.innerHTML += `<button class="nav-pill ${idx === 0 ? 'active' : ''}" onclick="selectMonth(${idx})">${m}预测</button>`;
        });
    }
    
    initFinanceData();
    updateROI(); 
    recomputeKPIsAndRender(true);
});
</script>
</body>
</html>
