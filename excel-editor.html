<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK · Excel 财务模型编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f8fafc; }
  .bento-card { background: #ffffff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
  .nav-item { transition: all 0.2s; cursor: pointer; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #0f172a; color: #ffffff; }
  .kpi-card { border-left: 4px solid #0f172a; }
  .btn-primary { background: #0f172a; color: #ffffff; transition: all 0.2s; }
  .btn-primary:hover { background: #1e293b; transform: translateY(-1px); }
  .input-field { border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,0.1); }
  .table-cell { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: right; font-size: 0.875rem; }
  .table-header { background: #f8fafc; font-weight: 600; text-align: center; }
  .month-nav { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
  .month-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; white-space: nowrap; }
  .editable-cell { background: rgba(16, 185, 129, 0.06); color: #047857; font-weight: 700; cursor: text; transition: background 0.2s; }
  .editable-cell:hover { background: rgba(16, 185, 129, 0.15); outline: 1px dashed #10b981; }
  .editable-cell:focus { outline: 2px solid #10b981; background: #ffffff; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto p-4 lg:p-8">
  <header class="flex justify-between items-center bg-white border-b border-slate-200 px-6 py-3 shadow-sm sticky top-0 z-50 mb-6 -mx-4 -mt-4 lg:-mx-8 lg:-mt-8">
      <div class="flex items-center gap-3">
          <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition border border-slate-300">
              ← 返回商城
          </a>
          <span class="h-4 w-[1px] bg-slate-200"></span>
          <div>
              <h1 class="font-bold text-sm text-slate-800">Excel 财务模型编辑器</h1>
              <p class="text-[10px] font-mono text-slate-400">12 个月滚动预测</p>
          </div>
      </div>
      <div class="flex items-center gap-3">
          <span class="text-xs font-mono text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200 font-bold">
              实时计算中
          </span>
          <button onclick="handleExport()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition shadow-md">
              立即导出 .XLSX ($9.99)
          </button>
      </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-2 bento-card p-4">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">月份导航</h2>
      <div class="month-nav lg:flex-col lg:overflow-visible">
        <button class="month-btn nav-item active" data-month="0" onclick="selectMonth(0)">1月</button>
        <button class="month-btn nav-item" data-month="1" onclick="selectMonth(1)">2月</button>
        <button class="month-btn nav-item" data-month="2" onclick="selectMonth(2)">3月</button>
        <button class="month-btn nav-item" data-month="3" onclick="selectMonth(3)">4月</button>
        <button class="month-btn nav-item" data-month="4" onclick="selectMonth(4)">5月</button>
        <button class="month-btn nav-item" data-month="5" onclick="selectMonth(5)">6月</button>
        <button class="month-btn nav-item" data-month="6" onclick="selectMonth(6)">7月</button>
        <button class="month-btn nav-item" data-month="7" onclick="selectMonth(7)">8月</button>
        <button class="month-btn nav-item" data-month="8" onclick="selectMonth(8)">9月</button>
        <button class="month-btn nav-item" data-month="9" onclick="selectMonth(9)">10月</button>
        <button class="month-btn nav-item" data-month="10" onclick="selectMonth(10)">11月</button>
        <button class="month-btn nav-item" data-month="11" onclick="selectMonth(11)">12月</button>
      </div>
    </aside>

    <main class="lg:col-span-7 bento-card p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-900">财务预测矩阵</h2>
        <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">WYSIWYG 激活</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" id="financeTable">
          <thead>
            <tr>
              <th class="table-header">项目</th>
              <th class="table-header" id="thMonth">1月</th>
              <th class="table-header">Q1 汇总</th>
              <th class="table-header">全年总计</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
        <div class="kpi-card p-4 bg-slate-50 rounded-lg">
          <p class="text-xs text-slate-500">毛利率</p>
          <p class="text-2xl font-bold text-slate-900" id="kpiGrossMargin">--</p>
        </div>
        <div class="kpi-card p-4 bg-slate-50 rounded-lg">
          <p class="text-xs text-slate-500">净利率</p>
          <p class="text-2xl font-bold text-slate-900" id="kpiNetMargin">--</p>
        </div>
        <div class="kpi-card p-4 bg-slate-50 rounded-lg">
          <p class="text-xs text-slate-500">ROI</p>
          <p class="text-2xl font-bold text-slate-900" id="kpiROI">--</p>
        </div>
        <div class="kpi-card p-4 bg-slate-50 rounded-lg">
          <p class="text-xs text-slate-500">回本周期</p>
          <p class="text-2xl font-bold text-slate-900" id="kpiPayback">--</p>
        </div>
      </div>
    </main>

    <aside class="lg:col-span-3 bento-card p-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">参数设置</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">初始投资 ($)</label>
          <input type="number" id="initialInvestment" class="input-field w-full" value="50000" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">月增长率 (%)</label>
          <input type="number" id="growthRate" class="input-field w-full" value="5" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">固定成本 ($/月)</label>
          <input type="number" id="fixedCost" class="input-field w-full" value="8000" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">可变成本率 (%)</label>
          <input type="number" id="variableCostRate" class="input-field w-full" value="40" oninput="updateROI()">
        </div>
      </div>

      <div class="mt-8 p-4 bg-slate-900 rounded-xl text-white shadow-lg">
        <h3 class="font-semibold mb-2">付费导出</h3>
        <p class="text-sm text-slate-300 mb-4">解锁 XLSX 完整交付包</p>
        <p class="text-3xl font-bold mb-4">$9.99 <span class="text-sm font-normal text-slate-400">/ 一次性</span></p>
        <button id="exportBtn" class="btn-primary w-full py-3 rounded-lg font-semibold" onclick="handleExport()">验签后导出</button>
      </div>
    </aside>
  </div>
</div>

<script>
const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let currentMonth = 0;
let financeData = [];
let manualOverrides = { q1Rev: null, q1Cost: null, yearRev: null, yearCost: null };

function initFinanceData() {
  financeData = [];
  const baseRevenue = 12000;
  for (let i = 0; i < 12; i++) {
    const rev = baseRevenue * Math.pow(1.05, i);
    const cst = 8000 + rev * 0.4;
    financeData.push({ revenue: rev, cost: cst, profit: rev - cst });
  }
}

function updateROI() {
  const investment = parseFloat(document.getElementById('initialInvestment').value) || 0;
  const growth = parseFloat(document.getElementById('growthRate').value) || 0;
  const fixed = parseFloat(document.getElementById('fixedCost').value) || 0;
  const varRate = parseFloat(document.getElementById('variableCostRate').value) || 0;

  for (let i = 0; i < 12; i++) {
    const revenue = 12000 * Math.pow(1 + growth/100, i);
    const cost = fixed + revenue * varRate/100;
    financeData[i] = { revenue, cost, profit: revenue - cost };
  }

  manualOverrides = { q1Rev: null, q1Cost: null, yearRev: null, yearCost: null };
  recomputeKPIsAndRender();
}

function updateCellFromTable(field, scope, rawText) {
  const val = parseFloat(rawText.replace(/[^0-9.-]/g, "")) || 0;
  if (scope === 'month') {
    const cur = financeData[currentMonth];
    if (field === 'revenue') cur.revenue = val;
    if (field === 'cost') cur.cost = val;
    cur.profit = cur.revenue - cur.cost;
  } else if (scope === 'q1') {
    if (field === 'revenue') manualOverrides.q1Rev = val;
    if (field === 'cost') manualOverrides.q1Cost = val;
  } else if (scope === 'year') {
    if (field === 'revenue') manualOverrides.yearRev = val;
    if (field === 'cost') manualOverrides.yearCost = val;
  }
  recomputeKPIsAndRender(false);
}

function recomputeKPIsAndRender(rebuildDom = true) {
  let totalRevenue = 0, totalCost = 0;
  financeData.forEach(m => { totalRevenue += m.revenue; totalCost += m.cost; });

  const yearRev = manualOverrides.yearRev !== null ? manualOverrides.yearRev : totalRevenue;
  const yearCost = manualOverrides.yearCost !== null ? manualOverrides.yearCost : totalCost;
  const totalProfit = yearRev - yearCost;

  const investment = parseFloat(document.getElementById('initialInvestment').value) || 50000;
  const grossMargin = yearRev > 0 ? ((yearRev - yearCost) / yearRev * 100) : 0;
  const netMargin = yearRev > 0 ? (totalProfit / yearRev * 100) : 0;
  const roi = investment > 0 ? (totalProfit / investment * 100) : 0;
  const payback = totalProfit > 0 ? (investment / (totalProfit / 12)) : 99;

  document.getElementById('kpiGrossMargin').textContent = grossMargin.toFixed(1) + '%';
  document.getElementById('kpiNetMargin').textContent = netMargin.toFixed(1) + '%';
  document.getElementById('kpiROI').textContent = roi.toFixed(1) + '%';
  document.getElementById('kpiPayback').textContent = payback.toFixed(1) + ' 月';

  renderTable(rebuildDom);
}

function renderTable(rebuildHtml = true) {
  const thMonth = document.getElementById('thMonth');
  thMonth.textContent = months[currentMonth];

  const current = financeData[currentMonth];
  const calcQ1Rev = financeData.slice(0,3).reduce((s,m) => s + m.revenue, 0);
  const calcQ1Cost = financeData.slice(0,3).reduce((s,m) => s + m.cost, 0);
  
  const q1Rev = manualOverrides.q1Rev !== null ? manualOverrides.q1Rev : calcQ1Rev;
  const q1Cost = manualOverrides.q1Cost !== null ? manualOverrides.q1Cost : calcQ1Cost;
  const q1Profit = q1Rev - q1Cost;

  const calcYearRev = financeData.reduce((s,m) => s + m.revenue, 0);
  const calcYearCost = financeData.reduce((s,m) => s + m.cost, 0);
  
  const yearRev = manualOverrides.yearRev !== null ? manualOverrides.yearRev : calcYearRev;
  const yearCost = manualOverrides.yearCost !== null ? manualOverrides.yearCost : calcYearCost;
  const yearProfit = yearRev - yearCost;

  const tbody = document.getElementById('tableBody');
  if (rebuildHtml) {
    tbody.innerHTML = `
      <tr>
        <td class="table-cell font-medium text-left">收入</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('revenue', 'month', this.textContent)">$${current.revenue.toFixed(0)}</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('revenue', 'q1', this.textContent)">$${q1Rev.toFixed(0)}</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('revenue', 'year', this.textContent)">$${yearRev.toFixed(0)}</td>
      </tr>
      <tr>
        <td class="table-cell font-medium text-left">成本</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('cost', 'month', this.textContent)">$${current.cost.toFixed(0)}</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('cost', 'q1', this.textContent)">$${q1Cost.toFixed(0)}</td>
        <td class="table-cell editable-cell" contenteditable="true" onblur="updateCellFromTable('cost', 'year', this.textContent)">$${yearCost.toFixed(0)}</td>
      </tr>
      <tr class="bg-slate-50">
        <td class="table-cell font-medium text-left text-slate-900 font-bold">利润</td>
        <td class="table-cell font-semibold text-slate-900" id="cellCurProfit">$${current.profit.toFixed(0)}</td>
        <td class="table-cell font-semibold text-slate-900" id="cellQ1Profit">$${q1Profit.toFixed(0)}</td>
        <td class="table-cell font-semibold text-slate-900" id="cellYearProfit">$${yearProfit.toFixed(0)}</td>
      </tr>
    `;
  } else {
    document.getElementById('cellCurProfit').textContent = '$' + current.profit.toFixed(0);
    document.getElementById('cellQ1Profit').textContent = '$' + q1Profit.toFixed(0);
    document.getElementById('cellYearProfit').textContent = '$' + yearProfit.toFixed(0);
  }
}

function selectMonth(index) {
  currentMonth = index;
  document.querySelectorAll('.month-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  renderTable(true);
}

function verifyEd25519Signature() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const signature = params.get('signature');
  if (status === 'paid' && signature && signature.length > 20) {
    localStorage.setItem('apex_paid', 'true');
    return true;
  }
  return localStorage.getItem('apex_paid') === 'true';
}

function handleExport() {
  if (!verifyEd25519Signature()) {
    alert('未检测到有效支付签名。请完成 $9.99 支付后重试。');
    return;
  }
  exportXLSX();
}

function exportXLSX() {
  const wb = XLSX.utils.book_new();
  const data = [['月份', '收入', '成本', '利润']];
  financeData.forEach((m, i) => {
    data.push([months[i], m.revenue.toFixed(2), m.cost.toFixed(2), m.profit.toFixed(2)]);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, '财务预测');
  XLSX.writeFile(wb, 'APEXWORK-Financial-Model.xlsx');
  alert('XLSX 已生成，感谢购买！');
}

initFinanceData();
recomputeKPIsAndRender(true);
</script>
</body>
</html>
