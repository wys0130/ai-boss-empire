        // ========== Ed25519 验签 ==========
        function verifyEd25519Signature(signature, message) {
            // 生产环境应使用 WebCrypto API 进行真实 Ed25519 验签
            // 此处为前端演示逻辑，实际部署时替换为公钥验签
            if (!signature || signature.length < 64) return false;
            try {
                // 模拟验签：检查签名格式与消息哈希匹配
                const hash = btoa(message).slice(0, 32);
                return signature.includes(hash) || signature.length >= 128;
            } catch (e) {
                return false;
            }
        }

        // ========== 检查本地授权 ==========
        function checkStoredLicense() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const license = JSON.parse(stored);
                    if (license.valid && license.expires > Date.now()) {
                        isPaid = true;
                        unlockExport();
                    }
                }
            } catch (e) {
                console.log('No stored license');
            }
        }

        // ========== 支付处理 ==========
        function handlePayment() {
            // 模拟支付网关跳转
            // 生产环境替换为 Stripe Payment Links 或 LemonSqueezy
            const gateway = 'stripe';
            const mockSignature = 'ed25519_' + btoa(Date.now().toString()).slice(0, 32) + '_' + btoa('apexwork_paid').slice(0, 32) + '_' + btoa('demo_signature').slice(0, 32);
            const callbackUrl = window.location.origin + window.location.pathname + '?status=paid&signature=' + mockSignature + '&gateway=' + gateway;
            
            showToast('正在跳转支付网关...', 'info');
            
            // 模拟支付回调
            setTimeout(() => {
                // 解析回调参数
                const params = new URLSearchParams(callbackUrl.split('?')[1]);
                const status = params.get('status');
                const signature = params.get('signature');
                const gatewayName = params.get('gateway');

                if (status === 'paid' && verifyEd25519Signature(signature, 'apexwork_paid')) {
                    // 验签通过，写入本地授权
                    const license = {
                        valid: true,
                        gateway: gatewayName,
                        signature: signature,
                        expires: Date.now() + 365 * 24 * 60 * 60 * 1000, // 1年有效
                        purchasedAt: Date.now()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(license));
                    isPaid = true;
                    unlockExport();
                    showToast('✅ 支付成功！DOCX 导出已解锁', 'success');
                } else {
                    showToast('❌ 支付验证失败，请重试', 'error');
                }
            }, 1500);
        }

        // ========== 解锁导出 ==========
        function unlockExport() {
            const exportBtn = document.getElementById('exportBtn');
            const payBtn = document.getElementById('payBtn');
            const payStatus = document.getElementById('payStatus');
            
            exportBtn.disabled = false;
            exportBtn.classList.remove('btn-secondary');
            exportBtn.classList.add('btn-primary');
            payBtn.disabled = true;
            payBtn.textContent = '✅ 已支付';
            payStatus.textContent = '已支付 · 导出已解锁';
            payStatus.classList.add('text-green-600');
        }

        // ========== 导出 DOCX ==========
        async function exportDocx() {
            if (!isPaid) {
                showToast('请先完成支付后再导出', 'error');
                return;
            }

            showToast('正在生成 DOCX 文件...', 'info');

            try {
                const company = document.getElementById('companyName').value;
                const title = document.getElementById('reportTitle').value;
                const date = document.getElementById('reportDate').value;
                const author = document.getElementById('authorName').value;
                const rating = document.getElementById('complianceRating').value;

                // 构建 DOCX XML
                const docxContent = buildDocxXml(company, title, date, author, rating);
                
                // 创建 ZIP
                const zip = new JSZip();
                zip.file('[Content_Types].xml', getContentTypesXml());
                zip.file('_rels/.rels', getRelsXml());
                zip.file('word/document.xml', docxContent);
                zip.file('word/_rels/document.xml.rels', getDocumentRelsXml());
                zip.file('word/styles.xml', getStylesXml());

                // 生成 Blob
                const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                
                // 下载
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${company}_合规报告_${date}.docx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast('✅ DOCX 导出成功！', 'success');
            } catch (e) {
                console.error('Export error:', e);
                showToast('❌ 导出失败，请重试', 'error');
            }
        }
