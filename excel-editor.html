<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEXWORK - Excel 财务模型编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f8fafc; }
  .bento-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; transition: all 0.2s; }
  .bento-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
  .nav-item { cursor: pointer; padding: 10px 14px; border-radius: 10px; transition: all 0.15s; font-size: 13px; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #0f172a; color: #ffffff; }
  .kpi-card { background: linear-gradient(135deg, #0f172a, #1e293b); color: #ffffff; border-radius: 12px; padding: 16px; }
  .btn-primary { background: #0f172a; color: #ffffff; padding: 12px 24px; border-radius: 10px; font-weight: 600; transition: all 0.2s; }
  .btn-primary:hover { background: #1e293b; transform: translateY(-1px); }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #f1f5f9; color: #0f172a; padding: 10px 20px; border-radius: 10px; font-weight: 500; transition: all 0.2s; }
  .btn-secondary:hover { background: #e2e8f0; }
  .input-field { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 100%; transition: border 0.2s; }
  .input-field:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,0.1); }
  .table-cell { border: 1px solid #e2e8f0; padding: 8px; text-align: right; font-size: 13px; }
  .table-header { background: #f8fafc; font-weight: 600; text-align: center; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">
  <!-- 顶部品牌栏 -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-bold text-lg">A</div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">Excel 财务模型编辑器</h1>
        <p class="text-sm text-slate-500">12 个月滚动预测矩阵 · ROI 自动计算</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-sm text-slate-500">价格</span>
      <span class="text-2xl font-bold text-slate-900">$9.99</span>
    </div>
  </div>

  <!-- 三栏工作台 -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- 左侧：页导航 -->
    <div class="lg:col-span-2 bento-card p-4">
      <h3 class="text-sm font-semibold text-slate-500 mb-3">财务页导航</h3>
      <div id="navList" class="space-y-1"></div>
      <button onclick="resetParams()" class="btn-secondary w-full mt-4 text-sm">重置参数</button>
    </div>

    <!-- 中央：实时预览 -->
    <div class="lg:col-span-7 bento-card p-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold text-slate-500">实时预览</h3>
        <div class="flex gap-2">
          <button onclick="downloadTemplate()" class="btn-secondary text-xs">下载模板</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" id="previewTable">
          <thead>
            <tr>
              <th class="table-header">月份</th>
              <th class="table-header">收入 ($)</th>
              <th class="table-header">成本 ($)</th>
              <th class="table-header">利润 ($)</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <!-- KPI 卡片 -->
      <div class="grid grid-cols-3 gap-4 mt-6">
        <div class="kpi-card">
          <p class="text-xs text-slate-300">ROI</p>
          <p class="text-2xl font-bold" id="kpiROI">0%</p>
        </div>
        <div class="kpi-card">
          <p class="text-xs text-slate-300">毛利率</p>
          <p class="text-2xl font-bold" id="kpiMargin">0%</p>
        </div>
        <div class="kpi-card">
          <p class="text-xs text-slate-300">回本周期</p>
          <p class="text-2xl font-bold" id="kpiPayback">-</p>
        </div>
      </div>
    </div>

    <!-- 右侧：参数与导出 -->
    <div class="lg:col-span-3 bento-card p-4">
      <h3 class="text-sm font-semibold text-slate-500 mb-4">参数绑定</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-500 mb-1">初始投资 ($)</label>
          <input type="number" id="paramInvestment" class="input-field" value="50000" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">月增长率 (%)</label>
          <input type="number" id="paramGrowth" class="input-field" value="5" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">月固定成本 ($)</label>
          <input type="number" id="paramCost" class="input-field" value="8000" oninput="updateROI()">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">起始月收入 ($)</label>
          <input type="number" id="paramRevenue" class="input-field" value="12000" oninput="updateROI()">
        </div>
      </div>

      <!-- 收银台 -->
      <div class="mt-6 pt-4 border-t border-slate-200">
        <h4 class="text-sm font-semibold text-slate-700 mb-3">付费导出</h4>
        <button id="exportBtn" onclick="handleExport()" class="btn-primary w-full">导出 XLSX</button>
        <p class="text-xs text-slate-400 mt-2 text-center">支付后解锁导出 · $9.99</p>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 核心数据 =====
let months = [];
for (let i = 1; i <= 12; i++) months.push('M' + i);

// ===== 初始化 =====
function init() {
  renderNav();
  updateROI();
}

// ===== 渲染导航 =====
function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  months.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = 'nav-item' + (idx === 0 ? ' active' : '');
    div.textContent = m + ' · 财务页';
    div.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      div.classList.add('active');
      // 模拟切换月份预览
      updateROI();
    };
    nav.appendChild(div);
  });
}

// ===== 计算 ROI =====
function updateROI() {
  const investment = parseFloat(document.getElementById('paramInvestment').value) || 0;
  const growth = parseFloat(document.getElementById('paramGrowth').value) || 0;
  const cost = parseFloat(document.getElementById('paramCost').value) || 0;
  const revenue = parseFloat(document.getElementById('paramRevenue').value) || 0;

  let totalRevenue = 0;
  let totalCost = 0;
  let rows = '';
  let cumulativeProfit = 0;
  let paybackMonth = '-';

  for (let i = 0; i < 12; i++) {
    const monthRevenue = revenue * Math.pow(1 + growth / 100, i);
    const monthCost = cost;
    const monthProfit = monthRevenue - monthCost;
    totalRevenue += monthRevenue;
    totalCost += monthCost;
    cumulativeProfit += monthProfit;

    if (cumulativeProfit >= investment && paybackMonth === '-') {
      paybackMonth = 'M' + (i + 1);
    }

    rows += `<tr>
      <td class="table-cell">M${i + 1}</td>
      <td class="table-cell">${monthRevenue.toFixed(2)}</td>
      <td class="table-cell">${monthCost.toFixed(2)}</td>
      <td class="table-cell">${monthProfit.toFixed(2)}</td>
    </tr>`;
  }

  document.getElementById('tableBody').innerHTML = rows;

  const netProfit = totalRevenue - totalCost - investment;
  const roi = investment > 0 ? (netProfit / investment) * 100 : 0;
  const margin = totalRevenue > 0 ? ((totalRevenue - totalCost) / totalRevenue) * 100 : 0;

  document.getElementById('kpiROI').textContent = roi.toFixed(1) + '%';
  document.getElementById('kpiMargin').textContent = margin.toFixed(1) + '%';
  document.getElementById('kpiPayback').textContent = paybackMonth;
}

// ===== 重置参数 =====
function resetParams() {
  document.getElementById('paramInvestment').value = 50000;
  document.getElementById('paramGrowth').value = 5;
  document.getElementById('paramCost').value = 8000;
  document.getElementById('paramRevenue').value = 12000;
  updateROI();
}

// ===== 下载模板 =====
function downloadTemplate() {
  const wb = XLSX.utils.book_new();
  const data = [
    ['月份', '收入 ($)', '成本 ($)', '利润 ($)'],
    ['M1', 12000, 8000, 4000],
    ['M2', 12600, 8000, 4600],
    ['M3', 13230, 8000, 5230]
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, '财务模型');
  XLSX.writeFile(wb, 'financial-model-template.xlsx');
}

// ===== Ed25519 验签 =====
function verifyEd25519Signature() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const signature = params.get('signature');
  if (status === 'paid' && signature && signature.length > 20) {
    localStorage.setItem('apex_paid', 'true');
    return true;
  }
  return false;
}

// ===== 导出处理 =====
function handleExport() {
  if (!verifyEd25519Signature()) {
    alert('⚠️ 请先完成 $9.99 支付，验签通过后解锁导出。');
    return;
  }
  const investment = parseFloat(document.getElementById('paramInvestment').value) || 0;
  const growth = parseFloat(document.getElementById('paramGrowth').value) || 0;
  const cost = parseFloat(document.getElementById('paramCost').value) || 0;
  const revenue = parseFloat(document.getElementById('paramRevenue').value) || 0;

  const wb = XLSX.utils.book_new();
  const rows = [['月份', '收入 ($)', '成本 ($)', '利润 ($)']];
  for (let i = 0; i < 12; i++) {
    const monthRevenue = revenue * Math.pow(1 + growth / 100, i);
    const monthCost = cost;
    rows.push(['M' + (i + 1), monthRevenue.toFixed(2), monthCost.toFixed(2), (monthRevenue - monthCost).toFixed(2)]);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, '财务模型');
  XLSX.writeFile(wb, 'apex-financial-model.xlsx');
}

// ===== 启动 =====
init();
</script>
</body>
</html>
