<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - APEXWORK</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .success-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #4CAF50;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: scaleIn 0.5s ease;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .vip-badge {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #333;
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #fff;
      color: #667eea;
      padding: 12px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .loading {
      display: none;
      margin-top: 20px;
    }
    .loading.active {
      display: block;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="checkmark">✓</div>
    <h1>Payment Successful!</h1>
    <p>Your VIP access has been activated.</p>
    <div class="vip-badge">👑 VIP UNLIMITED</div>
    <p>You can now download all premium templates.</p>
    <a href="/" class="btn">Go to Dashboard</a>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Verifying payment...</p>
    </div>
  </div>

  <script src="/components/payment-gateway.js"></script>
  <script>
    // 验证支付状态
    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('loading');
      loading.classList.add('active');
      
      const success = await window.APEXWORK.Payment.verifyPayment();
      
      if (success) {
        // 存储 VIP 状态
        localStorage.setItem('apexwork_vip', 'active');
        
        // 延迟跳转
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } else {
        loading.classList.remove('active');
        document.querySelector('.checkmark').style.background = '#f44336';
        document.querySelector('.checkmark').textContent = '✗';
        document.querySelector('h1').textContent = 'Payment Verification Failed';
        document.querySelector('.vip-badge').style.display = 'none';
        document.querySelector('.btn').textContent = 'Contact Support';
        document.querySelector('.btn').href = 'mailto:support@apexwork.ai';
      }
    });
  </script>
</body>
</html>
