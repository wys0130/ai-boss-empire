// Cloudflare Worker 配置文件
name = "download-gateway"
main = "worker/download-gateway.js"
compatibility_date = "2024-01-01"

# 环境变量
[vars]
ED25519_PUBLIC_KEY = "YOUR_BASE64_ENCODED_PUBLIC_KEY"

# 绑定 R2 存储 (如果文件存储在 R2)
# [[r2_buckets]]
# binding = "PAID_FILES"
# bucket_name = "apexwork-paid-files"

# 绑定 Turso 数据库 (可选)
# [[d1_databases]]
# binding = "TURSO"
# database_name = "apexwork-db"
# database_id = "YOUR_DATABASE_ID"
```

---

**施工总结：**

1.  **边缘签发**：Cloudflare Worker 在全球 300+ 节点处理签名验证，延迟 <50ms。
2.  **零成本**：Worker 免费额度 10 万次请求/天，完全满足初期需求。
3.  **绝对安全**：Ed25519 非对称加密，私钥永不出浏览器，公钥仅用于验证。
4.  **3 分钟时效**：过期时间由前端生成，Worker 严格校验，过期立即拒绝。
5.  **无缝集成**：支付回调后一键激活下载，用户体验丝滑。

