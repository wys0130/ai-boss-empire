name: 7x24 AI Autonomous Evolving Agent (云端永动机)

on:
  schedule:
    # 每隔 4 小时静默巡检一次
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持网页端/控制台手动一键触发

# 👑 核心优化 1：并发互斥控制 — 自动取消积压的旧任务，永远为新任务与老板手动提交让道
concurrency:
  group: ai-autonomous-swarm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 赋予机器人写仓库和推 main 分支的合法工牌

jobs:
  auto-evolve:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库全部代码与工单清单
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 准备 Node.js 20 运行时环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 唤醒大脑中枢 -> 分解不可拆分工单 -> 驱动部门落地 -> 自动打勾
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cat << 'EOF' > run-swarm.js
          const fs = require("fs");

          async function runApexSwarm() {
            const apiKey = process.env.DEEPSEEK_API_KEY;
            if (!apiKey) {
              console.log("提示: 未检测到 DEEPSEEK_API_KEY，终止本次云端排班。");
              return;
            }

            if (!fs.existsSync("AI-EMPIRE-CONSTITUTION.md") || !fs.existsSync("TASKS_MANIFEST.json")) {
              console.log("提示: 核心目标文件不存在，跳过本次排班。");
              return;
            }

            const constitution = fs.readFileSync("AI-EMPIRE-CONSTITUTION.md", "utf8");
            const manifestRaw = fs.readFileSync("TASKS_MANIFEST.json", "utf8");
            const manifest = JSON.parse(manifestRaw);

            const activeTask = manifest.tasks.find(t => t.status === "TODO" || t.status === "IN_PROGRESS");
            if (!activeTask) {
              console.log("🎉 所有计划已完成，系统进入自适应巡检模式！");
              return;
            }

            console.log(`🧠 [大脑中枢]: 锁定当前核心工单 -> [${activeTask.id}] ${activeTask.title}`);
            console.log(`📡 [大脑中枢]: 呼叫指定责任部门 -> ${activeTask.department}`);

            const prompt = `你是 APEXWORK 大脑中枢与智能体协同引擎。
          请严格依据《天网宪法 V5.0》，集中全力落实这一个极其具体的不可拆分任务：
          【任务ID】：${activeTask.id}
          【任务目标】：${activeTask.title}
          【所属部门】：${activeTask.department}
          【特殊注意事项】：${activeTask.notes}

          请按照该部门的专业职责去执行：
          1. 如果是【推广营销部 & 国际本地化部】，请直接编写英文版的 Reddit / Pinterest 推广高转化 Markdown 贴文，并按格式保存为 ===FILE: marketing/campaigns/${activeTask.id}.md===。
          2. 如果是【施工工程部 / 主动产品部 / 视觉策划部】，请编写对应的 html/js/json 组件，按格式 ===FILE: 路径=== 输出。
          3. 如果任务已可宣告终结，请在输出最后包含一行指令：===TASK_COMPLETE: ${activeTask.id}===`;

            const res = await fetch("https://api.deepseek.com/chat/completions", {
              method: "POST",
              headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "deepseek-chat",
                messages: [
                  { role: "system", content: constitution.slice(0, 3000) },
                  { role: "user", content: prompt }
                ],
                temperature: 0.5
              })
            });

            if (!res.ok) throw new Error("API 响应异常: " + res.statusText);
            const data = await res.json();
            const content = data.choices[0].message.content;

            const fileRegex = /===FILE:\s*([a-zA-Z0-9_\-\.\/]+)\s*===([\s\S]*?)(?=(===FILE:|$|===TASK_COMPLETE))/g;
            let match;
            let fileWritten = false;
            while ((match = fileRegex.exec(content)) !== null) {
              const targetPath = match[1].trim();
              const newCode = match[2].trim().replace(/^```[a-z]*\n?/i, "").replace(/\n?```$/i, "");
              if (targetPath) {
                const pathParts = targetPath.split("/");
                if (pathParts.length > 1) {
                  const dir = pathParts.slice(0, -1).join("/");
                  if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
                }
                fs.writeFileSync(targetPath, newCode, "utf8");
                console.log(`✅ [部门响应]: 自动写入资产件 -> ${targetPath}`);
                fileWritten = true;
              }
            }

            if (content.includes(`===TASK_COMPLETE: ${activeTask.id}===`) || fileWritten) {
              activeTask.status = "DONE";
              manifest.summary.completed += 1;
              manifest.summary.todo = Math.max(0, manifest.summary.todo - 1);
              manifest.updated_at = new Date().toISOString().slice(0, 10);
              fs.writeFileSync("TASKS_MANIFEST.json", JSON.stringify(manifest, null, 2), "utf8");
              console.log(`🏁 [任务打勾]: 任务 ${activeTask.id} 自动变更为 DONE，计划书已更新！`);
            }

            const now = new Date().toISOString().replace("T", " ").slice(0, 16);
            fs.appendFileSync("MEMORY.md", `\n- [APEX-SWARM | ${now}]: 成功推动任务 [${activeTask.id}]，部门: ${activeTask.department}。`, "utf8");
          }

          runApexSwarm().catch(err => {
            console.error("大脑中枢调度异常:", err.message);
          });
          EOF
          node run-swarm.js || echo "⚠️ 大脑中枢脚本执行结束 (容错保护触发)"
          rm -f run-swarm.js

      - name: 4. 运行商业热点捕手与不重复模板自研脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -f "scripts/ai-trend-hunter.js" ]; then
            node scripts/ai-trend-hunter.js || echo "⚠️ 热点脚本执行完毕，未生成新变更"
          else
            echo "未找到 ai-trend-hunter.js，跳过执行"
          fi

      - name: 5. 无冲突无构建写回仓库 (防 Pages 抢道与循环触发)
        run: |
          git config --global user.name "AI-Brain-Orchestrator"
          git config --global user.email "brain@apexwork.io"
          git add -A
          if git diff --staged --quiet; then
            echo "没有新的工单成果或修改需要提交"
          else
            # 👑 核心优化 2：提交语句最后显式标注 [skip ci]，彻底阻断触发 GitHub Pages 网页构建队列！
            git commit -m "🤖 AI Brain: 自动落实工单与进度归档 [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break
              sleep 4
            done
          fi
