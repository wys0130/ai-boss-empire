<!-- 主站入口 - 集成境内收银台 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEXWORK - 极速商务三件套</title>
  
  <!-- 预连接支付网关 -->
  <link rel="preconnect" href="https://pay.apexwork.cn">
  <link rel="dns-prefetch" href="https://pay.apexwork.cn">
  
  <!-- 关键CSS -->
  <style>
    /* 收银台样式 - 视觉冲击，少字多图 */
    .cn-paywall {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .cn-paywall-card {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .cn-paywall-title {
      color: #fff;
      font-size: 32px;
      text-align: center;
      margin: 20px 0 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .cn-paywall-sub {
      color: rgba(255,255,255,0.7);
      text-align: center;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .cn-paywall-qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .cn-qr-channel {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .cn-qr-channel:hover, .cn-qr-channel.active {
      border-color: #07C160;
      background: rgba(7,193,96,0.1);
    }
    
    .cn-qr-box {
      width: 100%;
      aspect-ratio: 1;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .cn-qr-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .cn-qr-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    
    .cn-icon {
      width: 20px;
      height: 20px;
    }
    
    .cn-paywall-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 15px;
    }
    
    .cn-status-dot {
      width: 8px;
      height: 8px;
      background: #07C160;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    
    .cn-paywall-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
    
    .cn-shield {
      width: 16px;
      height: 16px;
    }
    
    .cn-spinner {
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .cn-qr-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .cn-qr-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
    }
    
    .cn-qr-modal-card {
      position: relative;
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    
    .cn-qr-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
    }
    
    .cn-qr-modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .cn-qr-modal-amount {
      font-size: 36px;
      font-weight: 800;
      color: #07C160;
      margin-bottom: 20px;
    }
    
    .cn-qr-modal-qr {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      background: #f5f5f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .cn-qr-modal-tip {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .cn-qr-modal-timer {
      color: #999;
      font-size: 12px;
    }
    
    .cn-unlocked {
      text-align: center;
      padding: 40px 20px;
    }
    
    .cn-success-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
    }
    
    .cn-unlocked h2 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .cn-unlocked p {
      color: rgba(255,255,255,0.7);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- 主站内容 -->
  <div id="app">
    <!-- 产品展示区 -->
    <div class="product-grid">
      <!-- 模板卡片 -->
    </div>
  </div>

  <!-- 境内收银台组件 -->
  <div id="cn-paywall-container"></div>

  <!-- 引入收银台组件 -->
  <script>
    // 动态加载收银台
    fetch('/components/payment/cn-paywall.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('cn-paywall-container').innerHTML = html;
        // 加载JS
        const script = document.createElement('script');
        script.src = '/components/payment/cn-status-poll.js';
        document.body.appendChild(script);
        
        const sigScript = document.createElement('script');
        sigScript.src = '/components/payment/cn-signature.js';
        document.body.appendChild(sigScript);
      });
  </script>
</body>
</html>
