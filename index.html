<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEXWORK - 商务三件套极速交付</title>
  <meta name="description" content="PPT/Excel/Word 极速商业交付 SaaS 商城">
  <link rel="preload" as="image" href="/assets/images/webp/hero-bg.webp">
  <style>
    /* 极简高性能 CSS - Edge Native */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; }
    
    /* 少字多图视觉冲击 */
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .hero h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.2rem; opacity: 0.9; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; padding: 4rem 2rem; max-width: 1400px; margin: 0 auto; }
    
    .card { background: #1a1a2e; border-radius: 16px; padding: 2rem; transition: transform 0.3s; cursor: pointer; border: 1px solid #2a2a4a; }
    .card:hover { transform: translateY(-5px); }
    .card h3 { font-size: 1.5rem; margin-bottom: 1rem; }
    .card .price { font-size: 2rem; color: #4ade80; font-weight: 700; }
    
    .btn { background: #4ade80; color: #000; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; width: 100%; margin-top: 1rem; }
    .btn:hover { background: #22c55e; }
    
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; padding: 2rem 1rem; }
    }
  </style>
</head>
<body>
  <!-- Hero 区域 -->
  <section class="hero">
    <div>
      <h1>⚡ 商务三件套<br>极速交付</h1>
      <p>PPT · Excel · Word — 1 秒生成，$9.99 即刻下载</p>
    </div>
  </section>

  <!-- 模板展示区 -->
  <section class="grid" id="template-grid">
    <!-- 动态加载模板卡片 -->
  </section>

  <!-- 组件加载 -->
  <script src="/components/quality-scorer.js"></script>
  <script src="/components/template-auto-generator.js"></script>
  <script>
    // 启动每日自动生成
    window.addEventListener('DOMContentLoaded', () => {
      window.APEXWORKTemplateGenerator.startDailyGeneration();
      loadTemplates();
    });

    // 加载模板列表
    async function loadTemplates() {
      try {
        const response = await fetch('/data/templates.json');
        const data = await response.json();
        renderTemplates(data.templateCategories);
      } catch (error) {
        console.error('模板加载失败:', error);
      }
    }

    // 渲染模板卡片
    function renderTemplates(categories) {
      const grid = document.getElementById('template-grid');
      grid.innerHTML = '';
      
      categories.forEach(category => {
        category.templates.forEach(template => {
          if (template.status === 'published') {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <h3>${template.name}</h3>
              <p style="color: #888; margin-bottom: 1rem;">${category.name}</p>
              <div class="price">$${template.priceUSD}</div>
              <button class="btn" onclick="purchaseTemplate('${template.id}')">立即购买</button>
            `;
            grid.appendChild(card);
          }
        });
      });
    }

    // 购买模板（零注册收单闭环）
    function purchaseTemplate(templateId) {
      // 模拟支付回调
      const paymentSuccess = true;
      if (paymentSuccess) {
        // 生成 Ed25519 签名密钥
        const signature = generateEd25519Signature(templateId);
        localStorage.setItem('apexwork_license', signature);
        alert('✅ 购买成功！模板已解锁，无限下载。');
      }
    }

    // 生成 Ed25519 签名（简化演示）
    function generateEd25519Signature(templateId) {
      return `ed25519_${templateId}_${Date.now()}`;
    }
  </script>
</body>
</html>
