<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="dns-prefetch" href="https://pay.apexwork.cn">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="components/vip-download-guard.js"></script>
  <script src="components/zero-auth.js"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }

</head>
<body class="min-h-screen flex flex-col justify-between">
  <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-3 md:py-4 flex flex-wrap items-center justify-between gap-2.5 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center gap-2 cursor-pointer select-none shrink-0" ondblclick="checkChairmanStealthAccess()" title="双击进行管理员口令安全验证">
        <!-- 👑 修复：绝对稳健的 LOGO 兜底逻辑 -->
        <img id="frontBrandLogo" src="assets/logo.webp" alt="APEXWORK" class="h-8 md:h-9 w-auto object-contain drop-shadow" 
             onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/gh/wys0130/ai-boss-empire@main/assets/logo.webp'; setTimeout(()=>{if(!this.complete || this.naturalWidth===0){this.style.display='none'; document.getElementById('frontFallbackBadge').classList.remove('hidden');}}, 1500);" />
        <div id="frontFallbackBadge" class="hidden w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white font-black text-sm shadow-md shrink-0 aspect-square">A</div>
      </div>
      <h1 class="font-bold text-xs md:text-sm tracking-wide text-slate-800 truncate" data-zh="顶尖智能商务办公平台" data-en="Top Intelligent Executive Platform">顶尖智能商务办公平台</h1>
    </div>
    <div class="flex items-center flex-wrap gap-2 md:gap-5 text-xs font-medium text-slate-600">
      <!-- 👑 修复：PPT导航文字采用纯正橙色 -->
      <a href="#ppt-section" class="hover:opacity-80 transition font-bold text-orange-500" data-zh="PPT演示" data-en="PPT Decks">PPT演示</a>
      <a href="#excel-section" class="hover:opacity-80 transition font-bold text-emerald-600" data-zh="EXCEL表格" data-en="EXCEL Models">EXCEL表格</a>
      <a href="#word-section" class="hover:opacity-80 transition font-bold text-indigo-600" data-zh="WORD文档" data-en="WORD Reports">WORD文档</a>
      <span class="hidden md:inline h-4 w-[1px] bg-slate-200"></span>
      <button id="langToggleBtn" onclick="window.ApexLang.toggle()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono text-xs px-3 py-1 rounded-lg border border-slate-300 font-bold transition">
        🌐 EN / 简
      </button>
      <span id="userRoleBadge" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-1 rounded-lg font-bold text-xs shadow-sm transition select-none" data-zh="👤 游客" data-en="👤 Visitor">👤 游客</span>
      <a id="adminSecretPortal" href="admin.html" class="hidden bg-gradient-to-r from-blue-600 to-indigo-600 text-white border border-blue-400/30 px-3 py-1 rounded-lg font-black shadow-md hover:opacity-95 transition text-xs" data-zh="👑 驾驶舱 →" data-en="👑 Dashboard →">👑 驾驶舱 →</a>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 md:py-10 space-y-12">
    <div id="heroBannerBox" class="rounded-2xl p-6 md:p-8 text-white shadow-xl relative min-h-[180px] md:min-h-[240px] flex items-center overflow-hidden bg-slate-900 transition-all duration-500 bg-cover bg-center">
      <div id="dynamicHeroContainer" class="w-full z-10"></div>
      <div class="absolute bottom-3 right-5 flex gap-1.5 z-20">
        <span class="dot w-2 h-2 rounded-full bg-white cursor-pointer transition shadow-md" onclick="ApexHeroSlider.jump(0)"></span>
        <span class="dot w-2 h-2 rounded-full bg-white/40 cursor-pointer transition shadow-md" onclick="ApexHeroSlider.jump(1)"></span>
      </div>
    </div>

    <section id="ppt-section">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h3 class="text-base md:text-lg font-bold text-slate-900 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block"></span>
            <span data-zh="精品商业 PPT 模板" data-en="Premium PPT Templates">精品商业 PPT 模板</span>
          </h3>
          <p class="text-xs text-slate-500 mt-1" data-zh="海量高定视觉，对标顶级大厂画廊" data-en="Massive premium visuals, gallery style">海量高定视觉，对标顶级大厂画廊</p>
        </div>
      </div>
      <div id="mall-ppt-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
          <div class="col-span-full py-10 text-center text-slate-400 font-mono text-sm animate-pulse border border-dashed border-slate-300 rounded-2xl">☁️ 正在初始化商城图库与 AI 数据...</div>
      </div>
    </section>

    <section id="excel-section">
      <div class="flex justify-between items-center mb-6 border-t border-slate-200 pt-8">
        <div>
          <h3 class="text-base md:text-lg font-bold text-slate-900 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
            <span data-zh="全渠道 EXCEL 财务与数据模型" data-en="EXCEL Financial & Data Models">全渠道 EXCEL 财务与数据模型</span>
          </h3>
          <p class="text-xs text-slate-500 mt-1" data-zh="内置全链路公式与宏变量，自动计算动态图表" data-en="Built-in formulas and auto-calculating charts">内置全链路公式与宏变量，自动计算动态图表</p>
        </div>
      </div>
      <div id="mall-excel-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </section>

    <section id="word-section">
      <div class="flex justify-between items-center mb-6 border-t border-slate-200 pt-8">
        <div>
          <h3 class="text-base md:text-lg font-bold text-slate-900 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span>
            <span data-zh="欧美标准 WORD ATS 合规报告" data-en="WORD ATS Compliance Reports">欧美标准 WORD ATS 合规报告</span>
          </h3>
          <p class="text-xs text-slate-500 mt-1" data-zh="通过全球顶尖金融机构机器人简历与报告盲测" data-en="Passes global top institutional ATS blind tests">通过全球顶尖金融机构机器人简历与报告盲测</p>
        </div>
      </div>
      <div id="mall-word-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </section>
  </main>

  <div id="compliance-footer-container"></div>
  <div id="cn-paywall-container"></div>

  <!-- 👑 隐形的颜色保险箱：防止 Tailwind CSS 清除未引用的动态颜色 -->
  <div class="hidden text-orange-500 from-orange-500 to-red-500 text-emerald-600 from-emerald-500 to-teal-500 text-indigo-600 from-indigo-500 to-purple-500 text-blue-600 from-blue-500 to-indigo-500"></div>

  <script>
    window.ApexMallGallery = {
        baseProducts: [
            { id: "aerotech", type: "ppt", title: "AeroTech 创投规划书", titleEn: "AeroTech Pitch Deck", category: "15 页 · 商业计划书", categoryEn: "15 P · Business Plan", thumb: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80", priceRmb: 69 },
            { id: "saas", type: "ppt", title: "SaaS 增长指标盘点", titleEn: "SaaS Growth Metrics", category: "20 页 · 数据可视化", categoryEn: "20 P · Data Viz", thumb: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=600&q=80", priceRmb: 69 },
            { id: "fintech", type: "ppt", title: "FinTech A 轮融资方案", titleEn: "FinTech Series A", category: "12 页 · 科技金融", categoryEn: "12 P · FinTech", thumb: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=600&q=80", priceRmb: 69 },
            { id: "excel-roi", type: "excel", title: "全渠道 ROI 动态测算模型", titleEn: "Omnichannel ROI Model", category: "数据模型 · 自动计算", categoryEn: "Data Model · Auto Calc", thumb: "https://images.unsplash.com/photo-1543286386-2e659306cd6c?auto=format&fit=crop&w=600&q=80", priceRmb: 69 },
            { id: "word-ats", type: "word", title: "企业级 ATS 智能排版报告", titleEn: "Enterprise ATS Report", category: "标准报告 · ATS 盲测", categoryEn: "Standard · ATS Ready", thumb: "https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=600&q=80", priceRmb: 69 }
        ],
        init: async function() {
            let allProducts = [...this.baseProducts];
            try {
                const res = await fetch('data/ai-generated-decks.json?nocache=' + Date.now());
                if (res.ok) {
                    const aiData = await res.json();
                    if (Array.isArray(aiData) && aiData.length > 0) {
                        allProducts = [...allProducts, ...aiData];
                    }
                }
            } catch(e) {}
            this.render(allProducts);
        },
        render: function(products) {
            const ppts = products.filter(p => !p.type || p.type === 'ppt' || (p.category && p.category.toLowerCase().includes('ppt')) || p.id === 'aerotech' || p.id === 'saas' || p.id === 'fintech');
            const excels = products.filter(p => p.type === 'excel' || (p.category && p.category.toLowerCase().includes('excel')) || p.id === 'excel-roi');
            const words = products.filter(p => p.type === 'word' || (p.category && p.category.toLowerCase().includes('word')) || p.id === 'word-ats');

            this.renderGrid('mall-ppt-grid', ppts, 'orange', 'editor.html');
            this.renderGrid('mall-excel-grid', excels, 'emerald', 'excel-editor.html');
            this.renderGrid('mall-word-grid', words, 'indigo', 'word-editor.html');
            
            if (window.ApexLang) window.ApexLang.apply(window.ApexLang.currentLang);
        },
        renderGrid: function(containerId, items, themeColor, editorUrl) {
            const grid = document.getElementById(containerId);
            if (!grid) return;
            grid.innerHTML = "";
            const pricing = window.ApexPricing ? window.ApexPricing.getConfig() : { ppt: { rmb: 69, usd: 9.99 } };
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 font-mono text-sm border border-dashed border-slate-300 rounded-2xl">该分区暂无模板数据</div>`;
                return;
            }
            items.forEach(p => {
                const finalImg = p.thumb || p.thumbnail || "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80";
                const rmb = p.priceRmb || pricing.ppt.rmb;
                const usd = p.priceUsd || pricing.ppt.usd || 9.99;
                const titleZh = p.title;
                const titleEn = p.titleEn || p.title;
                const catZh = p.category ? p.category.split('·')[1]?.trim() : '精选模板';
                const catEn = p.categoryEn || 'Premium Model';

                const textCol = themeColor === 'blue' ? 'text-blue-600' : (themeColor === 'emerald' ? 'text-emerald-600' : (themeColor === 'orange' ? 'text-orange-500' : 'text-indigo-600'));
                const badgeGrad = themeColor === 'blue' ? 'from-blue-500 to-indigo-500' : (themeColor === 'emerald' ? 'from-emerald-500 to-teal-500' : (themeColor === 'orange' ? 'from-orange-500 to-red-500' : 'from-indigo-500 to-purple-500'));

                grid.innerHTML += `
                    <div onclick="ApexMallGallery.openDetailModal('${p.id}', '${titleZh}', '${finalImg}', ${rmb}, '${editorUrl}')" class="bg-white rounded-xl overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.06)] hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 border border-slate-100 group cursor-pointer flex flex-col relative">
                        <div class="relative w-full pt-[75%] bg-slate-100 overflow-hidden">
                            <img src="${finalImg}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="封面" loading="lazy">
                            <div class="absolute top-2 left-2 bg-gradient-to-r ${badgeGrad} text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm" data-zh="👑 严选商用" data-en="👑 Premium">👑 严选商用</div>
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md text-white text-[10px] font-mono px-1.5 py-0.5 rounded">${p.category ? p.category.split('·')[0].trim() : '模板'}</div>
                        </div>
                        <div class="p-3.5 flex-1 flex flex-col justify-between bg-white">
                            <h4 class="text-sm font-bold text-slate-800 line-clamp-2 leading-snug group-hover:${textCol} transition tracking-tight" data-zh="${titleZh}" data-en="${titleEn}">${titleZh}</h4>
                            <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-50">
                                <span class="text-[11px] text-slate-400 font-medium truncate pr-2" data-zh="${catZh}" data-en="${catEn}">${catZh}</span>
                                <span class="hero-product-price text-[15px] font-black ${textCol} font-mono" data-zh="￥${rmb} RMB" data-en="$${usd} USD">￥${rmb} RMB</span>
                            </div>
                        </div>
                    </div>`;
            });
        },
        openDetailModal: function(id, title, img, priceRmb, editorUrl) {
            let modal = document.getElementById("productDetailModal");
            if (!modal) {
                modal = document.createElement("div");
                modal.id = "productDetailModal";
                modal.className = "hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4";
                document.body.appendChild(modal);
            }
            modal.innerHTML = `
                <div class="bg-white max-w-4xl w-full rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row relative animate-[fadeIn_0.2s_ease-out]">
                    <button onclick="document.getElementById('productDetailModal').classList.add('hidden')" class="absolute top-4 right-4 z-10 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/70 transition font-bold">✕</button>
                    <div class="md:w-3/5 bg-slate-100 relative min-h-[250px] md:min-h-[400px]">
                        <img src="${img}" class="absolute inset-0 w-full h-full object-cover" alt="预览">
                    </div>
                    <div class="md:w-2/5 p-6 md:p-8 flex flex-col justify-between bg-white">
                        <div>
                            <div class="text-[10px] font-mono text-blue-600 font-bold bg-blue-50 inline-block px-2 py-1 rounded mb-3">APEXWORK 官方自营资源</div>
                            <h2 class="text-xl font-black text-slate-900 leading-tight mb-2">${title}</h2>
                            <p class="text-xs text-slate-500 leading-relaxed mb-4">内置高阶版式与自动化数据源。100% 符合欧美与国内商用合规标准，无版权纠纷。</p>
                            <div class="space-y-2 mb-6 border-t border-b border-slate-100 py-4">
                                <div class="flex justify-between text-xs font-mono"><span class="text-slate-400">商用授权许可</span><span class="font-bold text-emerald-600">✓ 终身无限商用</span></div>
                                <div class="flex justify-between text-xs font-mono"><span class="text-slate-400">操作平台</span><span class="font-bold text-slate-700">网页端免装软件</span></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-end gap-2 mb-3">
                                <span class="text-2xl font-black text-orange-600 font-mono">￥${priceRmb}</span>
                            </div>
                            <button onclick="window.location.href='${editorUrl}?deck=${id}'" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                <span>⚡ 立即解锁并进入全能编辑器</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            modal.classList.remove("hidden");
        }
    };
  </script>

  <script>
    window.ApexCloudSync = {
      init: async function() {
        try {
          const resSec = await fetch('config/security.json?nocache=' + Date.now());
          if (resSec.ok) { const secData = await resSec.json(); if (secData.pwd) localStorage.setItem('APEX_ADMIN_PWD', secData.pwd); }
          const resPrice = await fetch('config/pricing.json?nocache=' + Date.now());
          if (resPrice.ok) {
            const priceData = await resPrice.json();
            localStorage.setItem('APEX_PRICING_CONFIG', JSON.stringify(priceData));
            if (window.ApexPricing) window.ApexPricing.applyPricing(window.ApexLang.currentLang);
          }
          const resBanner = await fetch('config/banner.json?nocache=' + Date.now());
          if (resBanner.ok) {
            const bannerData = await resBanner.json();
            localStorage.setItem('APEX_BANNER_CONFIG', JSON.stringify(bannerData));
            if (window.ApexHeroSlider) window.ApexHeroSlider.init();
          }
        } catch(e) {}
      }
    };

    window.ApexPricing = {
      getConfig: function() {
        const saved = localStorage.getItem('APEX_PRICING_CONFIG');
        const defaultConfig = { bundle: { rmb: 139, usd: 19.99 }, ppt: { rmb: 69, usd: 9.99 }, excel: { rmb: 69, usd: 9.99 }, word: { rmb: 69, usd: 9.99 } };
        if (!saved) return defaultConfig;
        try { return { ...defaultConfig, ...JSON.parse(saved) }; } catch (e) { return defaultConfig; }
      },
      applyPricing: function(lang = 'zh') {
        const config = this.getConfig();
        const isEn = lang === 'en';
        document.querySelectorAll('.hero-bundle-price').forEach(el => {
          const zhText = `¥${config.bundle.rmb} RMB`; const enText = `$${config.bundle.usd} USD`;
          el.setAttribute('data-zh', zhText); el.setAttribute('data-en', enText); el.innerText = isEn ? enText : zhText;
        });
        document.querySelectorAll('.hero-product-price').forEach(el => {
            const text = el.getAttribute(`data-${lang}`);
            if (text) el.innerText = text;
        });
      }
    };

    window.ApexLang = {
      currentLang: localStorage.getItem('APEX_LANG') || 'zh',
      init: function() { this.apply(this.currentLang); },
      toggle: function() {
        this.currentLang = this.currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('APEX_LANG', this.currentLang);
        this.apply(this.currentLang);
      },
      apply: function(lang) {
        document.querySelectorAll('[data-zh][data-en]').forEach(el => {
          const text = el.getAttribute(`data-${lang}`);
          if (text) el.innerText = text;
        });
        const btn = document.getElementById('langToggleBtn');
        if (btn) btn.innerText = lang === 'zh' ? '🌐 EN / 简' : '🌐 简 / EN';
        if (window.ApexPricing) window.ApexPricing.applyPricing(lang);
        if (typeof initUserRoleBadge === 'function') initUserRoleBadge();
      }
    };

    window.ApexHeroSlider = {
      currentIndex: 0, timer: null, slidesData: [],
      init: function() {
        const saved = localStorage.getItem('APEX_BANNER_CONFIG');
        const defaultSlides = [
          { tag: "ADMIN BANNER 01", titleZh: "破除低效传统冗长，全视觉商业交付新纪元", titleEn: "Break traditional inefficiencies, start a visual business delivery era", descZh: "覆盖 PPT 战略、EXCEL 财务模型与 WORD 报告。", descEn: "Covering PPT strategies, EXCEL models and WORD reports.", bgStyle: "linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)", bgImg: "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&w=1280&q=80" },
          { tag: "GLOBAL COMPLIANCE 02", titleZh: "零注册无缝收单，满足欧美 GDPR 与金融审计", titleEn: "Zero-Registration Seamless Checkout, GDPR Compliant", descZh: "一键导出标准格式，支持全球自动结算。", descEn: "One-click export standard formats, global automatic settlement.", bgStyle: "linear-gradient(135deg, #064e3b 0%, #0f172a 100%)", bgImg: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1280&q=80" }
        ];
        let rawData = saved ? JSON.parse(saved) : defaultSlides;
        this.slidesData = rawData.map((s, i) => {
            const fallback = defaultSlides[i] || defaultSlides[0];
            return { ...s, titleZh: s.titleZh || s.title || fallback.titleZh, titleEn: s.titleEn || fallback.titleEn, descZh: s.descZh || s.desc || fallback.descZh, descEn: s.descEn || fallback.descEn, bgImg: s.bgImg || fallback.bgImg };
        });

        const container = document.getElementById('dynamicHeroContainer');
        if (!container) return;
        const config = window.ApexPricing ? window.ApexPricing.getConfig() : { bundle: { rmb: 139, usd: 19.99 } };

        container.innerHTML = this.slidesData.map((s, idx) => `
            <div id="hero-slide-${idx}" class="hero-slide ${idx === 0 ? 'flex' : 'hidden'} flex-col md:flex-row justify-between items-start md:items-center gap-6 w-full animate-[fadeIn_0.5s_ease-out]">
              <div>
                <span class="bg-blue-500/20 text-blue-400 border border-blue-500/40 text-[10px] font-mono px-2.5 py-0.5 rounded font-bold uppercase backdrop-blur-sm shadow-sm">${s.tag || 'BANNER'}</span>
                <h2 class="hero-slide-title text-2xl md:text-3xl font-black tracking-tight mt-3 leading-snug drop-shadow-lg" data-zh="${s.titleZh}" data-en="${s.titleEn || s.titleZh}">${s.titleZh}</h2>
                <p class="hero-slide-desc text-sm text-slate-200 mt-2 leading-relaxed max-w-2xl drop-shadow-md" data-zh="${s.descZh}" data-en="${s.descEn || s.descZh}">${s.descZh}</p>
              </div>
              <button onclick="openBundleCheckout()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm px-8 py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] flex items-center justify-center gap-3 border border-blue-400/30">
                  <span data-zh="⚡ 立即解锁商用三件套包" data-en="⚡ Unlock Commercial Bundle">⚡ 立即解锁商用三件套包</span>
                  <span class="hero-bundle-price text-white font-black" data-zh="¥${config.bundle.rmb} RMB" data-en="$${config.bundle.usd} USD">¥${config.bundle.rmb} RMB</span>
              </button>
            </div>
        `).join('');

        this.jump(0);
        this.startAutoPlay(this.slidesData.length);
        if (window.ApexLang) window.ApexLang.apply(window.ApexLang.currentLang);
      },
      jump: function(idx) {
        const total = document.querySelectorAll('.hero-slide').length;
        if (total === 0) return;
        for (let i = 0; i < total; i++) {
          const el = document.getElementById(`hero-slide-${i}`);
          const dot = document.querySelectorAll('.dot')[i];
          if (el) { if (i === idx) { el.classList.remove('hidden'); el.classList.add('flex'); } else { el.classList.remove('flex'); el.classList.add('hidden'); } }
          if (dot) dot.style.backgroundColor = i === idx ? '#ffffff' : 'rgba(255,255,255,0.4)';
        }
        const box = document.getElementById('heroBannerBox');
        if (box && this.slidesData[idx]) {
          if (this.slidesData[idx].bgImg) { box.style.backgroundImage = `linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.5)), url('${this.slidesData[idx].bgImg}')`; box.style.backgroundSize = "cover"; box.style.backgroundPosition = "center"; }
          else { box.style.backgroundImage = this.slidesData[idx].bgStyle; }
        }
        this.currentIndex = idx;
      },
      startAutoPlay: function(total) {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => { this.currentIndex = (this.currentIndex + 1) % total; this.jump(this.currentIndex); }, 5000);
      }
    };

    function initUserRoleBadge() {
      const badge = document.getElementById('userRoleBadge');
      const portalBtn = document.getElementById('adminSecretPortal');
      const role = localStorage.getItem('APEX_USER_ROLE');
      const isEn = window.ApexLang && window.ApexLang.currentLang === 'en';
      
      if (role === 'ADMIN' && badge) {
        badge.setAttribute('data-zh', '👑 董事长 [ADMIN]');
        badge.setAttribute('data-en', '👑 Chairman [ADMIN]'); 
        badge.className = "bg-gradient-to-r from-blue-600 to-indigo-600 text-white border border-blue-400/30 px-3 py-1 rounded-lg font-black text-xs shadow-md transition select-none";
        badge.innerText = isEn ? '👑 Chairman [ADMIN]' : '👑 董事长 [ADMIN]';
        if (portalBtn) portalBtn.classList.remove('hidden');
      } else if (badge) {
        badge.setAttribute('data-zh', '👤 游客');
        badge.setAttribute('data-en', '👤 Visitor');
        badge.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-1 rounded-lg font-bold text-xs shadow-sm transition select-none";
        badge.innerText = isEn ? '👤 Visitor' : '👤 游客';
        if (portalBtn) portalBtn.classList.add('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      ApexHeroSlider.init();
      window.ApexLang.init();
      initUserRoleBadge();
      window.ApexCloudSync.init();
      setTimeout(() => { if (window.ApexMallGallery) window.ApexMallGallery.init(); }, 100);
    });

    (function initFrontLogo() {
        const customLogo = localStorage.getItem('APEX_CUSTOM_LOGO');
        const frontLogoEl = document.getElementById('frontBrandLogo');
        const badgeEl = document.getElementById('frontFallbackBadge');
        if (customLogo && frontLogoEl) {
            frontLogoEl.src = customLogo; 
            frontLogoEl.style.display = 'block';
            if (badgeEl) badgeEl.classList.add('hidden');
        }
    })();

    function checkChairmanStealthAccess() {
        const validPwd = localStorage.getItem("APEX_ADMIN_PWD") || "8888";
        const pwd = prompt("👑 [安全防护网关] 请输入管理员身份口令：", "");
        if (pwd === validPwd) {
            localStorage.setItem("APEX_USER_ROLE", "ADMIN"); initUserRoleBadge();
            alert("✅ 身份校验成功！驾驶舱通道已激活，点击右上角【👑 驾驶舱 →】进入。");
        } else if (pwd !== null) { alert("❌ 口令错误，系统拦截进入！"); }
    }

    window.openBundleCheckout = function() {
      if (window.ApexAuth && window.ApexAuth.openCheckout) {
        ApexAuth.openCheckout({ title: "顶尖智能商务办公平台 · 商业企业全能包", onSuccess: () => alert("🎉 您已激活全站商用权限！") });
      }
    };
  </script>
</body>
</html>
