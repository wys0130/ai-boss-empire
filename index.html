<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEXWORK - 极速商业交付 SaaS</title>
  
  <!-- 1. 预连接（立即执行，确保 50ms 红线） -->
  <link rel="preconnect" href="https://apexwork.cn" crossorigin="anonymous">
  <link rel="preconnect" href="https://apexwork.workers.dev" crossorigin="anonymous">
  <link rel="preconnect" href="https://apexwork.github.io" crossorigin="anonymous">
  
  <!-- 2. DNS 分流路由器（核心） -->
  <script src="/components/dns-router.min.js" defer></script>
  
  <!-- 3. 关键 CSS（内联，避免阻塞） -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #fff; overflow-x: hidden; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .hero h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; margin-bottom: 1rem; }
    .hero p { font-size: clamp(1rem, 2vw, 1.5rem); opacity: 0.9; margin-bottom: 2rem; }
    .cta-btn { padding: 1rem 3rem; font-size: 1.2rem; background: #fff; color: #667eea; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; transition: transform 0.3s; }
    .cta-btn:hover { transform: scale(1.05); }
    .status-badge { position: fixed; top: 20px; right: 20px; padding: 8px 16px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <!-- 状态徽章（实时显示分流状态） -->
  <div class="status-badge" id="dns-status">
    <div class="status-dot"></div>
    <span id="dns-region">检测中...</span>
  </div>

  <!-- 主视觉（少字多图原则） -->
  <section class="hero">
    <h1>⚡ 极速商业交付</h1>
    <p>PPT · Excel · Word 三件套，1 秒极速生成</p>
    <button class="cta-btn" onclick="window.location.href='/templates'">立即开始</button>
  </section>

  <!-- DNS 状态监听 -->
  <script>
    document.addEventListener('dns-routed', function(e) {
      const region = e.detail.region === 'domestic' ? '🇨🇳 国内镜像' : '🌐 海外边缘';
      const endpoint = e.detail.endpoint;
      document.getElementById('dns-region').textContent = `${region} · ${new URL(endpoint).hostname}`;
    });
  </script>
</body>
</html>
