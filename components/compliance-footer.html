<!-- /components/compliance-footer.html -->
<style>
  .audit-footer {
    background: #0b0f19;
    color: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    padding: 40px 20px;
    border-top: 1px solid #1e293b;
    margin-top: 60px;
  }
  .audit-footer-content {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;

    gap: 20px;
  }
  .audit-links {
    display: flex;
    gap: 20px;

  }
  .audit-links button {
    color: #94a3b8;

    border: none;

  .audit-links button:hover {
    color: #f8fafc;
    text-decoration: underline;
  }
  .audit-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 100000;
    align-items: center;
    justify-content: center;
    padding: 20px;

  .audit-modal-card {
    background: #0f172a;
