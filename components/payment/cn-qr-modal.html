<!-- 扫码支付弹窗 - 视觉冲击，极简 -->
<div id="cn-qr-modal" class="cn-qr-modal" style="display:none;">
  <div class="cn-qr-modal-backdrop" onclick="CNPaywall.closeModal()"></div>
  <div class="cn-qr-modal-card">
    <button class="cn-qr-modal-close" onclick="CNPaywall.closeModal()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#999" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
    <div class="cn-qr-modal-title">扫码支付</div>
    <div class="cn-qr-modal-amount">$9.99</div>
    <div class="cn-qr-modal-qr" id="cn-modal-qr-container">
      <!-- 动态二维码注入点 -->
    </div>
    <div class="cn-qr-modal-tip">请使用<span id="cn-modal-channel-name">微信</span>扫码</div>
    <div class="cn-qr-modal-timer" id="cn-qr-timer">二维码有效期 <span id="cn-qr-countdown">300</span>s</div>
  </div>
</div>
