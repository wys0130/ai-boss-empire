<!-- 境内专属隔离收银台 - 微信/支付宝官方扫码直连 -->
<!-- 少字多图，视觉冲击，零注册，1秒极速 -->
<div id="cn-paywall" class="cn-paywall" style="display:none;">
  <div class="cn-paywall-card">
    <!-- 视觉冲击区：动态能量表 -->
    <div class="cn-paywall-hero">
      <svg viewBox="0 0 200 60" class="cn-energy-bar">
        <defs>
          <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#07C160;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1AAD19;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect x="10" y="20" width="180" height="20" rx="10" fill="#E8E8E8"/>
        <rect x="10" y="20" width="180" height="20" rx="10" fill="url(#cnGrad)">
          <animate attributeName="width" from="0" to="180" dur="1.5s" fill="freeze"/>
        </rect>
        <text x="100" y="35" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">VIP 极速解锁</text>
      </svg>
    </div>

    <!-- 一句话核心卖点 -->
    <h2 class="cn-paywall-title">$9.99 永久解锁</h2>
    <p class="cn-paywall-sub">微信 / 支付宝 扫码即开</p>

    <!-- 双通道扫码区 -->
    <div class="cn-paywall-qr-grid">
      <!-- 微信通道 -->
      <div class="cn-qr-channel" data-channel="wechat">
        <div class="cn-qr-box" id="cn-wechat-qr">
          <!-- 动态二维码占位 - 由JS注入 -->
          <div class="cn-qr-loading">
            <svg viewBox="0 0 50 50" class="cn-spinner">
              <circle cx="25" cy="25" r="20" fill="none" stroke="#07C160" stroke-width="4" stroke-dasharray="80,30">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
              </circle>
            </svg>
          </div>
        </div>
        <div class="cn-qr-label">
          <svg viewBox="0 0 24 24" class="cn-icon">
            <path fill="#07C160" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.403-1.412-.185-2.965.725-4.22 1.197-1.647 3.234-2.596 5.507-2.596.18 0 .358.009.535.022-.585-2.643-3.107-4.528-6.486-4.528zM5.7 6.18c.642 0 1.162.53 1.162 1.183 0 .652-.52 1.182-1.162 1.182-.641 0-1.161-.53-1.161-1.182 0-.653.52-1.183 1.161-1.183zm5.828 0c.642 0 1.162.53 1.162 1.183 0 .652-.52 1.182-1.162 1.182-.641 0-1.161-.53-1.161-1.182 0-.653.52-1.183 1.161-1.183zM23.04 14.373c0-3.36-3.28-6.084-7.326-6.084-4.047 0-7.326 2.724-7.326 6.084 0 3.36 3.28 6.084 7.326 6.084.787 0 1.553-.108 2.264-.296a.63.63 0 01.522.071l1.397.817a.238.238 0 00.122.04c.117 0 .212-.096.212-.216 0-.052-.021-.104-.035-.156l-.284-1.078a.43.43 0 01.156-.486c1.334-.96 2.172-2.442 2.172-4.096zm-9.79-1.322c-.47 0-.85-.388-.85-.866 0-.478.38-.866.85-.866.469 0 .85.388.85.866 0 .478-.381.866-.85.866zm4.927 0c-.469 0-.85-.388-.85-.866 0-.478.381-.866.85-.866.47 0 .85.388.85.866 0 .478-.38.866-.85.866z"/>
          </svg>
          <span>微信支付</span>
        </div>
      </div>

      <!-- 支付宝通道 -->
      <div class="cn-qr-channel" data-channel="alipay">
        <div class="cn-qr-box" id="cn-alipay-qr">
          <div class="cn-qr-loading">
            <svg viewBox="0 0 50 50" class="cn-spinner">
              <circle cx="25" cy="25" r="20" fill="none" stroke="#1677FF" stroke-width="4" stroke-dasharray="80,30">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
              </circle>
            </svg>
          </div>
        </div>
        <div class="cn-qr-label">
          <svg viewBox="0 0 24 24" class="cn-icon">
            <path fill="#1677FF" d="M21.422 15.358c-3.22-1.386-3.87-2.37-3.87-2.37.594-.942 1.254-2.184 1.62-3.264h-3.3V7.932h5.544V6.06h-5.544V2.4h-3.3v3.66H7.602v1.872h5.07v1.792H7.602v1.872h8.778c-.264.726-.66 1.452-1.056 2.046-.792-1.056-2.31-1.782-3.96-1.782-2.442 0-4.422 1.782-4.422 3.978 0 2.196 1.98 3.978 4.422 3.978 1.452 0 2.772-.66 3.564-1.782.858 1.32 2.64 2.574 4.752 3.3-.132 1.122-.462 2.046-.924 2.772-1.188-.132-3.168-.462-5.28-1.32-2.442 1.122-5.214 1.782-7.854 1.782C4.29 21.6 1.2 18.906 1.2 15.69c0-3.234 3.09-5.94 6.798-5.94 1.32 0 2.574.33 3.63.924-.462.66-.858 1.386-1.188 2.178-.792-.594-1.584-.858-2.442-.858-2.046 0-3.696 1.584-3.696 3.564 0 1.98 1.65 3.564 3.696 3.564 1.848 0 3.432-1.32 3.63-3.036.264-.132.528-.264.792-.33-.132 1.716.726 3.036 2.046 3.96-.66.528-1.452.858-2.31 1.056.528.132 1.056.198 1.584.198 1.848 0 3.564-.528 4.884-1.452.858.594 1.98 1.056 3.102 1.386l.132-.198c-.198-.858-.33-1.848-.33-2.838 0-.132 0-.264.006-.396zM7.998 17.856c-1.32 0-2.376-.924-2.376-2.112 0-1.188 1.056-2.112 2.376-2.112.792 0 1.518.33 2.046.924.132.132.198.264.33.396-.264 1.452-1.254 2.574-2.376 2.904z"/>
          </svg>
          <span>支付宝</span>
        </div>
      </div>
    </div>

    <!-- 状态提示区 -->
    <div class="cn-paywall-status" id="cn-paywall-status">
      <div class="cn-status-dot"></div>
      <span>等待扫码支付...</span>
    </div>

    <!-- 安全签名徽章 -->
    <div class="cn-paywall-security">
      <svg viewBox="0 0 24 24" class="cn-shield">
        <path fill="#07C160" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
      <span>Ed25519 安全签名 · 零注册 · 即付即用</span>
    </div>
  </div>
</div>
